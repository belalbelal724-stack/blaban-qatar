// ===================== STORAGE =====================
let appData = {};
let tasksData = []; // [{id, title, desc, branch, priority, deadline, createdAt, status, completedAt, comments:[{author,role,text,timestamp,type}]}]

function initData() {
  try {
    const saved = localStorage.getItem('blaban_data_v3');
    if (saved) appData = JSON.parse(saved);
    else {
      const old = localStorage.getItem('blaban_data_v2');
      if (old) { appData = JSON.parse(old); saveData(); }
    }
  } catch(e) { appData = {}; }
  
  try {
    const tsk = localStorage.getItem('blaban_tasks_v1');
    if (tsk) tasksData = JSON.parse(tsk);
  } catch(e) { tasksData = []; }
}

function saveData() {
  try { localStorage.setItem('blaban_data_v3', JSON.stringify(appData)); }
  catch(e) { localStorage.removeItem('blaban_data_v2'); localStorage.setItem('blaban_data_v3', JSON.stringify(appData)); }
  // Push to firebase if connected
  if (typeof pushDataToFirebase === 'function') pushDataToFirebase();
}

function saveTasks() {
  try { localStorage.setItem('blaban_tasks_v1', JSON.stringify(tasksData)); }
  catch(e) { console.error('Tasks save failed', e); }
  if (typeof pushDataToFirebase === 'function') pushDataToFirebase();
}

function getKey(branch, month, day) { return `${branch}_${month}_${day}`; }

function getVisitData(branch, month, day) {
  const key = getKey(branch, month, day);
  if (!appData[key]) appData[key] = { manager:'', shift:'', results:{}, deptAssign:{}, notes:{}, images:{}, reported24h:{}, comments:{} };
  if (!appData[key].reported24h) appData[key].reported24h = {};
  if (!appData[key].comments) appData[key].comments = {};
  return appData[key];
}

// ===================== SMART SCORING =====================
function calcSmartScore(branch, month, day) {
  const visit = getVisitData(branch, month, day);
  const allItems = CHECKLIST.flatMap(s => s.items);
  let ok = 0, excused = 0, deducted = 0;
  const excusedItems = [], deductedItems = [];
  allItems.forEach(item => {
    const result = visit.results[item.id];
    if (result === 'ok') { ok++; return; }
    if (result === 'fail') {
      const dept = visit.deptAssign[item.id] || 'الفرع';
      if (dept === 'الفرع') { deducted++; deductedItems.push({ item, dept }); }
      else if (visit.reported24h[item.id] === true) { excused++; excusedItems.push({ item, dept }); }
      else { deducted++; deductedItems.push({ item, dept }); }
    }
  });
  const answered = ok + excused + deducted;
  const pct = answered > 0 ? Math.round(((ok + excused) / answered) * 100) : null;
  return { pct, ok, excused, deducted, answered, excusedItems, deductedItems };
}

// ===================== DEVICE VIEW =====================
function setDeviceView(mode) {
  document.body.classList.remove('view-desktop','view-tablet','view-mobile');
  if (mode !== 'desktop') document.body.classList.add(`view-${mode}`);
  document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
  const id = `dev${mode.charAt(0).toUpperCase()+mode.slice(1)}`;
  const el = document.getElementById(id);
  if(el) el.classList.add('active');
  localStorage.setItem('blaban_device', mode);
}

// ===================== ROLE SWITCHER =====================
function setRole(role) {
  currentRole = role;
  document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(role==='ops'?'roleOps':'roleManager').classList.add('active');
  
  // Filter tabs by role
  document.querySelectorAll('.nav-tab').forEach(tab => {
    const tabRole = tab.getAttribute('data-role');
    if (tabRole === 'both') tab.style.display = '';
    else if (tabRole === role) tab.style.display = '';
    else tab.style.display = 'none';
  });

  // Branch selector bar visible only for ops
  const bsBar = document.getElementById('branchSelectorBar');
  if (bsBar) bsBar.style.display = role === 'ops' ? '' : 'none';
  
  // If current page is hidden, switch to first available
  const activeTab = document.querySelector('.nav-tab.active');
  if (activeTab && activeTab.style.display === 'none') {
    if (role === 'manager') showPage('tasks');
    else showPage('branch-view');
  }
  
  localStorage.setItem('blaban_role', role);
  updateTasksBadge();
  showNotif(role === 'ops' ? '🌐 وضع مدير التشغيل' : '👔 وضع مدير الفرع', 'info');
}

// Selected branch state (for the unified branch view)
let selectedBranch = localStorage.getItem('blaban_selected_branch') || 'nasr';

function onBranchSelectChange(branch) {
  selectedBranch = branch;
  localStorage.setItem('blaban_selected_branch', branch);
  // Hide all branch sub-pages, show selected
  document.querySelectorAll('.branch-page').forEach(p => p.style.display = 'none');
  const target = document.getElementById(`branch-${branch}`);
  if (target) target.style.display = 'block';
  // Re-render that branch (in case data changed)
  if (typeof renderBranch === 'function') renderBranch(branch);
}

// ===================== UI HELPERS =====================
let notifTimer = null;
function showNotif(msg, type = 'info') {
  const n = document.getElementById('notif');
  n.textContent = msg;
  const colors = { success:'#1a5c2e', error:'#5c1a1a', info:'#1a2a5c', warning:'#5c3a1a' };
  n.style.background = colors[type] || colors.info;
  n.classList.add('show');
  clearTimeout(notifTimer);
  notifTimer = setTimeout(() => n.classList.remove('show'), 3500);
}

function toggleMode() {
  isDark = !isDark;
  document.body.classList.toggle('light-mode', !isDark);
  document.getElementById('modeToggle').textContent = isDark ? '🌙 داكن' : '☀️ فاتح';
  localStorage.setItem('blaban_mode', isDark ? 'dark' : 'light');
}

function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  const page = document.getElementById(pageId);
  if (page) {
    page.classList.add('active');
    const renders = {
      'dashboard': renderDashboardPage,
      'tasks': renderTasksPage,
      'managers': renderManagersPage,
      'analytics': renderAnalyticsPage,
      'recommendations': renderRecommendationsPage,
      'ops-manager': renderOpsPage,
      'other-depts': renderDeptsPage
    };
    if (renders[pageId]) renders[pageId]();
    // Special handling: branch-view must re-render the currently selected branch
    if (pageId === 'branch-view' && typeof renderBranch === 'function') {
      renderBranch(selectedBranch);
    }
  }
  document.querySelectorAll('.nav-tab').forEach(t => { if (t.getAttribute('data-page') === pageId) t.classList.add('active'); });
  const activeTab = document.querySelector(`.nav-tab[data-page="${pageId}"]`);
  if (activeTab) activeTab.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
}
