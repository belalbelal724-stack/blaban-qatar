<script>
// ===================== UNIFIED SHARING MODULE =====================
function openShareModal(scope, branch, branchName) {
  shareState = { scope, branch: branch||null, branchName: branchName||null, format: 'text' };
  const modal = document.getElementById('shareModal');
  if (!modal) return;

  const scopeNames = {
    'branch': `فرع ${branchName||''}`,
    'weekly': 'تحليل أداء الأسبوع',
    'all': 'التقرير الكامل',
    'managers': 'تقييم المديرين',
    'analytics': 'التحليلات',
    'action-plan': 'خطة العمل'
  };
  const infoEl = document.getElementById('shareModalInfo');
  if (infoEl) infoEl.textContent = `📤 ${scopeNames[scope] || 'التقرير'}`;

  // Reset format buttons
  ['fmtTextBtn','fmtSheetsBtn','fmtExcelBtn'].forEach(id => {
    const b = document.getElementById(id);
    if (b) {
      b.classList.remove('btn-gold');
      b.classList.add('btn-primary');
    }
  });
  const tb = document.getElementById('fmtTextBtn');
  if (tb) { tb.classList.remove('btn-primary'); tb.classList.add('btn-gold'); }

  updateShareHint();
  modal.classList.remove('hidden');
}

function closeShareModal() {
  const m = document.getElementById('shareModal');
  if (m) m.classList.add('hidden');
}

function setShareFormat(format) {
  shareState.format = format;
  ['fmtTextBtn','fmtSheetsBtn','fmtExcelBtn'].forEach(id => {
    const b = document.getElementById(id);
    if (b) {
      b.classList.remove('btn-gold');
      b.classList.add('btn-primary');
    }
  });
  const map = { text:'fmtTextBtn', sheets:'fmtSheetsBtn', excel:'fmtExcelBtn' };
  const btn = document.getElementById(map[format]);
  if (btn) { btn.classList.remove('btn-primary'); btn.classList.add('btn-gold'); }
  updateShareHint();
}

function updateShareHint() {
  const hintEl = document.getElementById('fmtHint');
  if (!hintEl) return;
  const fmt = shareState.format;
  let txt = '';
  if (fmt === 'text') {
    txt = '📝 ملخص نصي يُرسَل مباشرةً عبر القناة المختارة (يحتوي البنود غير المطابقة فقط).';
  } else if (fmt === 'excel') {
    txt = '📊 يتم تحميل ملف Excel على جهازك أولاً (يحتوي البنود غير المطابقة + الأكشن بلان فقط)، ثم فتح القناة لإرفاقه يدوياً.';
  } else if (fmt === 'sheets') {
    txt = '📋 يتم رفع التقرير لـ Google Sheets ومشاركة الرابط. يتطلب اتصال بالإنترنت وحساب Google.';
  }
  hintEl.innerHTML = txt;
}

function buildBranchMessage(branch) {
  const month = getSelMonth(branch), day = getSelDay(branch);
  const visit = getVisitData(branch, month, day);
  const branchName = BRANCH_NAMES[branch];
  const { pct, ok, excused, deducted, answered } = calcSmartScore(branch, month, day);
  const allItems = CHECKLIST.flatMap(s=>s.items);
  const failItems = allItems.filter(i => visit.results[i.id] === 'fail');

  const lines = [];
  lines.push(`🥛 *تقرير فرع ${branchName} — ب لبن قطر*`);
  lines.push(`─────────────────────`);
  lines.push(`📅 ${day} ${MONTHS[month]} 2026`);
  lines.push(`👔 المدير: ${visit.manager || '-'}`);
  lines.push(`⏰ الشيفت: ${visit.shift || '-'}`);
  lines.push(`─────────────────────`);
  if (answered === 0) {
    lines.push(`⚠️ لا توجد بيانات لهذا اليوم`);
  } else {
    const rating = pct>=90?'🟢 ممتاز':pct>=70?'🟡 مقبول':'🔴 يحتاج تحسين';
    lines.push(`📊 *النتيجة: ${pct}%*  ${rating}`);
    lines.push(`✅ مطابق: ${ok+excused}  |  ❌ مخصوم: ${deducted}${excused>0?`  |  🛡️ معفى: ${excused}`:''}`);
    if (failItems.length > 0) {
      lines.push(`─────────────────────`);
      lines.push(`🔴 *البنود غير المطابقة (${failItems.length}):*`);
      failItems.slice(0, 12).forEach(item => {
        const dept = visit.deptAssign[item.id] || 'الفرع';
        const isExcused = dept !== 'الفرع' && visit.reported24h?.[item.id] === true;
        const note = visit.notes?.[item.id] || '';
        const comment = visit.comments?.[item.id] || '';
        lines.push(`${item.icon} ${item.text.substring(0,55)}`);
        lines.push(`   ↳ ${dept}${isExcused?' (معفى ✓)':''}`);
        if (note) lines.push(`   📝 ${note}`);
        if (comment) lines.push(`   💬 ${comment}`);
      });
      if (failItems.length > 12) lines.push(`...و${failItems.length-12} بنود إضافية`);
    } else {
      lines.push(`─────────────────────`);
      lines.push(`✨ جميع البنود مطابقة!`);
    }
  }
  lines.push(`─────────────────────`);
  lines.push(`✍️ *بِلَال الأَنْصَارِي — مدير التشغيل*`);
  return lines.join('\n');
}

function buildShareMessage(scope) {
  if (scope === 'branch') {
    return buildBranchMessage(shareState.branch);
  }

  if (scope === 'weekly') {
    const wa = window._lastWeeklyAnalysis;
    if (!wa) return null;
    const lines = [];
    lines.push(`🥛 *تحليل أداء الأسبوع — ب لبن قطر*`);
    lines.push(`─────────────────────`);
    lines.push(`📅 الفترة: ${wa.startStr} → ${wa.endStr}`);
    lines.push(`📊 *متوسط الأداء العام: ${wa.overallAvg}%*  ${wa.overallAvg>=90?'🟢 ممتاز':wa.overallAvg>=70?'🟡 مقبول':'🔴 يحتاج تحسين'}`);
    if (wa.bestBranch) lines.push(`🏆 الأفضل: ${BRANCH_NAMES[wa.bestBranch]} (${wa.bestPct}%)`);
    if (wa.worstBranch) lines.push(`⚠️ الأقل: ${BRANCH_NAMES[wa.worstBranch]} (${wa.worstPct}%)`);
    lines.push(`─────────────────────`);
    lines.push(`📈 *أداء كل فرع:*`);
    BRANCHES.forEach(b => {
      const bs = wa.branchSummary[b];
      if (!bs || bs.count === 0) {
        lines.push(`• ${BRANCH_NAMES[b]}: لا توجد بيانات`);
        return;
      }
      const trendIcon = bs.trend==='up'?'📈':bs.trend==='down'?'📉':'➡️';
      lines.push(`• ${BRANCH_NAMES[b]}: ${bs.avg}% ${trendIcon} (${bs.count} زيارة)`);
    });
    if (wa.topFails && wa.topFails.length > 0) {
      lines.push(`─────────────────────`);
      lines.push(`🔴 *أكثر البنود تكراراً:*`);
      wa.topFails.slice(0, 5).forEach((tf, i) => {
        lines.push(`${i+1}. ${tf.icon||''} ${tf.text.substring(0,50)} (${tf.count}×)`);
      });
    }
    if (wa.recommendations && wa.recommendations.length > 0) {
      lines.push(`─────────────────────`);
      lines.push(`💡 *التوصيات:*`);
      wa.recommendations.forEach((r, i) => lines.push(`${i+1}. ${r}`));
    }
    lines.push(`─────────────────────`);
    lines.push(`✍️ *بِلَال الأَنْصَارِي — مدير التشغيل*`);
    return lines.join('\n');
  }

  if (scope === 'all' || scope === 'analytics') {
    const lines = [];
    lines.push(`🥛 *تقرير أداء الفروع — ب لبن قطر*`);
    lines.push(`─────────────────────`);
    lines.push(`📅 ${currentDay} ${MONTHS[currentMonth]} 2026`);
    lines.push(`─────────────────────`);
    lines.push(`📊 *ملخص الفروع اليوم:*`);
    BRANCHES.forEach(b => {
      const visit = getVisitData(b, currentMonth, currentDay);
      const { pct, ok, excused, deducted, answered } = calcSmartScore(b, currentMonth, currentDay);
      if (answered === 0) {
        lines.push(`• ${BRANCH_NAMES[b]}: لا توجد بيانات`);
        return;
      }
      const rating = pct>=90?'🟢':pct>=70?'🟡':'🔴';
      lines.push(`${rating} ${BRANCH_NAMES[b]}: ${pct}% (مدير: ${visit.manager||'-'})`);
      lines.push(`   مطابق ${ok+excused} | مخصوم ${deducted}${excused>0?` | معفى ${excused}`:''}`);
    });
    lines.push(`─────────────────────`);
    lines.push(`✍️ *بِلَال الأَنْصَارِي — مدير التشغيل*`);
    lines.push(`🕐 ${new Date().toLocaleTimeString('ar-QA',{hour:'2-digit',minute:'2-digit'})}`);
    return lines.join('\n');
  }

  if (scope === 'managers') {
    const stats = buildManagerStats();
    const lines = [];
    lines.push(`🥛 *تقييم المديرين — ب لبن قطر*`);
    lines.push(`─────────────────────`);
    if (Object.keys(stats).length === 0) {
      lines.push('لا توجد بيانات بعد.');
    } else {
      const sorted = Object.entries(stats).sort((a,b) => {
        const aA = a[1].visits.reduce((s,v)=>s+v.pct,0)/a[1].visits.length;
        const bA = b[1].visits.reduce((s,v)=>s+v.pct,0)/b[1].visits.length;
        return bA - aA;
      });
      sorted.forEach(([name, s]) => {
        const avg = Math.round(s.visits.reduce((t,v)=>t+v.pct,0)/s.visits.length);
        const trend = analyzeManagerTrend(s.visits);
        const ti = trend.trend==='up'?'📈':trend.trend==='down'?'📉':'➡️';
        const rating = avg>=90?'🟢':avg>=70?'🟡':'🔴';
        lines.push(`${rating} *${name}* — ${avg}% ${ti}`);
        lines.push(`   زيارات: ${s.visits.length} | فروع: ${[...s.branches].map(b=>BRANCH_NAMES[b]).join(', ')}`);
      });
    }
    lines.push(`─────────────────────`);
    lines.push(`✍️ *بِلَال الأَنْصَارِي — مدير التشغيل*`);
    return lines.join('\n');
  }

  if (scope === 'action-plan') {
    const lines = [];
    lines.push(`🥛 *خطة العمل — ب لبن قطر*`);
    lines.push(`─────────────────────`);
    lines.push(`📅 ${currentDay} ${MONTHS[currentMonth]} 2026`);
    lines.push(`─────────────────────`);
    let count = 0;
    BRANCHES.forEach(branch => {
      const visit = getVisitData(branch, currentMonth, currentDay);
      const failItems = CHECKLIST.flatMap(s=>s.items).filter(i=>visit.results[i.id]==='fail');
      if (failItems.length === 0) return;
      lines.push(`*${BRANCH_NAMES[branch]}:*`);
      failItems.slice(0, 6).forEach(item => {
        const dept = visit.deptAssign[item.id]||'الفرع';
        const note = visit.notes?.[item.id]||'';
        lines.push(`  ${item.icon} ${item.text.substring(0,45)} → ${dept}${note?` | ${note}`:''}`);
        count++;
      });
      lines.push('');
    });
    if (count === 0) lines.push('✅ لا توجد بنود تحتاج أكشن بلان اليوم.');
    lines.push(`─────────────────────`);
    lines.push(`✍️ *بِلَال الأَنْصَارِي — مدير التشغيل*`);
    return lines.join('\n');
  }

  return null;
}

function executeShareFile(scope) {
  const fmt = shareState.format;
  if (fmt === 'sheets') {
    // Export to Google Sheets
    exportToGoogleSheets(scope);
  } else if (fmt === 'excel') {
    if (scope === 'branch') exportBranchDailyExcel(shareState.branch, shareState.branchName);
    else if (scope === 'weekly') exportWeeklyExcel();
    else if (scope === 'managers') exportManagersExcel();
    else if (scope === 'analytics') exportAllExcel();
    else if (scope === 'action-plan') exportActionPlanExcel();
    else if (scope === 'all') exportAllExcel();
    else exportAllExcel();
  }
}

function executeShare(channel) {
  const scope = shareState.scope;
  const fmt = shareState.format;

  if (channel === 'download') {
    if (fmt === 'text') {
      const msg = buildShareMessage(scope);
      if (!msg) { showNotif('⚠️ لا توجد بيانات', 'error'); return; }
      const blob = new Blob([msg], { type:'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `تقرير_${scope}_${new Date().toISOString().split('T')[0]}.txt`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showNotif('✅ تم التحميل', 'success');
    } else {
      executeShareFile(scope);
    }
    closeShareModal();
    return;
  }

  if (fmt === 'excel' || fmt === 'sheets') {
    executeShareFile(scope);
    setTimeout(() => {
      if (channel === 'whatsapp' || channel === 'telegram') {
        openContactModal(channel === 'telegram' ? 'telegram' : 'phone', channel);
      } else if (channel === 'email') {
        openContactModal('email', channel);
      }
    }, 1200);
    return;
  }

  if (fmt === 'text') {
    if (channel === 'whatsapp') openContactModal('phone', 'whatsapp');
    else if (channel === 'telegram') openContactModal('telegram', 'telegram');
    else if (channel === 'email') openContactModal('email', 'email');
  }
}

// ===================== CONTACT MODAL =====================
// (savedEmails declared in part3_data.html)

function openContactModal(mode, channel) {
  contactState = { mode, channel, scope: shareState.scope, format: shareState.format };
  closeShareModal();

  const modal = document.getElementById('contactModal');
  if (!modal) return;

  const titleMap = {
    'whatsapp': '📱 إرسال عبر واتساب',
    'telegram': '✈️ إرسال عبر تليجرام',
    'email': '📧 إرسال عبر الإيميل'
  };
  const titleEl = document.getElementById('contactModalTitle');
  if (titleEl) titleEl.textContent = titleMap[channel] || 'إرسال';

  const phoneGroup = document.getElementById('phoneInputGroup');
  const emailGroup = document.getElementById('emailInputGroup');
  const phoneLabel = document.getElementById('phoneInputLabel');
  const footerNote = document.getElementById('contactFooterNote');

  if (mode === 'phone') {
    if (phoneGroup) phoneGroup.classList.remove('hidden');
    if (emailGroup) emailGroup.classList.add('hidden');
    if (phoneLabel) phoneLabel.textContent = 'رقم الواتساب (مع رمز الدولة)';
    if (footerNote) footerNote.textContent = 'سيفتح واتساب مع الرسالة جاهزة للإرسال';
    setTimeout(() => document.getElementById('contactPhoneInput')?.focus(), 100);
    renderQuickContactPhones();
  } else if (mode === 'telegram') {
    if (phoneGroup) phoneGroup.classList.add('hidden');
    if (emailGroup) emailGroup.classList.add('hidden');
    if (footerNote) footerNote.innerHTML = '⚡ سيفتح تليجرام مع الرسالة، اختر المستقبل من داخل التطبيق.';
  } else if (mode === 'email') {
    if (phoneGroup) phoneGroup.classList.add('hidden');
    if (emailGroup) emailGroup.classList.remove('hidden');
    if (footerNote) footerNote.textContent = 'سيفتح برنامج الإيميل الافتراضي مع الرسالة جاهزة';
    setTimeout(() => document.getElementById('contactEmailInput')?.focus(), 100);
    renderQuickContactEmails();
  }

  // Update preview
  const msg = buildShareMessage(contactState.scope);
  const previewEl = document.getElementById('contactPreview');
  if (previewEl) previewEl.textContent = msg || 'لا توجد بيانات كافية';

  // File attach note
  const fileNote = document.getElementById('fileAttachNote');
  if (fileNote) {
    if (contactState.format === 'excel' || contactState.format === 'sheets') {
      fileNote.classList.remove('hidden');
      const channelName = channel === 'whatsapp' ? 'واتساب' : channel === 'telegram' ? 'تليجرام' : 'الإيميل';
      const fmtName = contactState.format === 'sheets' ? 'Google Sheets' : 'Excel';
      fileNote.innerHTML = `📎 <strong>تم تحضير ${fmtName}.</strong> ${contactState.format === 'sheets' ? 'الرابط جاهز للنسخ.' : 'أرفق الملف يدوياً بعد فتح ' + channelName + '.'}`;
    } else {
      fileNote.classList.add('hidden');
    }
  }

  // Hide errors
  const pe = document.getElementById('contactPhoneError');
  if (pe) pe.classList.remove('show');
  const ee = document.getElementById('contactEmailError');
  if (ee) ee.classList.remove('show');

  modal.classList.remove('hidden');
}

function closeContactModal() {
  const m = document.getElementById('contactModal');
  if (m) m.classList.add('hidden');
  contactState = {};
}

function onContactPhoneInput(input) {
  input.value = input.value.replace(/\D/g, '');
  const err = document.getElementById('contactPhoneError');
  if (err) err.classList.remove('show');
}

function renderQuickContactPhones() {
  const container = document.getElementById('contactQuickPhones');
  if (!container) return;
  const existing = container.querySelector('.quick-btns-wrap');
  if (existing) existing.remove();
  if (savedPhones.length === 0) return;
  const wrap = document.createElement('div');
  wrap.className = 'quick-btns-wrap';
  wrap.style.cssText = 'display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;';
  savedPhones.slice(0, 6).forEach(phone => {
    const btn = document.createElement('button');
    btn.className = 'phone-quick-btn';
    btn.type = 'button';
    btn.textContent = '+' + phone;
    btn.onclick = () => {
      const inp = document.getElementById('contactPhoneInput');
      if (inp) inp.value = phone;
      const err = document.getElementById('contactPhoneError');
      if (err) err.classList.remove('show');
    };
    wrap.appendChild(btn);
  });
  container.appendChild(wrap);
}

function renderQuickContactEmails() {
  const container = document.getElementById('contactQuickEmails');
  if (!container) return;
  const existing = container.querySelector('.quick-btns-wrap');
  if (existing) existing.remove();
  if (savedEmails.length === 0) return;
  const wrap = document.createElement('div');
  wrap.className = 'quick-btns-wrap';
  wrap.style.cssText = 'display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;';
  savedEmails.slice(0, 6).forEach(email => {
    const btn = document.createElement('button');
    btn.className = 'phone-quick-btn';
    btn.type = 'button';
    btn.textContent = email;
    btn.onclick = () => {
      const inp = document.getElementById('contactEmailInput');
      if (inp) inp.value = email;
      const err = document.getElementById('contactEmailError');
      if (err) err.classList.remove('show');
    };
    wrap.appendChild(btn);
  });
  container.appendChild(wrap);
}

function executeContactSend() {
  const channel = contactState.channel;
  const scope = contactState.scope;
  const fmt = contactState.format;

  const msg = buildShareMessage(scope) || `تقرير ب لبن قطر - ${new Date().toLocaleDateString('ar-QA')}`;

  if (channel === 'whatsapp') {
    const phoneInput = document.getElementById('contactPhoneInput');
    const phone = phoneInput.value.replace(/\D/g,'').trim();
    if (!phone || phone.length < 10 || phone.length > 15) {
      document.getElementById('contactPhoneError').classList.add('show');
      phoneInput.focus();
      return;
    }
    if (!savedPhones.includes(phone)) {
      savedPhones.unshift(phone);
      if (savedPhones.length > 8) savedPhones.pop();
      localStorage.setItem('blaban_phones', JSON.stringify(savedPhones));
    }
    const fullMsg = msg + (fmt!=='text' ? '\n\n📎 الملف المرفق تم تحميله على جهازك. أرفقه يدوياً بعد فتح المحادثة.' : '');
    const url = `https://wa.me/${phone}?text=${encodeURIComponent(fullMsg)}`;
    window.open(url, '_blank');
    closeContactModal();
    showNotif(fmt==='text'?'✅ تم فتح واتساب!':'✅ افتح المحادثة وأرفق الملف يدوياً','success');
    return;
  }

  if (channel === 'telegram') {
    const fullMsg = msg + (fmt!=='text' ? '\n\n📎 الملف المرفق تم تحميله على جهازك.' : '');
    const url = `https://t.me/share/url?url=${encodeURIComponent(' ')}&text=${encodeURIComponent(fullMsg)}`;
    window.open(url, '_blank');
    closeContactModal();
    showNotif(fmt==='text'?'✅ تم فتح تليجرام!':'✅ اختر المستقبل وأرفق الملف','success');
    return;
  }

  if (channel === 'email') {
    const emailInput = document.getElementById('contactEmailInput');
    const email = emailInput.value.trim();
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!email || !emailRegex.test(email)) {
      document.getElementById('contactEmailError').classList.add('show');
      emailInput.focus();
      return;
    }
    if (!savedEmails.includes(email)) {
      savedEmails.unshift(email);
      if (savedEmails.length > 8) savedEmails.pop();
      localStorage.setItem('blaban_emails', JSON.stringify(savedEmails));
    }
    const scopeSubjects = {
      'branch': `تقرير فرع ${shareState.branchName||''} - ${currentDay} ${MONTHS[currentMonth]}`,
      'weekly': `تحليل أداء الأسبوع - ب لبن قطر`,
      'all': `تقرير الفروع الشامل - ${currentDay} ${MONTHS[currentMonth]}`,
      'managers': `تقييم المديرين - ب لبن قطر`,
      'analytics': `تحليلات الأداء - ب لبن قطر`,
      'action-plan': `خطة العمل - ${currentDay} ${MONTHS[currentMonth]}`
    };
    const subject = scopeSubjects[scope] || 'تقرير ب لبن قطر';
    const body = msg + (fmt!=='text' ? '\n\n📎 الملف المرفق تم تحميله على جهازك. أرفقه يدوياً قبل الإرسال.' : '');
    const truncatedBody = body.length > 1800 ? body.substring(0, 1800) + '\n...\n[التقرير الكامل في الملف المرفق]' : body;
    const url = `mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(truncatedBody)}`;
    window.location.href = url;
    setTimeout(() => closeContactModal(), 300);
    showNotif(fmt==='text'?'✅ تم فتح الإيميل!':'✅ افتح الإيميل وأرفق الملف يدوياً','success');
    return;
  }
}
</script>
