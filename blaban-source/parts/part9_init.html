// ============ PWA Install Banner Logic ============
function dismissInstallBanner() {
  const banner = document.getElementById('pwaInstallBanner');
  if (banner) banner.style.display = 'none';
  localStorage.setItem('blaban_install_dismissed', String(Date.now()));
}

function showInstallBannerIfEligible() {
  // Already installed?
  if (isPWAInstalled()) return;
  // Recently dismissed (within 3 days)?
  const dismissed = parseInt(localStorage.getItem('blaban_install_dismissed') || '0');
  if (dismissed && (Date.now() - dismissed) < 3 * 24 * 60 * 60 * 1000) return;
  
  const banner = document.getElementById('pwaInstallBanner');
  if (!banner) return;
  
  // Show banner if installable (deferredInstallPrompt available) or on iOS Safari
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
  
  if (deferredInstallPrompt) {
    banner.style.display = 'block';
  } else if (isIOS && isSafari) {
    // iOS Safari can install via "Add to Home Screen" but doesn't fire beforeinstallprompt
    setTimeout(() => { banner.style.display = 'block'; }, 3000);
  }
}

// Check eligibility after a short delay (to give beforeinstallprompt time to fire)
setTimeout(showInstallBannerIfEligible, 4000);

// Also re-check when beforeinstallprompt fires
window.addEventListener('beforeinstallprompt', () => {
  setTimeout(showInstallBannerIfEligible, 500);
});

// Adjust UI when running as installed PWA
if (isPWAInstalled()) {
  document.body.classList.add('pwa-mode');
  // Hide install button if already installed
  const btn = document.getElementById('pwaInstallBtn');
  if (btn) btn.style.display = 'none';
}

// ============ BUBBLE MENU ============
function positionBubbleMenu() {
  const menu = document.getElementById('bubbleMenu');
  const trigger = document.getElementById('bubbleMenuBtn');
  if (!menu || !trigger) return;
  const rect = trigger.getBoundingClientRect();
  // Position menu directly below the trigger button (same horizontal position)
  const top = rect.bottom + 12;
  // Use direct left/right pixel coordinates (avoids RTL inset-inline confusion)
  // Align RIGHT EDGE of menu with RIGHT EDGE of trigger
  const bubbleSize = window.innerWidth <= 768 ? 46 : 52;
  // The menu is a column of bubbles centered. To align right edges:
  // Right edge of menu = right edge of trigger
  // So: left of menu = rect.right - bubbleSize
  const menuLeft = rect.right - bubbleSize;
  menu.style.top = top + 'px';
  menu.style.left = menuLeft + 'px';
  menu.style.right = 'auto';
  menu.style.insetInlineEnd = 'auto';
  menu.style.insetInlineStart = 'auto';
  
  // Position device submenu BELOW the device bubble (same column as main menu)
  const sub = document.getElementById('deviceSubMenu');
  const deviceBubble = document.querySelector('.bubble-device');
  if (sub && deviceBubble) {
    if (menu.classList.contains('is-open')) {
      const dbRect = deviceBubble.getBoundingClientRect();
      sub.style.top = (dbRect.bottom + 10) + 'px';
      sub.style.left = (dbRect.right - bubbleSize) + 'px';
      sub.style.right = 'auto';
      sub.style.insetInlineEnd = 'auto';
      sub.style.insetInlineStart = 'auto';
    }
  }
}

function toggleBubbleMenu(e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  const menu = document.getElementById('bubbleMenu');
  const trigger = document.getElementById('bubbleMenuBtn');
  if (!menu || !trigger) return;
  const willOpen = !menu.classList.contains('is-open');
  if (willOpen) {
    positionBubbleMenu(); // Position before showing
    menu.classList.add('is-open');
    menu.setAttribute('aria-hidden', 'false');
    trigger.classList.add('is-open');
  } else {
    menu.classList.remove('is-open');
    menu.setAttribute('aria-hidden', 'true');
    trigger.classList.remove('is-open');
    // Also close device submenu if open
    const sub = document.getElementById('deviceSubMenu');
    if (sub) {
      sub.classList.remove('is-open');
      sub.setAttribute('aria-hidden', 'true');
    }
  }
}
function closeBubbleMenu() {
  const menu = document.getElementById('bubbleMenu');
  const trigger = document.getElementById('bubbleMenuBtn');
  const sub = document.getElementById('deviceSubMenu');
  if (menu) { menu.classList.remove('is-open'); menu.setAttribute('aria-hidden','true'); }
  if (trigger) trigger.classList.remove('is-open');
  if (sub) { sub.classList.remove('is-open'); sub.setAttribute('aria-hidden','true'); }
}
window.toggleBubbleMenu = toggleBubbleMenu;
window.closeBubbleMenu = closeBubbleMenu;
window.positionBubbleMenu = positionBubbleMenu;

// Reposition menu on scroll / resize when open (so it stays visible)
window.addEventListener('scroll', () => {
  const menu = document.getElementById('bubbleMenu');
  if (menu && menu.classList.contains('is-open')) positionBubbleMenu();
}, { passive: true });
window.addEventListener('resize', () => {
  const menu = document.getElementById('bubbleMenu');
  if (menu && menu.classList.contains('is-open')) positionBubbleMenu();
});

// Click outside / Escape to close bubble menu
document.addEventListener('click', (e) => {
  const menu = document.getElementById('bubbleMenu');
  const trigger = document.getElementById('bubbleMenuBtn');
  if (!menu || !trigger) return;
  if (!menu.classList.contains('is-open')) return;
  if (!trigger.contains(e.target) && !menu.contains(e.target)) closeBubbleMenu();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeBubbleMenu();
});

// ============ ORIENTATION LOCK (prevents screen rotation/flip entirely) ============
function toggleRotationLock() {
  const isLocked = localStorage.getItem('blaban_rotation_lock') === '1';
  const newState = !isLocked;
  localStorage.setItem('blaban_rotation_lock', newState ? '1' : '0');
  applyRotationLock(newState);
  if (typeof showNotif === 'function') {
    showNotif(newState ? '🔒 تم تثبيت الشاشة (لن تدور أو تنقلب)' : '🔓 تم تحرير الشاشة', 'success');
  }
}
async function applyRotationLock(locked) {
  const btn = document.getElementById('rotationLockBtn');
  if (btn) {
    const icon = btn.querySelector('.bubble-icon');
    const label = btn.querySelector('.bubble-label');
    if (locked) {
      btn.classList.add('is-locked');
      if (icon) icon.textContent = '🔒';
      if (label) label.textContent = 'مقفل';
    } else {
      btn.classList.remove('is-locked');
      if (icon) icon.textContent = '🔓';
      if (label) label.textContent = 'تثبيت';
    }
  }
  
  if (locked) {
    document.body.classList.add('rotation-locked');
    // Try Screen Orientation API to lock to current orientation
    try {
      if (screen.orientation && screen.orientation.lock) {
        // Lock to current orientation (whichever it is)
        const current = screen.orientation.type || 'portrait-primary';
        // Try multiple lock variants for best compatibility
        const tries = [current, 'natural', 'portrait', 'landscape'];
        for (const t of tries) {
          try {
            await screen.orientation.lock(t);
            console.log('[Lock] Orientation locked to:', t);
            break;
          } catch(e) { /* try next */ }
        }
      }
    } catch(e) {
      console.warn('[Lock] Native lock failed (need fullscreen/PWA mode):', e);
    }
    // Prevent any visual flip via CSS (extra safety)
    // The CSS class .rotation-locked applies will-change and prevents transform animations
  } else {
    document.body.classList.remove('rotation-locked');
    try {
      if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    } catch(e) {}
  }
}
window.toggleRotationLock = toggleRotationLock;
window.applyRotationLock = applyRotationLock;

// ============ SCREEN ORIENTATION LOCK (Samsung-style) ============
// Behavior: When ON, the app content stays in its current orientation
// even if you physically rotate the device — no rotation, no flip, no freeze.
// Uses CSS transform with no animation, very lightweight.
let _screenLockState = {
  enabled: false,
  lockedOrientation: 'portrait' // 'portrait' or 'landscape'
};

function toggleScreenLock() {
  _screenLockState.enabled = !_screenLockState.enabled;
  if (_screenLockState.enabled) {
    // Capture the CURRENT orientation as the locked one
    _screenLockState.lockedOrientation = (window.innerWidth > window.innerHeight) ? 'landscape' : 'portrait';
  }
  localStorage.setItem('blaban_screen_lock', _screenLockState.enabled ? '1' : '0');
  localStorage.setItem('blaban_screen_lock_orient', _screenLockState.lockedOrientation);
  applyScreenLock();
  
  if (typeof showNotif === 'function') {
    showNotif(_screenLockState.enabled 
      ? '🔒 تم تثبيت الشاشة على وضعها — لن تدور مع الجهاز' 
      : '🔓 تم تحرير الشاشة — تدور بشكل طبيعي', 'success');
  }
}
window.toggleScreenLock = toggleScreenLock;

function applyScreenLock() {
  const btn = document.getElementById('screenLockBtn');
  
  if (!_screenLockState.enabled) {
    // Unlock — remove all overrides
    document.body.classList.remove('screen-locked-portrait', 'screen-locked-landscape');
    document.documentElement.style.removeProperty('--lock-rotation');
    // Try to unlock native API
    try {
      if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    } catch(e) {}
    if (btn) {
      btn.textContent = '🔓';
      btn.title = 'منع تدوير الشاشة';
      btn.style.background = '';
      btn.style.color = '';
    }
    return;
  }
  
  // Locked — apply
  const lockOrient = _screenLockState.lockedOrientation;
  const currentIsLandscape = window.innerWidth > window.innerHeight;
  const targetIsLandscape = lockOrient === 'landscape';
  
  // Remove old classes
  document.body.classList.remove('screen-locked-portrait', 'screen-locked-landscape');
  
  if (currentIsLandscape === targetIsLandscape) {
    // Already in the right orientation — just add a "locked" class for visual feedback
    document.body.classList.add(targetIsLandscape ? 'screen-locked-landscape' : 'screen-locked-portrait');
  } else {
    // Physical rotation happened — flip the UI back by rotating 90deg
    document.body.classList.add(targetIsLandscape ? 'screen-locked-landscape' : 'screen-locked-portrait');
  }
  
  // Try native lock too (works in PWA/fullscreen on Android)
  try {
    if (screen.orientation && screen.orientation.lock) {
      const orientName = targetIsLandscape ? 'landscape-primary' : 'portrait-primary';
      screen.orientation.lock(orientName).catch(()=>{}); // silent fail (needs fullscreen on some)
    }
  } catch(e) {}
  
  if (btn) {
    btn.textContent = '🔒';
    btn.title = 'الشاشة مقفولة على ' + (targetIsLandscape ? 'العرضي' : 'العمودي') + ' — اضغط للتحرير';
    btn.style.background = 'linear-gradient(135deg, #27AE60, #2ECC71)';
    btn.style.color = '#fff';
  }
}
window.applyScreenLock = applyScreenLock;

// Listen for resize/orientation change to re-apply lock if needed
window.addEventListener('resize', () => {
  if (_screenLockState.enabled) {
    requestAnimationFrame(applyScreenLock);
  }
});
window.addEventListener('orientationchange', () => {
  if (_screenLockState.enabled) {
    setTimeout(applyScreenLock, 200);
  }
});

// Restore on load
(function restoreScreenLock() {
  try {
    if (localStorage.getItem('blaban_screen_lock') === '1') {
      _screenLockState.enabled = true;
      _screenLockState.lockedOrientation = localStorage.getItem('blaban_screen_lock_orient') || 'portrait';
      setTimeout(applyScreenLock, 300);
    }
  } catch(e) {}
})();

// ============ DEVICE SUB-MENU ============
function toggleDeviceSubMenu(e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  const sub = document.getElementById('deviceSubMenu');
  if (!sub) return;
  const willOpen = !sub.classList.contains('is-open');
  if (willOpen) {
    // Reposition to be beside the device bubble
    if (typeof positionBubbleMenu === 'function') positionBubbleMenu();
    sub.classList.add('is-open');
    sub.setAttribute('aria-hidden', 'false');
    // Highlight currently active device
    const current = localStorage.getItem('blaban_device') || 'desktop';
    ['Desktop','Tablet','Mobile'].forEach(d => {
      const el = document.getElementById('subDev' + d);
      if (el) el.classList.toggle('active', current === d.toLowerCase());
    });
  } else {
    sub.classList.remove('is-open');
    sub.setAttribute('aria-hidden', 'true');
  }
}
window.toggleDeviceSubMenu = toggleDeviceSubMenu;

// Close device submenu on outside click
document.addEventListener('click', (e) => {
  const sub = document.getElementById('deviceSubMenu');
  const deviceBubble = document.querySelector('.bubble-device');
  if (!sub || !sub.classList.contains('is-open')) return;
  if (deviceBubble && deviceBubble.contains(e.target)) return;
  if (sub.contains(e.target)) return;
  sub.classList.remove('is-open');
  sub.setAttribute('aria-hidden', 'true');
});

let remembranceTimer = null;
let remembranceCloseTimer = null;
let remembranceCountdown = null;

function showRemembranceBubble() {
  if (localStorage.getItem('blaban_remembrance_off') === '1') return;
  // Don't show if a prayer bubble is currently active
  const prayer = document.getElementById('prayerBubble');
  if (prayer && prayer.style.display !== 'none') return;
  
  const bubble = document.getElementById('remembranceBubble');
  const textEl = document.getElementById('remembranceText');
  const counterEl = document.getElementById('remembranceCounter');
  if (!bubble || !textEl) return;
  
  // Pick a random remembrance (different from last one)
  const lastIdx = parseInt(localStorage.getItem('blaban_last_remembrance') || '-1');
  let idx;
  do {
    idx = Math.floor(Math.random() * ISLAMIC_REMEMBRANCES.length);
  } while (idx === lastIdx && ISLAMIC_REMEMBRANCES.length > 1);
  localStorage.setItem('blaban_last_remembrance', String(idx));
  
  textEl.textContent = ISLAMIC_REMEMBRANCES[idx];
  bubble.classList.remove('closing');
  bubble.style.display = 'block';
  
  // 5 second countdown
  let secondsLeft = 5;
  if (counterEl) counterEl.textContent = secondsLeft;
  if (remembranceCountdown) clearInterval(remembranceCountdown);
  remembranceCountdown = setInterval(() => {
    secondsLeft--;
    if (counterEl) counterEl.textContent = Math.max(0, secondsLeft);
    if (secondsLeft <= 0) {
      clearInterval(remembranceCountdown);
      closeRemembranceBubble();
    }
  }, 1000);
  
  if (remembranceCloseTimer) clearTimeout(remembranceCloseTimer);
  remembranceCloseTimer = setTimeout(closeRemembranceBubble, 5000);
}

function closeRemembranceBubble() {
  const bubble = document.getElementById('remembranceBubble');
  if (!bubble) return;
  bubble.classList.add('closing');
  setTimeout(() => { bubble.style.display = 'none'; bubble.classList.remove('closing'); }, 400);
  if (remembranceCountdown) clearInterval(remembranceCountdown);
  if (remembranceCloseTimer) clearTimeout(remembranceCloseTimer);
}
window.closeRemembranceBubble = closeRemembranceBubble;

function startRemembranceCycle() {
  if (remembranceTimer) clearInterval(remembranceTimer);
  // First one after 30s, then every 3 minutes (180000ms)
  setTimeout(showRemembranceBubble, 30000);
  remembranceTimer = setInterval(showRemembranceBubble, 180000);
}

}

function showPrayerBubble(prayer, type) {
  if (localStorage.getItem('blaban_prayer_off') === '1') return;
  closeRemembranceBubble();
  
  const bubble = document.getElementById('prayerBubble');
  const iconEl = document.getElementById('prayerIcon');
  const nameEl = document.getElementById('prayerName');
  const msgEl = document.getElementById('prayerMessage');
  const timeEl = document.getElementById('prayerTime');
  if (!bubble) return;
  
  if (iconEl) iconEl.textContent = prayer.icon;
  if (nameEl) nameEl.textContent = 'صلاة ' + prayer.name;
  
  if (type === 'before') {
    if (msgEl) msgEl.textContent = 'باقي ربع ساعة على الأذان — استعد للصلاة 🤲';
    if (timeEl) timeEl.textContent = '⏰ الأذان الساعة ' + prayer.time;
  } else {
    if (msgEl) msgEl.textContent = 'حان الآن وقت صلاة ' + prayer.name + ' — حيّ على الصلاة';
    if (timeEl) timeEl.textContent = '🕌 ' + prayer.time;
  }
  
  bubble.classList.remove('closing');
  bubble.style.display = 'block';
  
  playPrayerChime(type);
  
  const duration = type === 'before' ? 30000 : 60000;
  setTimeout(() => closePrayerBubble(), duration);
}

function closePrayerBubble() {
  const bubble = document.getElementById('prayerBubble');
  if (!bubble) return;
  bubble.classList.add('closing');
  setTimeout(() => { bubble.style.display = 'none'; bubble.classList.remove('closing'); }, 400);
}
window.closePrayerBubble = closePrayerBubble;

function playPrayerChime(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const freqs = type === 'now' ? [523, 659, 784, 1047] : [523, 659];
    freqs.forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = f;
      osc.connect(gain);
      gain.connect(ctx.destination);
      const start = ctx.currentTime + (i * 0.25);
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.25, start + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.4);
      osc.start(start);
      osc.stop(start + 0.4);
    });
  } catch(e) {}
}

function checkPrayerTimes() {
  const prayers = getQatarPrayerTimes();
  const now = new Date();
  const ch = now.getHours();
  const cm = now.getMinutes();
  const currentMins = ch * 60 + cm;
  const todayKey = now.toISOString().split('T')[0];
  
  prayers.forEach(p => {
    const [ph, pm] = p.time.split(':').map(Number);
    const prayerMins = ph * 60 + pm;
    const diff = prayerMins - currentMins;
    
    if (diff === 15) {
      const key = 'prayer_before_' + todayKey + '_' + p.key;
      if (!localStorage.getItem(key)) {
        localStorage.setItem(key, '1');
        showPrayerBubble(p, 'before');
      }
    }
    if (diff === 0) {
      const key = 'prayer_now_' + todayKey + '_' + p.key;
      if (!localStorage.getItem(key)) {
        localStorage.setItem(key, '1');
        showPrayerBubble(p, 'now');
      }
    }
  });
  
  // Cleanup old prayer flags (older than 2 days)
  try {
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (k && (k.startsWith('prayer_before_') || k.startsWith('prayer_now_'))) {
        const parts = k.split('_');
        // parts: ['prayer','before','YYYY-MM-DD','prayerkey']
        if (parts.length >= 4) {
          const dateStr = parts[2];
          if (dateStr !== todayKey) {
            const flagDate = new Date(dateStr);
            const ageDays = (Date.now() - flagDate.getTime()) / 86400000;
            if (ageDays > 1) localStorage.removeItem(k);
          }
        }
      }
    }
  } catch(e) {}
}

function startPrayerCycle() {
  checkPrayerTimes();
  setInterval(checkPrayerTimes, 60000);
}

// Start cycles after page load
window.addEventListener('load', () => {
  setTimeout(() => {
    startRemembranceCycle();
    startPrayerCycle();
  }, 5000);
});

window.showRemembranceBubble = showRemembranceBubble;
window.showPrayerBubble = showPrayerBubble;

// ============ FORCE UPDATE — Clear all caches and reload ============
async function forceUpdateApp() {
  const ok = confirm('سيتم مسح الـ cache وإعادة تحميل التطبيق بآخر إصدار. متابعة؟');
  if (!ok) return;
  
  try {
    if (typeof showNotif === 'function') showNotif('⏳ جاري التحديث...', 'info');
    
    // 1. Unregister all service workers
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const reg of regs) {
        await reg.unregister();
        console.log('[Update] Unregistered SW:', reg.scope);
      }
    }
    
    // 2. Clear all caches
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => {
        console.log('[Update] Clearing cache:', k);
        return caches.delete(k);
      }));
    }
    
    // 3. Hard reload with cache bypass
    setTimeout(() => {
      window.location.href = window.location.pathname + '?v=' + Date.now();
    }, 500);
  } catch(err) {
    console.error('[Update] Failed:', err);
    alert('فشل التحديث: ' + err.message + '\n\nجرب يدوياً: Ctrl+Shift+R');
  }
}
window.forceUpdateApp = forceUpdateApp;

// ============ AUTO-DETECT NEW VERSION (when SW updates) ============
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  // Listen for messages from SW (when new version activates)
  navigator.serviceWorker.addEventListener('message', (event) => {
    if (event.data?.type === 'SW_UPDATED') {
      console.log('[SW] New version active:', event.data.version);
      if (typeof showUpdateBanner === 'function') showUpdateBanner();
      if (typeof showNotif === 'function') {
        showNotif('🆕 إصدار جديد متاح — اضغط "تحديث الآن"', 'info', 10000);
      }
    }
  });
  
  // Controller change = new SW took over
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    console.log('[SW] Controller changed — new version active');
    if (typeof showUpdateBanner === 'function') showUpdateBanner();
    if (typeof showNotif === 'function') {
      showNotif('🆕 إصدار جديد متاح — اضغط على بانر "تحديث الآن"', 'info', 8000);
    }
  });
  
  // Listen for waiting SW (update found but not yet activated)
  navigator.serviceWorker.ready.then(reg => {
    reg.addEventListener('updatefound', () => {
      console.log('[SW] Update found, installing new version...');
      const newWorker = reg.installing;
      if (newWorker) {
        newWorker.addEventListener('statechange', () => {
          console.log('[SW] New worker state:', newWorker.state);
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            // New version available — prompt user
            if (typeof showUpdateBanner === 'function') showUpdateBanner();
            if (typeof showNotif === 'function') {
              showNotif('🆕 تحديث جديد جاهز — اضغط زر التحديث', 'info', 10000);
            }
          }
        });
      }
    });
  });
  
  // Check for updates every 60 seconds
  setInterval(async () => {
    try {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg) {
        await reg.update();
        if (reg.waiting && typeof showUpdateBanner === 'function') {
          showUpdateBanner();
        }
      }
    } catch(e) {}
  }, 60000);
  
  // Check once on load
  setTimeout(async () => {
    try {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg && reg.waiting && typeof showUpdateBanner === 'function') {
        showUpdateBanner();
      }
    } catch(e) {}
  }, 3000);
}

// Update app badge on tasks change
window.addEventListener('load', () => {
  if (typeof updateAppBadge === 'function') {
    setTimeout(updateAppBadge, 2000);
  }
});
</script>
