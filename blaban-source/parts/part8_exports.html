async function pdfExportRecommendations(branch) {
  _showPdfLoading('جاري إنشاء PDF التوصيات...');
  _updatePdfProgress(10, 'تحليل البيانات...');
  
  try {
    const pdf = _newPdf();
    _drawCover(pdf, '💡 التوصيات', branch ? 'فرع ' + (BRANCH_NAMES[branch] || branch) : 'كل الفروع');
    
    pdf.addPage();
    let y = 15;
    
    _updatePdfProgress(30, 'إعداد التوصيات...');
    
    // Compute fail counts
    const failCounts = {};
    BRANCHES.forEach(b => {
      for (let m = 0; m < 12; m++) {
        for (let d = 1; d <= MONTH_DAYS[m]; d++) {
          const key = getKey(b, m, d);
          if (!appData[key]) continue;
          Object.entries(appData[key].results || {}).forEach(([id, val]) => {
            if (val === 'fail') failCounts[id] = (failCounts[id] || 0) + 1;
          });
        }
      }
    });
    const allItemsLib = CHECKLIST.flatMap(s => s.items);
    const topFails = Object.entries(failCounts).sort((a,b)=>b[1]-a[1]);
    
    // SECTION 1: Critical recommendations
    y = _drawHeader(pdf, '🚨 توصيات عاجلة (أكثر البنود فشلاً)', y, '#E74C3C');
    y += 4;
    
    const criticalRecos = topFails.slice(0, 10);
    if (criticalRecos.length === 0) {
      y = _pdfText(pdf, '✅ لا توجد بنود فاشلة — أداء ممتاز!', 12, y,
        { fontSize: 14, color: '#27AE60', targetWidth: 186, align: 'center' });
    } else {
      criticalRecos.forEach(([id, cnt], idx) => {
        const item = allItemsLib.find(i => i.id === id);
        if (!item) return;
        const priority = cnt >= 5 ? '🔴 عالية جداً' : cnt >= 3 ? '🟡 متوسطة' : '🟢 منخفضة';
        const priorityColor = cnt >= 5 ? '#E74C3C' : cnt >= 3 ? '#F39C12' : '#27AE60';
        
        y = _ensureRoom(pdf, y, 28);
        
        // Box bg
        pdf.setFillColor('#FAF6E8');
        pdf.setDrawColor(priorityColor);
        pdf.setLineWidth(0.4);
        pdf.roundedRect(10, y, 190, 24, 2, 2, 'FD');
        
        // Priority badge
        pdf.setFillColor(priorityColor);
        pdf.roundedRect(12, y + 2, 28, 6, 1, 1, 'F');
        const prioImg = _arabicTextCanvas(priority, { fontSize: 8, color: '#fff', fontWeight: 800, width: 200, padding: 0, align: 'center' });
        pdf.addImage(prioImg.dataUrl, 'PNG', 12, y + 2.5, 28, 5);
        
        // Title
        const txt = (idx + 1) + '. ' + item.text + (item.critical ? ' [بند حرج]' : '');
        y = _pdfText(pdf, txt, 12, y + 9, { fontSize: 10, fontWeight: 800, color: '#000', targetWidth: 186, spacing: 1 });
        
        // Recommendation text
        const recoText = 'تكرر ' + cnt + ' مرة — يُوصى بإجراء مراجعة فورية وتدريب المديرين على هذا البند.';
        y = _pdfText(pdf, recoText, 12, y, { fontSize: 9, color: '#555', targetWidth: 186, spacing: 4 });
      });
    }
    
    // SECTION 2: General recommendations
    _updatePdfProgress(70, 'التوصيات العامة...');
    
    pdf.addPage();
    y = 15;
    y = _drawHeader(pdf, '📌 توصيات عامة لرفع كفاءة التشغيل', y, '#16A085');
    y += 4;
    
    const generalRecos = [
      { title: '📊 جدولة زيارات متوازنة', text: 'تأكد من توزيع زيارات التقييم على الشيفت الصباحي والمسائي بالتساوي للحصول على صورة شاملة.' },
      { title: '👥 اجتماع أسبوعي مع المديرين', text: 'عقد اجتماع كل بداية أسبوع لمراجعة نتائج الأسبوع الماضي والاتفاق على الأولويات.' },
      { title: '🏆 برنامج المكافآت', text: 'تفعيل نظام مكافآت للمديرين الذين يحققون نسبة ≥ 90% لمدة 3 أشهر متتالية.' },
      { title: '📚 تدريب البنود الحرجة', text: 'تخصيص جلسة تدريب شهرية للبنود الحرجة الأكثر فشلاً.' },
      { title: '🔄 مشاركة أفضل الممارسات', text: 'الفروع المتميزة تشارك تجاربها مع باقي الفروع في WhatsApp Group أو اجتماع شهري.' },
      { title: '🎯 أكشن بلان متابع', text: 'كل بند فاشل لازم يكون له action plan محدد بميعاد + مسؤول، ويتم متابعته أسبوعياً.' },
      { title: '📱 استخدام النظام الإلكتروني', text: 'تشجيع المديرين على التقييم الفوري في النظام بدلاً من التأجيل لنهاية اليوم.' },
      { title: '🚨 معالجة البنود الحرجة فوراً', text: 'أي بند حرج فاشل يجب معالجته في نفس اليوم وقبل إغلاق الفرع.' }
    ];
    
    generalRecos.forEach((r, i) => {
      y = _ensureRoom(pdf, y, 22);
      
      pdf.setFillColor('#E8F8F5');
      pdf.setDrawColor('#16A085');
      pdf.setLineWidth(0.3);
      pdf.roundedRect(10, y, 190, 18, 2, 2, 'FD');
      
      y = _pdfText(pdf, r.title, 12, y + 2, { fontSize: 11, fontWeight: 900, color: '#0E6B57', targetWidth: 186, spacing: 1 });
      y = _pdfText(pdf, r.text, 12, y, { fontSize: 9, color: '#333', targetWidth: 186, spacing: 3 });
    });
    
    // SECTION 3: Branch-specific recommendations
    _updatePdfProgress(90, 'توصيات لكل فرع...');
    
    pdf.addPage();
    y = 15;
    y = _drawHeader(pdf, '🏪 توصيات خاصة لكل فرع', y, '#9B59B6');
    y += 4;
    
    BRANCHES.forEach(b => {
      const scores = [];
      for (let m = 0; m < 12; m++) {
        for (let d = 1; d <= MONTH_DAYS[m]; d++) {
          const key = getKey(b, m, d);
          if (!appData[key]) continue;
          const v = appData[key];
          if (!v.results || Object.keys(v.results).length === 0) continue;
          try {
            const s = calcSmartScore(b, m, d);
            scores.push(s.percent || 0);
          } catch(e) {}
        }
      }
      const avg = scores.length > 0 ? Math.round(scores.reduce((a,c)=>a+c,0) / scores.length) : 0;
      
      let verdict, color;
      if (scores.length === 0) {
        verdict = '📝 لا توجد تقييمات — يُوصى ببدء التقييمات فوراً.';
        color = '#95A5A6';
      } else if (avg < 60) {
        verdict = '🔴 إنذار رسمي + خطة تصحيحية فورية + متابعة يومية.';
        color = '#E74C3C';
      } else if (avg < 80) {
        verdict = '🟡 متابعة مكثفة + برنامج تطوير أسبوعي + مكافأة مشروطة بالتحسن.';
        color = '#F39C12';
      } else {
        verdict = '🟢 أداء ممتاز — تقدير رسمي + ترشيح للمكافأة + ضمه لمشاركة الخبرات.';
        color = '#27AE60';
      }
      
      y = _ensureRoom(pdf, y, 28);
      
      pdf.setFillColor('#FAF5FF');
      pdf.setDrawColor(color);
      pdf.setLineWidth(0.4);
      pdf.roundedRect(10, y, 190, 24, 2, 2, 'FD');
      
      const branchTitle = '🏪 ' + (BRANCH_NAMES[b] || b) + (scores.length > 0 ? ' — متوسط: ' + avg + '%  |  ' + scores.length + ' زيارة' : '');
      y = _pdfText(pdf, branchTitle, 12, y + 2, { fontSize: 11, fontWeight: 900, color: '#6C3483', targetWidth: 186, spacing: 1 });
      y = _pdfText(pdf, verdict, 12, y, { fontSize: 10, color: '#000', targetWidth: 186, spacing: 4 });
    });
    
    pdf.save(`توصيات_ب_لبن_${new Date().toISOString().split('T')[0]}.pdf`);
    if (typeof showNotif === 'function') showNotif('✅ تم تنزيل التوصيات', 'success');
  } catch(err) {
    console.error('PDF Recommendations error:', err);
    if (typeof showNotif === 'function') showNotif('❌ ' + (err.message || err), 'error');
  } finally {
    _hidePdfLoading();
  }
}

// ============================================================
// SECTION: OVERVIEW PDF (Ops manager view)
// ============================================================
async function pdfExportOverview() {
  _showPdfLoading('جاري إنشاء PDF نظرة عامة...');
  _updatePdfProgress(10, 'تجميع البيانات...');
  
  try {
    const pdf = _newPdf();
    _drawCover(pdf, '🌐 النظرة العامة', 'تقرير شامل لكل الفروع');
    
    pdf.addPage();
    let y = 15;
    
    // SECTION 1: System statistics
    _updatePdfProgress(30, 'إحصائيات النظام...');
    y = _drawHeader(pdf, '📊 إحصائيات النظام', y, '#3498DB');
    y += 6;
    
    let totalVisits = 0, totalFails = 0, totalOk = 0;
    BRANCHES.forEach(b => {
      for (let m = 0; m < 12; m++) {
        for (let d = 1; d <= MONTH_DAYS[m]; d++) {
          const key = getKey(b, m, d);
          if (!appData[key]) continue;
          const v = appData[key];
          if (!v.results || Object.keys(v.results).length === 0) continue;
          totalVisits++;
          Object.entries(v.results).forEach(([id, val]) => {
            if (val === 'ok') totalOk++;
            else if (val === 'fail') totalFails++;
          });
        }
      }
    });
    const overallPct = (totalOk + totalFails) > 0 ? Math.round((totalOk / (totalOk + totalFails)) * 100) : 0;
    const tasks = (typeof tasksData !== 'undefined' && Array.isArray(tasksData)) ? tasksData : [];
    
    _drawStatBox(pdf, 'الفروع', String(BRANCHES.length), '#3498DB', 12, y, 60, 22);
    _drawStatBox(pdf, 'إجمالي الزيارات', String(totalVisits), '#9B59B6', 75, y, 60, 22);
    _drawStatBox(pdf, 'متوسط الأداء', overallPct + '%', overallPct >= 80 ? '#27AE60' : '#F39C12', 138, y, 60, 22);
    y += 28;
    _drawStatBox(pdf, 'إجمالي المهام', String(tasks.length), '#16A085', 12, y, 60, 22);
    _drawStatBox(pdf, 'المهام المنتهية', String(tasks.filter(t => t.status === 'completed' || t.done).length), '#27AE60', 75, y, 60, 22);
    _drawStatBox(pdf, 'المهام المعلقة', String(tasks.filter(t => !t.done && t.status !== 'completed').length), '#E74C3C', 138, y, 60, 22);
    y += 30;
    
    // SECTION 2: Per-branch quick view
    _updatePdfProgress(60, 'نظرة على الفروع...');
    
    y = _drawHeader(pdf, '🏪 لمحة عن كل فرع', y, '#16A085');
    y += 4;
    
    BRANCHES.forEach(b => {
      const scores = [];
      let lastEval = null;
      for (let m = 0; m < 12; m++) {
        for (let d = 1; d <= MONTH_DAYS[m]; d++) {
          const key = getKey(b, m, d);
          if (!appData[key]) continue;
          const v = appData[key];
          if (!v.results || Object.keys(v.results).length === 0) continue;
          try {
            const s = calcSmartScore(b, m, d);
            scores.push(s.percent || 0);
            lastEval = { m, d, score: s.percent, manager: v.manager || (v.managers||[])[0] || '-' };
          } catch(e) {}
        }
      }
      const avg = scores.length > 0 ? Math.round(scores.reduce((a,c)=>a+c,0) / scores.length) : 0;
      const branchTasks = tasks.filter(t => {
        const tBranches = (typeof getTaskBranches === 'function') ? getTaskBranches(t) : (t.branch ? [t.branch] : []);
        return tBranches.includes(b);
      });
      const pendingBT = branchTasks.filter(t => !t.done && t.status !== 'completed').length;
      
      const color = avg >= 80 ? '#27AE60' : avg >= 60 ? '#F39C12' : avg > 0 ? '#E74C3C' : '#95A5A6';
      
      y = _ensureRoom(pdf, y, 24);
      
      pdf.setFillColor('#F5F7FA');
      pdf.setDrawColor(color);
      pdf.setLineWidth(0.5);
      pdf.roundedRect(10, y, 190, 20, 2, 2, 'FD');
      
      // Branch name
      y = _pdfText(pdf, '🏪 ' + (BRANCH_NAMES[b] || b), 12, y + 1.5, 
        { fontSize: 12, fontWeight: 900, color: '#0E6B57', targetWidth: 186, spacing: 0.5 });
      
      // Stats row
      const stats = 'الزيارات: ' + scores.length + '  |  المتوسط: ' + (scores.length > 0 ? avg + '%' : 'لا توجد') 
                  + '  |  المهام المعلقة: ' + pendingBT 
                  + (lastEval ? '  |  آخر تقييم: ' + lastEval.score + '%' : '');
      y = _pdfText(pdf, stats, 12, y, { fontSize: 9, color: '#333', targetWidth: 186, spacing: 4 });
    });
    
    // SECTION 3: Recent activity (last 10 evaluations)
    _updatePdfProgress(85, 'النشاط الأخير...');
    
    pdf.addPage();
    y = 15;
    y = _drawHeader(pdf, '📅 آخر 15 تقييم', y, '#9B59B6');
    y += 4;
    
    const recentEvals = [];
    BRANCHES.forEach(b => {
      for (let m = 0; m < 12; m++) {
        for (let d = 1; d <= MONTH_DAYS[m]; d++) {
          const key = getKey(b, m, d);
          if (!appData[key]) continue;
          const v = appData[key];
          if (!v.results || Object.keys(v.results).length === 0) continue;
          try {
            const s = calcSmartScore(b, m, d);
            recentEvals.push({
              branch: b, m, d, manager: v.manager || (v.managers||[])[0] || '-', 
              shift: v.shift || '-', score: s.percent || 0,
              sortKey: m * 31 + d
            });
          } catch(e) {}
        }
      }
    });
    recentEvals.sort((a,b) => b.sortKey - a.sortKey);
    
    const MONTHS_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    
    recentEvals.slice(0, 15).forEach(e => {
      const color = e.score >= 80 ? '#27AE60' : e.score >= 60 ? '#F39C12' : '#E74C3C';
      y = _ensureRoom(pdf, y, 14);
      
      pdf.setFillColor('#FAFAFA');
      pdf.setDrawColor(color);
      pdf.setLineWidth(0.3);
      pdf.roundedRect(10, y, 190, 11, 1.5, 1.5, 'FD');
      
      // Score badge on right
      pdf.setFillColor(color);
      pdf.roundedRect(180, y + 1, 18, 9, 1, 1, 'F');
      const scoreImg = _arabicTextCanvas(e.score + '%', { fontSize: 11, color: '#fff', fontWeight: 900, width: 200, padding: 0, align: 'center' });
      pdf.addImage(scoreImg.dataUrl, 'PNG', 180, y + 2.5, 18, 6);
      
      // Info
      const info = '🏪 ' + (BRANCH_NAMES[e.branch] || e.branch) + ' • 📅 ' + e.d + ' ' + MONTHS_AR[e.m] + ' • 👤 ' + e.manager + ' (' + e.shift + ')';
      y = _pdfText(pdf, info, 12, y + 1.5, { fontSize: 9, color: '#333', targetWidth: 165, spacing: 3 });
    });
    
    pdf.save(`نظرة_عامة_ب_لبن_${new Date().toISOString().split('T')[0]}.pdf`);
    if (typeof showNotif === 'function') showNotif('✅ تم تنزيل النظرة العامة', 'success');
  } catch(err) {
    console.error('PDF Overview error:', err);
    if (typeof showNotif === 'function') showNotif('❌ ' + (err.message || err), 'error');
  } finally {
    _hidePdfLoading();
  }
}

// ============================================================
// SECTION: MANAGERS PDF (full performance report)
// ============================================================
async function pdfExportManagers() {
  _showPdfLoading('جاري إنشاء PDF المديرين...');
  _updatePdfProgress(10, 'تجميع بيانات المديرين...');
  
  try {
    const pdf = _newPdf();
    _drawCover(pdf, '👔 تقييم أداء المديرين', 'تراكمي وتحليلي');
    
    const managerStats = (typeof buildManagerStats === 'function') ? buildManagerStats() : {};
    const allItemsLib = CHECKLIST.flatMap(s => s.items);
    
    if (Object.keys(managerStats).length === 0) {
      pdf.addPage();
      _pdfText(pdf, '⚠️ لا توجد بيانات مديرين بعد. يجب إدخال أسماء المديرين في صفحات الفروع أولاً.',
        12, 30, { fontSize: 14, color: '#888', targetWidth: 186, align: 'center' });
      pdf.save(`مديرون_ب_لبن_${new Date().toISOString().split('T')[0]}.pdf`);
      if (typeof showNotif === 'function') showNotif('⚠️ لا توجد بيانات', 'error');
      _hidePdfLoading();
      return;
    }
    
    const sorted = Object.entries(managerStats).sort((a,b) => {
      const avgA = a[1].visits.reduce((s,v)=>s+v.pct,0)/a[1].visits.length;
      const avgB = b[1].visits.reduce((s,v)=>s+v.pct,0)/b[1].visits.length;
      return avgB - avgA;
    });
    
    _updatePdfProgress(30, 'بناء جدول المقارنة...');
    
    pdf.addPage();
    let y = 15;
    
    // SECTION 1: Comparison bar chart
    y = _drawHeader(pdf, '📊 مقارنة متوسط الأداء', y, '#3498DB');
    y += 4;
    
    const compareData = sorted.map(([name, stats]) => {
      const avg = Math.round(stats.visits.reduce((s,v)=>s+v.pct,0) / stats.visits.length);
      return {
        label: name,
        value: avg,
        color: avg >= 80 ? '#27AE60' : avg >= 60 ? '#F39C12' : '#E74C3C',
        valueText: avg + '%'
      };
    });
    
    const chartH = Math.min(150, 8 + sorted.length * 7);
    _drawBarChart(pdf, compareData, 12, y, 186, chartH, {
      title: 'متوسط نسبة المطابقة لكل مدير',
      maxValue: 100, unit: '%'
    });
    y += chartH + 4;
    
    // SECTION 2: Detailed card for each manager
    _updatePdfProgress(50, 'بطاقة كل مدير...');
    
    sorted.forEach(([name, stats], idx) => {
      _updatePdfProgress(50 + (40 * idx / sorted.length), 'مدير: ' + name);
      
      const visits = [...stats.visits].sort((a,b) => a.m*31+a.d - (b.m*31+b.d));
      const avg = Math.round(visits.reduce((s,v)=>s+v.pct,0) / visits.length);
      const maxScore = Math.max(...visits.map(v=>v.pct));
      const minScore = Math.min(...visits.map(v=>v.pct));
      const color = avg >= 80 ? '#27AE60' : avg >= 60 ? '#F39C12' : '#E74C3C';
      
      // Trend analysis
      const trend = (typeof analyzeManagerTrend === 'function') ? analyzeManagerTrend(visits) : { trend: 'stable', delta: 0 };
      const trendTxt = trend.trend === 'up' ? '📈 تحسّن +' + trend.delta + '%' : trend.trend === 'down' ? '📉 تراجع ' + trend.delta + '%' : '➡️ مستقر';
      
      // Verdict
      const verdict = avg < 70 ? '🔴 إنذار رسمي + خطة تصحيحية فورية' 
                    : avg < 90 ? '🟡 متابعة مكثفة + برنامج تطوير أسبوعي' 
                    : '🟢 تقدير رسمي + ترشيح للمكافأة';
      
      // Branches
      const branchesTxt = [...stats.branches].map(b => BRANCH_NAMES[b] || b).join('، ');
      
      // Top failed items
      const failList = Object.entries(stats.failItems || {}).sort((a,b)=>b[1]-a[1]).slice(0, 3);
      const failTxt = failList.length > 0
        ? failList.map(([id,cnt]) => {
            const it = allItemsLib.find(i => i.id === id);
            return (it?.text || id).substring(0, 35) + ' (' + cnt + '×)';
          }).join(' | ')
        : '✅ لا توجد بنود فاشلة متكررة';
      
      // Action plan
      let totalAP = 0, doneAP = 0;
      visits.forEach(v => {
        const visit = getVisitData(v.branch, v.m, v.d);
        allItemsLib.forEach(item => {
          if (visit.results?.[item.id] === 'fail') {
            totalAP++;
            if (visit.actionStatus?.[item.id]?.status === 'done') doneAP++;
          }
        });
      });
      const apPct = totalAP > 0 ? Math.round((doneAP/totalAP)*100) : null;
      
      // New page for each manager (clean layout)
      pdf.addPage();
      y = 15;
      
      // Header bar
      pdf.setFillColor(color);
      pdf.rect(10, y, 190, 14, 'F');
      const headerImg = _arabicTextCanvas('#' + (idx+1) + '  👤 ' + name + '  —  ' + avg + '%', 
        { fontSize: 16, color: '#fff', fontWeight: 900, width: 1000, padding: 0, align: 'right' });
      pdf.addImage(headerImg.dataUrl, 'PNG', 12, y + 3, 186, 9);
      y += 18;
      
      // Stats row
      _drawStatBox(pdf, 'الزيارات', String(visits.length), '#3498DB', 12, y, 45, 20);
      _drawStatBox(pdf, 'أعلى', maxScore + '%', '#27AE60', 60, y, 45, 20);
      _drawStatBox(pdf, 'أدنى', minScore + '%', '#E74C3C', 108, y, 45, 20);
      _drawStatBox(pdf, 'الاتجاه', trendTxt.split(' ')[1] || '-', trend.trend==='up'?'#27AE60':trend.trend==='down'?'#E74C3C':'#95A5A6', 156, y, 42, 20);
      y += 24;
      
      // Branches
      y = _pdfText(pdf, '🏪 الفروع: ' + branchesTxt, 12, y, { fontSize: 10, color: '#333', targetWidth: 186, spacing: 2 });
      
      // Action plan progress
      if (apPct !== null) {
        const apColor = apPct >= 80 ? '#27AE60' : apPct >= 50 ? '#F39C12' : '#E74C3C';
        pdf.setFillColor('#F5F5F5');
        pdf.roundedRect(12, y, 186, 7, 1, 1, 'F');
        pdf.setFillColor(apColor);
        pdf.roundedRect(12, y, 186 * (apPct/100), 7, 1, 1, 'F');
        const apImg = _arabicTextCanvas('🎯 الأكشن بلان: ' + doneAP + ' / ' + totalAP + ' منجز  (' + apPct + '%)',
          { fontSize: 9, color: '#000', fontWeight: 800, width: 1000, padding: 0, align: 'right' });
        pdf.addImage(apImg.dataUrl, 'PNG', 12, y + 0.5, 186, 6);
        y += 10;
      }
      
      // Top failed items
      y = _pdfText(pdf, '🔴 أكثر البنود فشلاً: ' + failTxt, 12, y, 
        { fontSize: 9, color: '#C0392B', targetWidth: 186, spacing: 3 });
      
      // Verdict
      pdf.setFillColor(color);
      pdf.roundedRect(12, y, 186, 10, 2, 2, 'F');
      const vImg = _arabicTextCanvas(verdict, { fontSize: 11, color: '#fff', fontWeight: 800, width: 1000, padding: 0, align: 'center' });
      pdf.addImage(vImg.dataUrl, 'PNG', 12, y + 1.5, 186, 7);
      y += 14;
      
      // Sparkline chart of visits
      if (visits.length > 1) {
        const trendPoints = visits.map(v => ({ label: v.d + '/' + (v.m+1), value: v.pct }));
        _drawLineChart(pdf, trendPoints, 12, y, 186, 50, {
          title: '📈 اتجاه الأداء عبر الزيارات',
          minY: 0, maxY: 100, color: color
        });
        y += 54;
      }
      
      // Visit details table
      y = _ensureRoom(pdf, y, 30);
      y = _drawHeader(pdf, '📋 تفاصيل الزيارات', y, '#9B59B6');
      y += 3;
      
      // Table header
      pdf.setFillColor('#9B59B6');
      pdf.rect(12, y, 186, 7, 'F');
      const hdrTxt = _arabicTextCanvas('التاريخ              |              الفرع              |              الشيفت              |              النسبة', 
        { fontSize: 9, color: '#fff', fontWeight: 800, width: 1000, padding: 0, align: 'center' });
      pdf.addImage(hdrTxt.dataUrl, 'PNG', 12, y + 1, 186, 5);
      y += 8;
      
      visits.slice(-10).forEach((v, vi) => {
        y = _ensureRoom(pdf, y, 8);
        if (vi % 2 === 0) {
          pdf.setFillColor('#F8F9FA');
          pdf.rect(12, y, 186, 6, 'F');
        }
        const rowTxt = (v.d + ' ' + MONTHS_AR[v.m]) + '   |   ' + (BRANCH_NAMES[v.branch] || v.branch) + '   |   ' + (v.shift || '-') + '   |   ' + v.pct + '%';
        const rImg = _arabicTextCanvas(rowTxt, { fontSize: 8, color: '#333', fontWeight: 600, width: 1000, padding: 0, align: 'center' });
        pdf.addImage(rImg.dataUrl, 'PNG', 12, y + 0.8, 186, 4.5);
        y += 6;
      });
    });
    
    const MONTHS_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    
    pdf.save(`مديرون_ب_لبن_${new Date().toISOString().split('T')[0]}.pdf`);
    if (typeof showNotif === 'function') showNotif('✅ تم تنزيل PDF المديرين', 'success');
  } catch(err) {
    console.error('PDF Managers error:', err);
    if (typeof showNotif === 'function') showNotif('❌ ' + (err.message || err), 'error');
  } finally {
    _hidePdfLoading();
  }
}

// ============================================================
// COMPREHENSIVE PDF (combines everything)
// ============================================================
async function pdfExportComprehensive(branch) {
  _showPdfLoading('جاري إنشاء التقرير الشامل...');
  _updatePdfProgress(5, 'بدء التجميع...');
  
  try {
    const pdf = _newPdf();
    _drawCover(pdf, '📑 التقرير الشامل', branch ? 'فرع ' + (BRANCH_NAMES[branch] || branch) : 'جميع الفروع');
    
    // === Section 1: Overview stats ===
    _updatePdfProgress(15, 'إحصائيات عامة...');
    pdf.addPage();
    let y = 15;
    y = _drawHeader(pdf, '📊 ملخص النظام', y, '#3498DB');
    y += 6;
    
    let totalVisits = 0, totalFails = 0, totalOk = 0, totalCritical = 0;
    const allItemsLib = CHECKLIST.flatMap(s => s.items);
    BRANCHES.forEach(b => {
      for (let m = 0; m < 12; m++) {
        for (let d = 1; d <= MONTH_DAYS[m]; d++) {
          const key = getKey(b, m, d);
          if (!appData[key]) continue;
          const v = appData[key];
          if (!v.results || Object.keys(v.results).length === 0) continue;
          totalVisits++;
          Object.entries(v.results).forEach(([id, val]) => {
            if (val === 'ok') totalOk++;
            else if (val === 'fail') {
              totalFails++;
              const item = allItemsLib.find(i => i.id === id);
              if (item?.critical) totalCritical++;
            }
          });
        }
      }
    });
    const overallPct = (totalOk + totalFails) > 0 ? Math.round((totalOk / (totalOk + totalFails)) * 100) : 0;
    
    _drawStatBox(pdf, 'الزيارات', String(totalVisits), '#3498DB', 12, y, 90, 22);
    _drawStatBox(pdf, 'الأداء', overallPct + '%', overallPct >= 80 ? '#27AE60' : '#F39C12', 108, y, 90, 22);
    y += 26;
    _drawStatBox(pdf, 'بنود مطابقة', String(totalOk), '#27AE60', 12, y, 90, 22);
    _drawStatBox(pdf, 'بنود غير مطابقة', String(totalFails), '#E74C3C', 108, y, 90, 22);
    y += 30;
    
    // === Section 2: Branch averages chart ===
    _updatePdfProgress(30, 'مقارنة الفروع...');
    y = _drawHeader(pdf, '📈 مقارنة الفروع', y, '#16A085');
    y += 4;
    
    const branchData = BRANCHES.map(b => {
      const scores = [];
      for (let m = 0; m < 12; m++) {
        for (let d = 1; d <= MONTH_DAYS[m]; d++) {
          const key = getKey(b, m, d);
          if (!appData[key]) continue;
          const v = appData[key];
          if (!v.results || Object.keys(v.results).length === 0) continue;
          try { scores.push(calcSmartScore(b, m, d).percent || 0); } catch(e) {}
        }
      }
      const avg = scores.length > 0 ? Math.round(scores.reduce((a,c)=>a+c,0)/scores.length) : 0;
      return { label: BRANCH_NAMES[b] || b, value: avg, color: avg >= 80 ? '#27AE60' : avg >= 60 ? '#F39C12' : '#E74C3C', valueText: avg + '%' };
    });
    _drawBarChart(pdf, branchData, 12, y, 186, 60, { title: '', maxValue: 100 });
    y += 64;
    
    // === Section 3: Top failed items ===
    _updatePdfProgress(45, 'البنود الأكثر فشلاً...');
    pdf.addPage();
    y = 15;
    y = _drawHeader(pdf, '🔴 أكثر البنود فشلاً', y, '#E74C3C');
    y += 4;
    
    const failCounts = {};
    BRANCHES.forEach(b => {
      for (let m = 0; m < 12; m++) {
        for (let d = 1; d <= MONTH_DAYS[m]; d++) {
          const key = getKey(b, m, d);
          if (!appData[key]) continue;
          Object.entries(appData[key].results || {}).forEach(([id, val]) => {
            if (val === 'fail') failCounts[id] = (failCounts[id] || 0) + 1;
          });
        }
      }
    });
    const top10 = Object.entries(failCounts).sort((a,b)=>b[1]-a[1]).slice(0, 10).map(([id, cnt]) => {
      const item = allItemsLib.find(i => i.id === id);
      return { label: (item?.text || id).substring(0, 28), value: cnt, color: '#E74C3C', valueText: cnt + 'مرة' };
    });
    if (top10.length > 0) {
      _drawBarChart(pdf, top10, 12, y, 186, 70, { title: '' });
      y += 74;
    } else {
      y = _pdfText(pdf, '✅ لا توجد بنود فاشلة', 12, y, { fontSize: 14, color: '#27AE60', targetWidth: 186, align: 'center' });
    }
    
    // === Section 4: Top managers ===
    _updatePdfProgress(60, 'أداء المديرين...');
    pdf.addPage();
    y = 15;
    y = _drawHeader(pdf, '👔 ترتيب المديرين', y, '#9B59B6');
    y += 4;
    
    const managerStats = (typeof buildManagerStats === 'function') ? buildManagerStats() : {};
    const mgrSorted = Object.entries(managerStats).sort((a,b) => {
      const avgA = a[1].visits.reduce((s,v)=>s+v.pct,0)/a[1].visits.length;
      const avgB = b[1].visits.reduce((s,v)=>s+v.pct,0)/b[1].visits.length;
      return avgB - avgA;
    });
    
    const mgrData = mgrSorted.map(([name, s]) => {
      const avg = Math.round(s.visits.reduce((sum,v)=>sum+v.pct,0) / s.visits.length);
      return { label: name, value: avg, color: avg >= 80 ? '#27AE60' : avg >= 60 ? '#F39C12' : '#E74C3C', valueText: avg + '%' };
    });
    if (mgrData.length > 0) {
      const mgrChartH = Math.min(150, 8 + mgrData.length * 7);
      _drawBarChart(pdf, mgrData, 12, y, 186, mgrChartH, { title: '', maxValue: 100 });
      y += mgrChartH + 4;
    } else {
      y = _pdfText(pdf, '⚠️ لا توجد بيانات مديرين', 12, y, { fontSize: 14, color: '#888', targetWidth: 186, align: 'center' });
    }
    
    // === Section 5: Tasks summary ===
    _updatePdfProgress(75, 'المهام...');
    pdf.addPage();
    y = 15;
    y = _drawHeader(pdf, '📋 المهام', y, '#16A085');
    y += 6;
    
    const tasks = (typeof tasksData !== 'undefined' && Array.isArray(tasksData)) ? tasksData : [];
    const completed = tasks.filter(t => t.status === 'completed' || t.done).length;
    const inProg = tasks.filter(t => t.status === 'in-progress').length;
    const pending = tasks.length - completed - inProg;
    const urgent = tasks.filter(t => (t.priority === 'عاجلة' || t.priority === 'urgent') && !t.done && t.status !== 'completed').length;
    
    _drawStatBox(pdf, 'إجمالي', String(tasks.length), '#3498DB', 12, y, 45, 22);
    _drawStatBox(pdf, 'منتهية', String(completed), '#27AE60', 60, y, 45, 22);
    _drawStatBox(pdf, 'قيد التنفيذ', String(inProg), '#F39C12', 108, y, 45, 22);
    _drawStatBox(pdf, 'عاجلة معلقة', String(urgent), '#E74C3C', 156, y, 42, 22);
    y += 28;
    
    // Completion rate
    const completionRate = tasks.length > 0 ? Math.round((completed / tasks.length) * 100) : 0;
    pdf.setFillColor('#F5F5F5');
    pdf.roundedRect(12, y, 186, 9, 1.5, 1.5, 'F');
    pdf.setFillColor(completionRate >= 80 ? '#27AE60' : completionRate >= 50 ? '#F39C12' : '#E74C3C');
    pdf.roundedRect(12, y, 186 * (completionRate/100), 9, 1.5, 1.5, 'F');
    const crImg = _arabicTextCanvas('📊 معدل الإنجاز الكلي: ' + completionRate + '%', 
      { fontSize: 10, color: '#000', fontWeight: 800, width: 1000, padding: 0, align: 'center' });
    pdf.addImage(crImg.dataUrl, 'PNG', 12, y + 1, 186, 7);
    y += 14;
    
    // Tasks by branch
    y = _drawHeader(pdf, '📈 توزيع المهام حسب الفرع', y, '#16A085');
    y += 4;
    
    const byBranchData = BRANCHES.map(b => {
      const branchTasks = tasks.filter(t => {
        const tBranches = (typeof getTaskBranches === 'function') ? getTaskBranches(t) : (t.branch ? [t.branch] : []);
        return tBranches.includes(b);
      });
      const bDone = branchTasks.filter(t => {
        const bs = t.branchStatus?.[b];
        return bs?.status === 'completed' || (t.status === 'completed' && !t.branchStatus);
      }).length;
      return {
        label: BRANCH_NAMES[b] || b,
        value: branchTasks.length,
        color: '#16A085',
        valueText: bDone + '/' + branchTasks.length + ' منجز'
      };
    });
    _drawBarChart(pdf, byBranchData, 12, y, 186, 45, { title: '', maxValue: Math.max(...byBranchData.map(d=>d.value), 1) });
    y += 49;
    
    // All tasks list (paginated)
    pdf.addPage();
    y = 15;
    y = _drawHeader(pdf, '📋 قائمة كل المهام (' + tasks.length + ')', y, '#9B59B6');
    y += 4;
    
    if (tasks.length === 0) {
      y = _pdfText(pdf, '⚠️ لا توجد مهام', 12, y, { fontSize: 14, color: '#888', align: 'center', targetWidth: 186 });
    } else {
      // Sort: urgent first, then by date
      const sortedTasks = [...tasks].sort((a, b) => {
        const aDone = a.done || a.status === 'completed';
        const bDone = b.done || b.status === 'completed';
        if (aDone !== bDone) return aDone ? 1 : -1;
        const aUrg = (a.priority === 'عاجلة' || a.priority === 'urgent') ? 0 : 1;
        const bUrg = (b.priority === 'عاجلة' || b.priority === 'urgent') ? 0 : 1;
        if (aUrg !== bUrg) return aUrg - bUrg;
        return (new Date(b.createdAt || 0).getTime()) - (new Date(a.createdAt || 0).getTime());
      });
      
      sortedTasks.forEach((t, i) => {
        const isDone = t.done || t.status === 'completed';
        const stIcon = isDone ? '✅' : t.status === 'in-progress' ? '🔄' : '⬜';
        const isUrgent = t.priority === 'عاجلة' || t.priority === 'urgent';
        const tBranches = (typeof getTaskBranches === 'function') ? getTaskBranches(t) : (t.branch ? [t.branch] : []);
        const bLabel = (!tBranches || tBranches.length === 0) ? 'جميع الفروع' : tBranches.map(b => BRANCH_NAMES[b] || b).join('، ');
        
        const bgColor = isDone ? '#E8F8F0' : isUrgent ? '#FDECEA' : '#FAFAFA';
        const borderColor = isDone ? '#27AE60' : isUrgent ? '#E74C3C' : '#9B59B6';
        
        y = _ensureRoom(pdf, y, 22);
        pdf.setFillColor(bgColor);
        pdf.setDrawColor(borderColor);
        pdf.setLineWidth(0.3);
        pdf.roundedRect(10, y, 190, 18, 1.5, 1.5, 'FD');
        
        // Title line
        const titleTxt = stIcon + ' ' + (isUrgent ? '🔴 ' : '') + (i + 1) + '. ' + (t.title || '');
        y = _pdfText(pdf, titleTxt, 12, y + 1, { fontSize: 10, fontWeight: 800, color: '#000', targetWidth: 186, spacing: 0.5 });
        
        // Meta line
        const metaTxt = '🏪 ' + bLabel
          + (t.assignee ? '  •  👤 ' + t.assignee : '')
          + (t.deadline ? '  •  📅 ' + t.deadline : '')
          + (t.completedBy ? '  •  ✓ ' + t.completedBy : '');
        y = _pdfText(pdf, metaTxt, 12, y, { fontSize: 8, color: '#555', targetWidth: 186, spacing: 0.5 });
        
        // Description (if exists)
        if (t.desc && t.desc.length > 0) {
          y = _pdfText(pdf, '📝 ' + t.desc.substring(0, 120) + (t.desc.length > 120 ? '...' : ''), 
            12, y, { fontSize: 8, color: '#444', targetWidth: 186, spacing: 4 });
        } else {
          y += 4;
        }
      });
    }
    
    // === Section 6: Recommendations ===
    _updatePdfProgress(90, 'التوصيات...');
    pdf.addPage();
    y = 15;
    y = _drawHeader(pdf, '💡 أهم التوصيات', y, '#F39C12');
    y += 4;
    
    const topRecos = Object.entries(failCounts).sort((a,b)=>b[1]-a[1]).slice(0, 5);
    if (topRecos.length > 0) {
      topRecos.forEach(([id, cnt], i) => {
        const item = allItemsLib.find(i => i.id === id);
        if (!item) return;
        y = _ensureRoom(pdf, y, 18);
        pdf.setFillColor('#FEF9E7');
        pdf.setDrawColor('#F39C12');
        pdf.setLineWidth(0.3);
        pdf.roundedRect(10, y, 190, 14, 2, 2, 'FD');
        y = _pdfText(pdf, (i+1) + '. ' + item.text + '  (تكرر ' + cnt + ' مرة)', 12, y + 1.5,
          { fontSize: 10, fontWeight: 800, color: '#D35400', targetWidth: 186, spacing: 0.5 });
        y = _pdfText(pdf, 'يُوصى بإجراء مراجعة فورية وتدريب المديرين', 12, y, 
          { fontSize: 8, color: '#555', targetWidth: 186, spacing: 5 });
      });
    } else {
      y = _pdfText(pdf, '✅ لا توجد توصيات حرجة — الأداء جيد', 12, y, { fontSize: 14, color: '#27AE60', align: 'center', targetWidth: 186 });
    }
    
    pdf.save(`تقرير_شامل_${branch ? BRANCH_NAMES[branch] : 'كامل'}_${new Date().toISOString().split('T')[0]}.pdf`);
    if (typeof showNotif === 'function') showNotif('✅ تم تنزيل التقرير الشامل', 'success');
  } catch(err) {
    console.error('PDF Comprehensive error:', err);
    if (typeof showNotif === 'function') showNotif('❌ ' + (err.message || err), 'error');
  } finally {
    _hidePdfLoading();
  }
}
