<script>
// ===================== MANAGERS PAGE =====================
function buildManagerStats() {
  const managerStats = {};
  BRANCHES.forEach(branch => {
    for (let m = 0; m < 12; m++) {
      for (let d = 1; d <= MONTH_DAYS[m]; d++) {
        const key = getKey(branch, m, d);
        if (!appData[key]) continue;
        const visit = appData[key];
        // Multi-manager support: prefer visit.managers (array), fall back to visit.manager (string)
        const managerList = (Array.isArray(visit.managers) && visit.managers.length > 0)
          ? visit.managers
          : (visit.manager?.trim() ? [visit.manager.trim()] : []);
        if (managerList.length === 0) continue;
        const { pct, answered } = calcSmartScore(branch, m, d);
        if (answered === 0) continue;
        
        // Attribute the score to each manager — they're all responsible
        managerList.forEach(manager => {
          const mname = manager.trim();
          if (!mname) return;
          if (!managerStats[mname]) managerStats[mname] = { visits:[], failItems:{}, branches:new Set(), sharedVisits: 0 };
          managerStats[mname].visits.push({ 
            branch, m, d, pct, 
            date:`${d} ${MONTHS[m]}`,
            sharedWith: managerList.length > 1 ? managerList.filter(n => n.trim() !== mname) : []
          });
          managerStats[mname].branches.add(branch);
          if (managerList.length > 1) managerStats[mname].sharedVisits++;
          Object.entries(visit.results||{}).forEach(([id,val]) => {
            if (val === 'fail') managerStats[mname].failItems[id] = (managerStats[mname].failItems[id]||0)+1;
          });
        });
      }
    }
  });
  return managerStats;
}

function analyzeManagerTrend(visits) {
  if (visits.length < 2) return { trend: 'neutral', delta: 0, improving: false, avgFirst:0, avgLast:0 };
  const sorted = [...visits].sort((a,b) => a.m*31+a.d - (b.m*31+b.d));
  const half = Math.ceil(sorted.length / 2);
  const first = sorted.slice(0, half);
  const last = sorted.slice(sorted.length - half);
  const avgFirst = first.reduce((s,v)=>s+v.pct,0)/first.length;
  const avgLast = last.reduce((s,v)=>s+v.pct,0)/last.length;
  const delta = Math.round(avgLast - avgFirst);
  return {
    trend: delta > 3 ? 'up' : delta < -3 ? 'down' : 'stable',
    delta, improving: delta > 3,
    avgFirst: Math.round(avgFirst), avgLast: Math.round(avgLast)
  };
}

function renderManagersPage() {
  const container = document.getElementById('managers-content');
  if (!container) return;
  const managerStats = buildManagerStats();
  let html = `<div class="card"><div class="card-title">👔 تقييم المديرين — تراكمي وتحليلي</div>
    <div class="alert alert-info" style="margin-bottom:14px;font-size:var(--fs-sm);">
      💡 <strong>للوصول لمعلومات أي مدير</strong> (الهاتف، الإيميل، العمر، نقاط القوة والضعف): اضغط زر <strong style="color:var(--gold);">"📋 تفاصيل"</strong> أسفل كل بطاقة مدير.
      <br>🔒 ملاحظة: تعديل البيانات الشخصية يتطلب فتح وضع التعديل من زر <strong style="color:var(--gold);">"🔐 الأمان"</strong> في الـ Header.
    </div>
  `;
  if (Object.keys(managerStats).length === 0) {
    html += `<div class="alert alert-info">لا توجد بيانات مديرين. أدخل أسماء المديرين في صفحات الفروع أولاً.</div>`;
  } else {
    const sorted = Object.entries(managerStats).sort((a,b) => {
      const avgA = a[1].visits.reduce((s,v)=>s+v.pct,0)/a[1].visits.length;
      const avgB = b[1].visits.reduce((s,v)=>s+v.pct,0)/b[1].visits.length;
      return avgB - avgA;
    });
    sorted.forEach(([name, stats]) => {
      const sortedVisits = [...stats.visits].sort((a,b) => a.m*31+a.d - (b.m*31+b.d));
      const avg = Math.round(stats.visits.reduce((s,v)=>s+v.pct,0) / stats.visits.length);
      const cls = scoreRating(avg).cls;
      const failList = Object.entries(stats.failItems).sort((a,b)=>b[1]-a[1]).slice(0,4);
      const trend = analyzeManagerTrend(stats.visits);
      const trendIcon = trend.trend==='up' ? '📈' : trend.trend==='down' ? '📉' : '➡️';
      const trendColor = trend.trend==='up' ? 'var(--green)' : trend.trend==='down' ? 'var(--red)' : 'var(--text-muted)';
      const trendText = trend.trend==='up' ? `تحسّن +${trend.delta}% (${trend.avgFirst}% → ${trend.avgLast}%)` : trend.trend==='down' ? `تراجع ${trend.delta}% (${trend.avgFirst}% → ${trend.avgLast}%)` : `مستقر (${trend.avgFirst}% → ${trend.avgLast}%)`;
      const sparkData = sortedVisits.map(v => v.pct);
      // Compute action plan summary for this manager
      const allItemsLib = CHECKLIST.flatMap(s=>s.items);
      let mTotalAP = 0, mDoneAP = 0;
      stats.visits.forEach(v => {
        const visit = getVisitData(v.branch, v.m, v.d);
        const fItems = allItemsLib.filter(i => visit.results[i.id] === 'fail');
        fItems.forEach(it => {
          mTotalAP++;
          if (visit.actionStatus?.[it.id]?.status === 'done') mDoneAP++;
        });
      });
      const mApPct = mTotalAP > 0 ? Math.round((mDoneAP/mTotalAP)*100) : null;
      const sparkMin = Math.min(...sparkData, 0);
      const sparkMax = Math.max(...sparkData, 100);
      const sparkH = 40, sparkW = Math.min(Math.max(sparkData.length * 18, 80), 240);  // Cap width
      const sparkPts = sparkData.map((v,i) => {
        const x = sparkData.length > 1 ? (i / (sparkData.length-1)) * (sparkW-4) + 2 : sparkW/2;
        const y = sparkH - ((v - sparkMin)/(sparkMax - sparkMin || 1)) * (sparkH-6) - 3;
        return `${x},${y}`;
      }).join(' ');
      const sparkColor = trend.trend==='up' ? '#2ECC71' : trend.trend==='down' ? '#E74C3C' : '#C9A84C';
      html += `
      <div class="manager-score-row manager-card-fixed">
        <div class="score-circle ${cls}">${avg}%</div>
        <div class="manager-card-body">
          <div class="manager-card-header">
            <span class="manager-name">${name}</span>
            <span class="manager-trend" style="color:${trendColor};">${trendIcon} ${trendText}</span>
          </div>
          <div class="manager-meta">
            📅 ${stats.visits.length} زيارة • 🏪 ${[...stats.branches].map(b=>BRANCH_NAMES[b]).join('، ')} • من ${sortedVisits[0]?.date} إلى ${sortedVisits[sortedVisits.length-1]?.date}
          </div>
          <div class="manager-spark-row">
            <div class="manager-spark-box">
              <svg width="${sparkW}" height="${sparkH}" style="display:block;max-width:100%;">
                <polyline points="${sparkPts}" fill="none" stroke="${sparkColor}" stroke-width="2.5" stroke-linejoin="round"/>
                ${sparkData.map((v,i)=>{const x=sparkData.length>1?(i/(sparkData.length-1))*(sparkW-4)+2:sparkW/2;const y=sparkH-((v-sparkMin)/(sparkMax-sparkMin||1))*(sparkH-6)-3;return`<circle cx="${x}" cy="${y}" r="3" fill="${sparkColor}"/><title>${sortedVisits[i]?.date}: ${v}%</title>`;}).join('')}
              </svg>
            </div>
            <div class="manager-spark-stats">
              <div>أعلى: <strong style="color:var(--green)">${Math.max(...sparkData)}%</strong></div>
              <div>أدنى: <strong style="color:var(--red)">${Math.min(...sparkData)}%</strong></div>
              <div>أخير: <strong style="color:var(--gold)">${sparkData[sparkData.length-1]}%</strong></div>
            </div>
          </div>
          ${failList.length>0?`<div class="manager-tags">${failList.map(([id,cnt])=>{const t=CHECKLIST.flatMap(s=>s.items).find(i=>i.id===id)?.text?.substring(0,38)||id;return`<span class="tag tag-red">${t}... (${cnt}×)</span>`;}).join('')}</div>`:'' }
          <div class="progress-wrap" style="margin-top:8px"><div class="progress-bar"><div class="progress-fill ${cls}" style="width:${avg}%"></div></div></div>
          ${mTotalAP > 0 ? `
          <div class="manager-ap-mini">
            <div class="manager-ap-mini-row">
              <span style="font-weight:700;color:var(--gold-light);">🎯 أكشن بلان المدير</span>
              <span style="color:var(--text-muted);">${mDoneAP} / ${mTotalAP} منجز • <strong style="color:${scoreColor(mApPct)};">${mApPct}%</strong></span>
            </div>
            <div class="ap-progress-bar" style="margin-top:4px;height:6px;"><div class="ap-progress-fill" style="width:${mApPct}%"></div></div>
          </div>` : ''}
          <div class="manager-actions">
            ${avg<70?`<span class="manager-verdict verdict-red">🔴 إنذار رسمي + خطة تصحيحية فورية</span>`:avg<90?`<span class="manager-verdict verdict-orange">🟡 متابعة مكثفة + برنامج تطوير أسبوعي</span>`:`<span class="manager-verdict verdict-green">🟢 تقدير رسمي + ترشيح للمكافأة</span>`}
            <button class="btn btn-gold btn-sm" style="font-weight:800;" onclick="showManagerDetail('${name}')">📋 الملف الشخصي والتفاصيل</button>
          </div>
        </div>
      </div>`;
    });
  }
  html += `</div>
  <div id="manager-detail-panel"></div>
  <div class="page-footer"><div class="footer-actions">
    <button class="btn btn-gold btn-sm" onclick="exportManagersExcel()">📊 Excel</button>
    
    <button class="btn btn-purple" onclick="openShareModal('managers',null,'تقييم المديرين')">📤 مشاركة</button>
  </div></div>`;
  container.innerHTML = html;
}

function showManagerDetail(name) {
  const panel = document.getElementById('manager-detail-panel');
  if (!panel) return;
  const stats = buildManagerStats()[name];
  if (!stats) return;
  const sortedVisits = [...stats.visits].sort((a,b)=>a.m*31+a.d-(b.m*31+b.d));
  
  // PIN required for personal profile (sensitive HR info)
  const editingNow = typeof canEditNow === 'function' && canEditNow();
  
  // Load saved personal profile
  const profiles = JSON.parse(localStorage.getItem('blaban_manager_profiles') || '{}');
  const profile = profiles[name] || { phone:'', email:'', joined:'', age:'', notes:'', strengths:'', weaknesses:'' };
  
  // AUTO-ANALYZE strengths/weaknesses from data
  const allItemsLib = CHECKLIST.flatMap(s=>s.items.map(it=>({...it,section:s.section})));
  const okCount = {}, failCount = {};
  sortedVisits.forEach(v => {
    const visit = getVisitData(v.branch, v.m, v.d);
    allItemsLib.forEach(item => {
      const r = visit.results[item.id];
      if (r === 'ok') okCount[item.id] = (okCount[item.id]||0) + 1;
      else if (r === 'fail') failCount[item.id] = (failCount[item.id]||0) + 1;
    });
  });
  // Top strengths: items with highest ok count and no fails
  const strengths = Object.entries(okCount)
    .filter(([id,c]) => c >= 3 && !failCount[id])
    .sort((a,b)=>b[1]-a[1])
    .slice(0,5)
    .map(([id,c]) => {
      const item = allItemsLib.find(i=>i.id===id);
      return { ...item, count: c };
    });
  // Top weaknesses: items failed multiple times
  const weaknesses = Object.entries(failCount)
    .filter(([id,c]) => c >= 2)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,5)
    .map(([id,c]) => {
      const item = allItemsLib.find(i=>i.id===id);
      return { ...item, count: c };
    });
  
  // Build action plan summary across all visits of this manager
  const allItems = CHECKLIST.flatMap(s=>s.items);
  let totalAP = 0, doneAP = 0, inProgressAP = 0, pendingAP = 0;
  const apDetails = [];
  sortedVisits.forEach(v => {
    const visit = getVisitData(v.branch, v.m, v.d);
    const failItems = allItems.filter(i => visit.results[i.id] === 'fail');
    failItems.forEach(item => {
      const aSt = visit.actionStatus?.[item.id] || { status:'pending' };
      totalAP++;
      if (aSt.status === 'done') doneAP++;
      else if (aSt.status === 'in-progress') inProgressAP++;
      else pendingAP++;
      apDetails.push({ visit:v, item, status: aSt.status||'pending', entries: aSt.entries||[], completedAt: aSt.completedAt, completedBy: aSt.completedBy, opsNote: visit.notes?.[item.id]||'' });
    });
  });
  const apPct = totalAP > 0 ? Math.round((doneAP/totalAP)*100) : 0;
  
  let html = `<div class="card" style="border-color:var(--gold)">
    <div class="card-title">📋 الملف الشخصي والتقييم — ${name}</div>
    
    ${!editingNow ? `
    <div class="alert alert-info" style="margin-bottom:14px;">
      🔒 <strong>الملف الشخصي محمي</strong> — لتعديل البيانات الشخصية، افتح وضع التعديل (🔐 الأمان).
    </div>
    ` : ''}
    
    <!-- Personal info card (PIN-protected) -->
    <div class="manager-profile-card">
      <h4>👤 المعلومات الشخصية</h4>
      <div class="manager-profile-grid">
        <div class="manager-profile-field">
          <label>📞 الهاتف</label>
          ${editingNow ? `<input type="text" value="${profile.phone}" oninput="saveManagerProfileField('${name.replace(/'/g,"\\'")}','phone',this.value)" placeholder="رقم الهاتف">` : `<div class="profile-readonly">${profile.phone||'—'}</div>`}
        </div>
        <div class="manager-profile-field">
          <label>✉️ الإيميل</label>
          ${editingNow ? `<input type="email" value="${profile.email}" oninput="saveManagerProfileField('${name.replace(/'/g,"\\'")}','email',this.value)" placeholder="email@example.com">` : `<div class="profile-readonly">${profile.email||'—'}</div>`}
        </div>
        <div class="manager-profile-field">
          <label>📅 تاريخ الالتحاق</label>
          ${editingNow ? `<input type="date" value="${profile.joined}" oninput="saveManagerProfileField('${name.replace(/'/g,"\\'")}','joined',this.value)">` : `<div class="profile-readonly">${profile.joined||'—'}</div>`}
        </div>
        <div class="manager-profile-field">
          <label>🎂 العمر</label>
          ${editingNow ? `<input type="number" min="18" max="80" value="${profile.age}" oninput="saveManagerProfileField('${name.replace(/'/g,"\\'")}','age',this.value)" placeholder="مثلاً: 35">` : `<div class="profile-readonly">${profile.age||'—'}</div>`}
        </div>
      </div>
      <div class="manager-profile-field" style="margin-top:10px;">
        <label>📝 ملاحظات شخصية</label>
        ${editingNow ? `<textarea rows="2" oninput="saveManagerProfileField('${name.replace(/'/g,"\\'")}','notes',this.value)" placeholder="ملاحظات خاصة بالمقيّم...">${profile.notes||''}</textarea>` : `<div class="profile-readonly" style="min-height:40px;">${profile.notes||'—'}</div>`}
      </div>
    </div>
    
    <!-- Auto-analyzed strengths and weaknesses (purely from evaluation data) -->
    <div class="strengths-weaknesses-grid">
      <div class="strength-box">
        <h4>💪 نقاط القوة <span style="font-size:11px;color:var(--text-muted);font-weight:600;">(تحليل تلقائي بناءً على التقييم)</span></h4>
        ${strengths.length > 0 ? `
        <ul class="sw-list">
          ${strengths.map(s => `<li>${s.icon} ${s.text} <span class="sw-count">✓ ${s.count}×</span></li>`).join('')}
        </ul>
        ` : '<p style="color:var(--text-muted);font-size:var(--fs-sm);">لم تتوفر بيانات كافية بعد لتحليل نقاط القوة.</p>'}
      </div>
      
      <div class="weakness-box">
        <h4>⚠️ نقاط الضعف <span style="font-size:11px;color:var(--text-muted);font-weight:600;">(تحليل تلقائي بناءً على التقييم)</span></h4>
        ${weaknesses.length > 0 ? `
        <ul class="sw-list">
          ${weaknesses.map(w => `<li>${w.icon} ${w.text} <span class="sw-count fail">✗ ${w.count}×</span></li>`).join('')}
        </ul>
        ` : '<p style="color:var(--text-muted);font-size:var(--fs-sm);">لا توجد نقاط ضعف ملحوظة. أداء جيد عموماً!</p>'}
      </div>
    </div>
    
    <!-- Action plan summary -->
    ${totalAP > 0 ? `
    <div style="background:linear-gradient(135deg,rgba(211,84,0,0.10),rgba(107,27,42,0.10));border:1px solid var(--orange);border-radius:12px;padding:14px;margin-bottom:14px;">
      <div style="font-weight:800;color:var(--gold-light);margin-bottom:10px;font-size:14px;">🎯 إجمالي الأكشن بلان للمدير</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;">
        <div class="ap-stat ap-stat-total"><span class="ap-stat-num">${totalAP}</span><span class="ap-stat-label">إجمالي البنود</span></div>
        <div class="ap-stat ap-stat-pending"><span class="ap-stat-num">${pendingAP}</span><span class="ap-stat-label">⏳ معلقة</span></div>
        <div class="ap-stat ap-stat-progress"><span class="ap-stat-num">${inProgressAP}</span><span class="ap-stat-label">🔄 قيد التنفيذ</span></div>
        <div class="ap-stat ap-stat-done"><span class="ap-stat-num">${doneAP}</span><span class="ap-stat-label">✅ مكتملة</span></div>
      </div>
      <div class="ap-progress-bar" style="margin-top:10px;"><div class="ap-progress-fill" style="width:${apPct}%"></div></div>
      <div style="text-align:center;font-size:var(--fs-sm);color:var(--text-muted);margin-top:6px;font-weight:700;">معدل تنفيذ المدير: <strong style="color:${scoreColor(apPct)};">${apPct}%</strong></div>
    </div>
    ` : ''}
    
    <!-- Visits table -->
    <div style="font-weight:800;color:var(--gold-light);margin-bottom:8px;font-size:var(--fs-base);">📊 سجل الزيارات</div>
    <div style="overflow-x:auto;">
    <table class="data-table">
      <tr><th>التاريخ</th><th>الفرع</th><th>النتيجة</th><th>التغيير</th><th>أكشن بلان</th></tr>
      ${sortedVisits.map((v,i)=>{
        const prev = i>0?sortedVisits[i-1].pct:null;
        const delta = prev!==null?v.pct-prev:null;
        const dc = delta===null?'':delta>0?`<span style="color:var(--green)">▲+${delta}%</span>`:delta<0?`<span style="color:var(--red)">▼${delta}%</span>`:`<span style="color:var(--text-muted)">—</span>`;
        const cls = v.pct>=90?'tag-green':v.pct>=70?'tag-orange':'tag-red';
        // AP for this visit
        const visit = getVisitData(v.branch, v.m, v.d);
        const fItems = allItems.filter(it => visit.results[it.id] === 'fail');
        const totalV = fItems.length;
        const doneV = fItems.filter(it => visit.actionStatus?.[it.id]?.status === 'done').length;
        const apCell = totalV === 0 ? `<span style="color:var(--green);">—</span>` :
          `<span class="tag ${doneV===totalV?'tag-green':doneV>0?'tag-orange':'tag-red'}">${doneV}/${totalV}</span>`;
        return`<tr><td>${v.date}</td><td>${BRANCH_NAMES[v.branch]}</td><td><span class="tag ${cls}">${v.pct}%</span></td><td>${dc}</td><td>${apCell}</td></tr>`;
      }).join('')}
    </table>
    </div>
  </div>`;
  
  // Detailed action plan items
  if (apDetails.length > 0) {
    const pendingDetails = apDetails.filter(d => d.status !== 'done');
    const doneDetails = apDetails.filter(d => d.status === 'done');
    html += `<div class="card" style="border-color:var(--orange);">
      <div class="card-title">🎯 بنود الأكشن بلان التفصيلية — ${name}</div>
      <p style="color:var(--text-muted);font-size:var(--fs-sm);margin-bottom:10px;">
        تظهر هنا كل بنود الأكشن بلان المتولدة من تقييمات هذا المدير عبر كل الفروع التي تولّاها
      </p>`;
    if (pendingDetails.length > 0) {
      html += `<div style="margin-bottom:14px;">
        <div style="font-weight:800;color:var(--orange);margin-bottom:8px;font-size:var(--fs-base);">⏳ بنود معلقة / قيد التنفيذ (${pendingDetails.length})</div>`;
      pendingDetails.forEach(d => {
        const statusBadge = d.status === 'in-progress' ? `<span class="tag tag-orange">🔄 قيد التنفيذ</span>` : `<span class="tag tag-red">⏳ معلق</span>`;
        const entriesHtml = (d.entries||[]).length > 0 ? d.entries.slice(-2).map(e => `
          <div style="font-size:var(--fs-xs);color:var(--text-muted);margin-top:4px;padding:3px 6px;background:rgba(0,0,0,0.15);border-radius:4px;">
            👔 ${e.user} • ${new Date(e.timestamp).toLocaleDateString('ar-QA')}: ${e.text.substring(0,60)}
          </div>`).join('') : '';
        html += `<div class="action-plan-item ap-item-${d.status}" style="border-right-color:${d.status==='in-progress'?'var(--orange)':'var(--red)'}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:5px;margin-bottom:4px;">
            <span style="font-weight:700;font-size:var(--fs-sm);">${d.item.icon} ${d.item.text}</span>
            <div style="display:flex;gap:4px;flex-wrap:wrap;">
              ${statusBadge}
              <span class="tag tag-blue">${BRANCH_NAMES[d.visit.branch]}</span>
              <span class="tag" style="background:rgba(255,255,255,0.05);">📅 ${d.visit.date}</span>
            </div>
          </div>
          ${d.opsNote?`<div class="ap-ops-note" style="font-size:var(--fs-xs);">📌 توجيه: ${d.opsNote}</div>`:''}
          ${entriesHtml}
        </div>`;
      });
      html += `</div>`;
    }
    if (doneDetails.length > 0) {
      html += `<details><summary style="cursor:pointer;font-weight:800;color:var(--green);margin-bottom:8px;font-size:var(--fs-base);">✅ بنود مكتملة (${doneDetails.length}) — اضغط للعرض</summary>`;
      doneDetails.forEach(d => {
        html += `<div class="action-plan-item ap-item-done" style="border-right-color:var(--green);opacity:0.85;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:5px;margin-bottom:4px;">
            <span style="font-size:var(--fs-sm);">${d.item.icon} ${d.item.text}</span>
            <div style="display:flex;gap:4px;flex-wrap:wrap;">
              <span class="tag tag-green">✅ مكتمل</span>

        </div>`;
      });

  }

}

const BRANCH_COLORS = { nasr:'#E74C3C', farosiya:'#3498DB', gharafa:'#2ECC71', wakra:'#F39C12' };

function chartDefaults(scaleType) {
  // Detect light mode and pick contrasting colors
  const isLight = document.body.classList.contains('light-mode');
  const labelColor = isLight ? '#4A0F1A' : '#F0E6D3';   // dark maroon vs cream
  const tickColor  = isLight ? '#6B1B2A' : '#BCA98A';   // maroon vs muted cream
  const gridColor  = isLight ? 'rgba(107,27,42,0.08)' : 'rgba(255,255,255,0.05)';
  
  const base = {
    responsive: true, maintainAspectRatio: false,
    plugins: { 
      legend: { labels: { color: labelColor, font: { family: 'Tajawal', size: 11, weight: '700' } } },
      tooltip: { 
        bodyFont: { family: 'Tajawal' },
        titleFont: { family: 'Tajawal' },
        backgroundColor: isLight ? '#4A0F1A' : '#1A0810',
        titleColor: '#E8C96A',
        bodyColor: '#F0E6D3',
        borderColor: '#C9A84C',
        borderWidth: 1
      }
    },
  };
  if (scaleType === 'y_pct') {
    base.scales = {
      x:{ticks:{color:tickColor,font:{family:'Tajawal',size:10,weight:'700'}},grid:{color:gridColor}},
      y:{min:0,max:100,ticks:{color:tickColor,font:{family:'Tajawal',weight:'700'},callback:v=>v+'%'},grid:{color:gridColor}}
    };
  }
  return base;
}

function drawLineChart(monthlyData) {
  const ctx = document.getElementById('chart_monthly')?.getContext('2d');
  if (!ctx) return;
  if (activeCharts['monthly']) activeCharts['monthly'].destroy();
  activeCharts['monthly'] = new Chart(ctx, {
    type:'line',
    data: { labels: MONTHS, datasets: BRANCHES.map(b => ({ label: BRANCH_NAMES[b], data: monthlyData[b], borderColor: BRANCH_COLORS[b], backgroundColor: BRANCH_COLORS[b]+'20', borderWidth:2, tension:0.4, fill:true, pointBackgroundColor:BRANCH_COLORS[b], pointRadius:4, spanGaps:true })) },
    options: chartDefaults('y_pct')
  });
}

function drawRadarChart(monthlyData) {
  const ctx = document.getElementById('chart_radar')?.getContext('2d');
  if (!ctx) return;
  if (activeCharts['radar']) activeCharts['radar'].destroy();
  const sectionScores = BRANCHES.map(branch => CHECKLIST.map(sec => {
    let t=0,o=0;
    for(let m=0;m<12;m++) for(let d=1;d<=MONTH_DAYS[m];d++){const k=getKey(branch,m,d);if(!appData[k])continue;sec.items.forEach(item=>{const r=appData[k].results[item.id];if(r==='ok')o++;else if(r==='fail')t++;})}
    const total=o+t; return total>0?Math.round((o/total)*100):50;
  }));
  activeCharts['radar'] = new Chart(ctx, {
    type:'radar',
    data: { labels: CHECKLIST.map(s=>s.section.replace(/[\u{1F300}-\u{1F9FF}]/gu,'')), datasets: BRANCHES.map((b,i) => ({ label:BRANCH_NAMES[b], data:sectionScores[i], borderColor:BRANCH_COLORS[b], backgroundColor:BRANCH_COLORS[b]+'30', borderWidth:2, pointBackgroundColor:BRANCH_COLORS[b] })) },
    options: (() => {
      const isLight = document.body.classList.contains('light-mode');

      const radarGridColor  = isLight ? 'rgba(107,27,42,0.15)' : 'rgba(255,255,255,0.1)';
      return { ...chartDefaults(), scales:{r:{min:0,max:100,ticks:{display:false},grid:{color:radarGridColor},angleLines:{color:radarGridColor},pointLabels:{color:radarLabelColor,font:{family:'Tajawal',size:10,weight:'700'}}}} };
    })()
  });
}

function drawBarChart(monthlyData) {

      <div class="stat-card"><div class="stat-icon">☀️</div><div class="stat-value">${totalMorning}</div><div class="stat-label">زيارات صباحي (${morningPct}%)</div></div>
      <div class="stat-card"><div class="stat-icon">🌙</div><div class="stat-value">${totalEvening}</div><div class="stat-label">زيارات مسائي (${eveningPct}%)</div></div>

  ${totalTasks > 0 ? `

      <div class="stat-card"><div class="stat-icon">📌</div><div class="stat-value" style="color:var(--blue);">${totalTasks}</div><div class="stat-label">إجمالي المهام</div></div>

    </div>
    <button class="btn btn-primary btn-sm" style="margin-top:12px;" onclick="showPage('tasks')">📋 الذهاب إلى المهام</button>

// Save manager profile field (called from input/textarea oninput)
function saveManagerProfileField(name, field, value) {
  if (typeof canEditNow === 'function' && !canEditNow()) {
    if (typeof showNotif === 'function') showNotif('🔒 يلزم وضع التعديل', 'error');
    return;
  }
  const profiles = JSON.parse(localStorage.getItem('blaban_manager_profiles') || '{}');
  if (!profiles[name]) profiles[name] = {};
  profiles[name][field] = value;
  localStorage.setItem('blaban_manager_profiles', JSON.stringify(profiles));
}

// ============ CRITICAL ITEMS REPORT (across all branches) ============
function renderCriticalReport() {
  // Build a report of all CRITICAL items (built-in + user-marked) and their current state
  const allItems = CHECKLIST.flatMap(s => s.items.map(it => ({...it, section: s.section})));
  const builtInCritical = allItems.filter(it => it.critical);
  
  const findings = []; // {branch, month, day, item, result, isUserCritical, ...}
  
  BRANCHES.forEach(b => {
    Object.keys(appData).filter(k => k.startsWith(b+'_')).forEach(key => {
      const parts = key.split('_');
      const m = parseInt(parts[1]), d = parseInt(parts[2]);
      const visit = appData[key];
      if (!visit?.results) return;
      
      // Built-in critical items
      builtInCritical.forEach(item => {
        if (visit.results[item.id]) {
          findings.push({
            branch: b, branchName: BRANCH_NAMES[b], month: m, day: d,
            item, result: visit.results[item.id],
            isUserCritical: false, dateStr: `${d} ${MONTHS[m]}`,
            apStatus: visit.actionStatus?.[item.id]?.status || 'pending',
            manager: visit.manager || '-'
          });
        }
      });
      
      // User-marked critical items
      if (visit.userCritical) {
        Object.keys(visit.userCritical).filter(id => visit.userCritical[id] === true).forEach(id => {
          const item = allItems.find(i => i.id === id);
          if (item && visit.results[id] && !builtInCritical.find(b => b.id === id)) {
            findings.push({
              branch: b, branchName: BRANCH_NAMES[b], month: m, day: d,
              item, result: visit.results[id],
              isUserCritical: true, dateStr: `${d} ${MONTHS[m]}`,
              apStatus: visit.actionStatus?.[id]?.status || 'pending',
              manager: visit.manager || '-'
            });
          }
        });
      }
    });
  });
  
  // Sort: failed first, then by date
  findings.sort((a, b) => {
    if (a.result !== b.result) return a.result === 'fail' ? -1 : 1;
    return (b.month*31 + b.day) - (a.month*31 + a.day);
  });
  
  return findings;
}

// ============================================================
// EVALUATIONS LOG (per-branch) — opens as modal from branch view
// ============================================================
function openBranchEvalsLog(branch) {
  const branchName = (window.BRANCH_NAMES && window.BRANCH_NAMES[branch]) || branch;
  const evals = collectEvalsForBranch(branch);
  const today = new Date();
  
  let modal = document.getElementById('evalsLogModal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'evalsLogModal';
    modal.className = 'modal-overlay';
    modal.onclick = (e) => { if (e.target === modal) closeBranchEvalsLog(); };
    document.body.appendChild(modal);
  }
  
  // Store state
  modal._currentBranch = branch;
  modal._viewMonth = today.getMonth();
  modal._viewYear = today.getFullYear();
  modal._evals = evals;
  
  renderBranchEvalsLogContent();
  modal.classList.remove('hidden');
}

function renderBranchEvalsLogContent() {
  const modal = document.getElementById('evalsLogModal');
  if (!modal || !modal._currentBranch) return;
  
  const branch = modal._currentBranch;
  const branchName = (window.BRANCH_NAMES && window.BRANCH_NAMES[branch]) || branch;
  const viewYear = modal._viewYear;
  const viewMonth = modal._viewMonth;
  const evals = modal._evals || {};
  
  const monthNames = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const dayNames = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  
  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const today = new Date();
  const isCurrentMonth = viewYear === today.getFullYear() && viewMonth === today.getMonth();
  
  // Filter evals to this month
  const monthEvals = {};
  Object.entries(evals).forEach(([dayKey, data]) => {
    // dayKey format: "month_day" (e.g. "4_15" = May 15)
    const [m, d] = dayKey.split('_').map(Number);
    if (m === viewMonth) {
      monthEvals[d] = data;
    }
  });
  
  let html = `
    <div class="modal-box modal-box-large" style="max-width:760px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <h3 style="margin:0;color:var(--gold-light);">📋 سجل تقييمات فرع ${escapeHTML(branchName)}</h3>
        <button class="btn btn-icon" onclick="closeBranchEvalsLog()" style="font-size:22px;line-height:1;">×</button>
      </div>
      
      <!-- Month navigation -->
      <div class="calendar-header" style="margin-bottom:12px;">
        <h2 style="font-size:16px;">${monthNames[viewMonth]} ${viewYear}</h2>
        <div class="calendar-nav">
          <button onclick="changeBranchEvalsMonth(-1)">‹ السابق</button>
          <button onclick="changeBranchEvalsMonth(1)">التالي ›</button>
        </div>
      </div>
      
      <!-- Calendar grid -->
      <div class="calendar-grid">
        ${dayNames.map(d => `<div class="calendar-day-name">${d}</div>`).join('')}
        ${Array.from({length: firstDay}, () => '<div class="calendar-day empty"></div>').join('')}
        ${Array.from({length: daysInMonth}, (_, i) => {
          const day = i + 1;
          const dayData = monthEvals[day];
          const isToday = isCurrentMonth && day === today.getDate();
          const hasEvals = !!dayData;
          const score = dayData ? (dayData.score || 0) : 0;
          const manager = dayData ? (dayData.manager || '-') : '';
          
          return `
            <div class="calendar-day ${isToday ? 'today' : ''} ${hasEvals ? 'has-evals' : ''}"
                 onclick="${hasEvals ? `openBranchDateEval('${branch}', ${viewMonth}, ${day})` : ''}"
                 title="${hasEvals ? `تقييم: ${Math.round(score)}% • ${manager}` : 'لا يوجد تقييم'}">
              <div>${day}</div>
              ${hasEvals ? `<div class="calendar-day-count">${Math.round(score)}%</div>` : ''}
            </div>
          `;
        }).join('')}
      </div>
      
      <div class="calendar-legend">
        <div class="calendar-legend-item">
          <div class="calendar-legend-color" style="background:linear-gradient(135deg,#1ABC9C,#16A085);"></div>
          يوم به تقييم
        </div>
        <div class="calendar-legend-item">
          <div class="calendar-legend-color" style="background:transparent;border:2px solid var(--gold);"></div>
          اليوم الحالي
        </div>
        <div class="calendar-legend-item">📌 اضغط على أي يوم به تقييم لفتحه</div>
      </div>
  `;
  
  // List view for this month
  const sortedEvals = Object.entries(monthEvals)
    .sort((a, b) => parseInt(b[0]) - parseInt(a[0]));
  
  if (sortedEvals.length > 0) {
    html += `
      <div style="margin-top:18px;">
        <h4 style="color:var(--gold-light);margin-bottom:10px;font-size:15px;">📝 تفاصيل تقييمات ${monthNames[viewMonth]} (${sortedEvals.length})</h4>
        <div class="calendar-summary-list" style="max-height:280px;overflow-y:auto;">
          ${sortedEvals.map(([day, e]) => {
            const score = e.score || 0;
            const scoreClass = score >= 80 ? 'high' : score >= 60 ? 'mid' : 'low';
            return `
              <div class="calendar-summary-row" onclick="openBranchDateEval('${branch}', ${viewMonth}, ${day})">
                <div class="calendar-summary-date">${day} ${monthNames[viewMonth]}</div>
                <div class="calendar-summary-branch">👤 ${escapeHTML(e.manager || '-')} ${e.shift ? '• 🕐 ' + escapeHTML(e.shift) : ''}</div>
                <div class="calendar-summary-score ${scoreClass}">${Math.round(score)}%</div>
                <div style="text-align:center;color:var(--gold);font-weight:800;">↩ فتح</div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  } else {
    html += `
      <div style="margin-top:16px;padding:30px 20px;text-align:center;background:var(--bg-card);border-radius:12px;color:var(--text-muted);">
        <div style="font-size:36px;margin-bottom:8px;">📭</div>
        لا توجد تقييمات لفرع ${escapeHTML(branchName)} في ${monthNames[viewMonth]} ${viewYear}
      </div>
    `;
  }
  
  html += `
      <div style="margin-top:14px;text-align:center;">
        <button class="btn" onclick="closeBranchEvalsLog()">إغلاق</button>
      </div>
    </div>
  `;
  
  modal.innerHTML = html;
}

function collectEvalsForBranch(branch) {
  const result = {};
  try {
    if (typeof appData !== 'object' || !appData) return result;
    // appData keys are: "branch_month_day"
    Object.keys(appData).forEach(key => {
      const parts = key.split('_');
      if (parts.length < 3) return;
      const day = parseInt(parts[parts.length - 1]);
      const month = parseInt(parts[parts.length - 2]);
      const keyBranch = parts.slice(0, parts.length - 2).join('_');
      if (keyBranch !== branch) return;
      if (isNaN(month) || isNaN(day)) return;
      
      const visit = appData[key];
      if (!visit) return;
      
      // Only count days with actual evaluation activity
      const hasResults = visit.results && Object.keys(visit.results).length > 0;
      const hasManager = visit.manager || (visit.managers && visit.managers.length > 0);
      if (!hasResults && !hasManager) return;
      
      // Calculate score
      let score = 0;
      try {
        if (typeof calcSmartScore === 'function') {
          const s = calcSmartScore(branch, month, day);
          score = s.percent || 0;
        }
      } catch(e) {}
      
      const dayKey = month + '_' + day;
      result[dayKey] = {
        month, day,
        manager: (visit.managers && visit.managers.length) ? visit.managers.join('، ') : (visit.manager || '-'),
        shift: visit.shift || '',
        score: score,
        itemsCount: Object.keys(visit.results || {}).length
      };
    });
  } catch(e) { console.warn('[EvalsLog]', e); }
  return result;
}

function changeBranchEvalsMonth(delta) {
  const modal = document.getElementById('evalsLogModal');
  if (!modal) return;
  modal._viewMonth += delta;
  if (modal._viewMonth > 11) { modal._viewMonth = 0; modal._viewYear++; }
  if (modal._viewMonth < 0) { modal._viewMonth = 11; modal._viewYear--; }
  renderBranchEvalsLogContent();
}

function openBranchDateEval(branch, month, day) {
  // Close modal first
  closeBranchEvalsLog();
  
  // Set selected branch
  if (typeof selectedBranch !== 'undefined') {
    window.selectedBranch = branch;
    selectedBranch = branch;
    localStorage.setItem('blaban_selected_branch', branch);
  }
  
  // Show branch view
  if (typeof showPage === 'function') showPage('branch-view');
  
  // Render branch (creates date selectors)
  if (typeof renderBranch === 'function') renderBranch(branch);
  
  // Set the month/day selectors AFTER render
  setTimeout(() => {
    const monthSel = document.getElementById(branch + '_month');
    const daySel = document.getElementById(branch + '_day');
    if (monthSel) {
      monthSel.value = String(month);
      if (typeof onMonthChange === 'function') {
        try { onMonthChange(branch); } catch(e) {}
      }
    }
    setTimeout(() => {
      const daySel2 = document.getElementById(branch + '_day');
      if (daySel2) {
        daySel2.value = String(day);
        if (typeof onDayChange === 'function') {
          try { onDayChange(branch); } catch(e) {}
        }
      }
      // Re-render
      if (typeof renderBranch === 'function') renderBranch(branch);
      // Scroll to top
      window.scrollTo({ top: 0, behavior: 'smooth' });
      // Show confirmation
      if (typeof showNotif === 'function') {
        const MONTH_NAMES = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
        showNotif('✅ تم فتح تقييم ' + day + ' ' + MONTH_NAMES[month], 'success');
      }
    }, 100);
  }, 100);
}

function closeBranchEvalsLog() {
  const modal = document.getElementById('evalsLogModal');
  if (modal) modal.classList.add('hidden');
}

window.openBranchEvalsLog = openBranchEvalsLog;
window.closeBranchEvalsLog = closeBranchEvalsLog;
window.renderBranchEvalsLogContent = renderBranchEvalsLogContent;
window.changeBranchEvalsMonth = changeBranchEvalsMonth;
window.openBranchDateEval = openBranchDateEval;

function escapeHTML(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
window.escapeHTML = escapeHTML;

// ============================================================
// CHATBOT KNOWLEDGE BASE — gives chatbot full access to system data
// ============================================================
function buildChatbotKnowledgeContext() {
  try {
    const ctx = [];
    
    // System overview
    const branches = (typeof BRANCHES !== 'undefined') ? BRANCHES : [];
    const branchNames = (typeof BRANCH_NAMES !== 'undefined') ? BRANCH_NAMES : {};
    ctx.push('=== نظام إدارة تشغيل ب لبن قطر ===');
    ctx.push('مدير التشغيل: بلال الأنصاري');
    ctx.push('الفروع: ' + branches.map(b => branchNames[b] || b).join('، '));
    ctx.push('');
    
    // Recent evaluations summary
    ctx.push('=== التقييمات الأخيرة ===');
    const allEvals = [];
    if (typeof appData === 'object' && appData) {
      Object.keys(appData).forEach(key => {
        const parts = key.split('_');
        if (parts.length < 3) return;
        const day = parseInt(parts[parts.length - 1]);
        const month = parseInt(parts[parts.length - 2]);
        const branch = parts.slice(0, parts.length - 2).join('_');
        if (isNaN(month) || isNaN(day)) return;
        const visit = appData[key];
        if (!visit) return;
        const hasData = (visit.results && Object.keys(visit.results).length > 0) || visit.manager || (visit.managers && visit.managers.length);
        if (!hasData) return;
        let score = 0;
        try {
          if (typeof calcSmartScore === 'function') {
            const s = calcSmartScore(branch, month, day);
            score = s.percent || 0;
          }
        } catch(e) {}
        allEvals.push({
          branch: branchNames[branch] || branch,
          month, day,
          manager: (visit.managers && visit.managers.length) ? visit.managers.join('، ') : (visit.manager || '-'),
          shift: visit.shift || '',
          score: Math.round(score),
          failed: Object.entries(visit.results || {}).filter(([,v]) => v === 'fail').length,
          ok: Object.entries(visit.results || {}).filter(([,v]) => v === 'ok').length,
          totalItems: Object.keys(visit.results || {}).length
        });
      });
    }
    // Sort newest first
    allEvals.sort((a, b) => (b.month * 31 + b.day) - (a.month * 31 + a.day));
    
    const MONTH_NAMES = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    allEvals.slice(0, 15).forEach(e => {
      ctx.push('• ' + e.day + ' ' + MONTH_NAMES[e.month] + ' - فرع ' + e.branch + ': ' + e.score + '% (مطابق: ' + e.ok + '، غير مطابق: ' + e.failed + ') - المدير: ' + e.manager + (e.shift ? ' - شيفت ' + e.shift : ''));
    });
    if (allEvals.length > 15) ctx.push('  ... و ' + (allEvals.length - 15) + ' تقييم آخر');
    ctx.push('');
    
    // Pending tasks
    ctx.push('=== المهام ===');
    const tasks = (typeof tasksData !== 'undefined' && Array.isArray(tasksData)) ? tasksData : [];
    const pendingTasks = tasks.filter(t => !t.done && t.status !== 'completed');
    const completedTasks = tasks.filter(t => t.done || t.status === 'completed');
    ctx.push('إجمالي المهام: ' + tasks.length + ' (معلقة: ' + pendingTasks.length + '، منتهية: ' + completedTasks.length + ')');
    pendingTasks.slice(0, 10).forEach(t => {
      ctx.push('• [معلقة] ' + (t.title || t.task || '') + (t.branch ? ' - فرع ' + (branchNames[t.branch] || t.branch) : '') + (t.assignee ? ' - مكلف: ' + t.assignee : '') + (t.deadline || t.dueDate ? ' - ميعاد: ' + (t.deadline || t.dueDate) : ''));
    });
    ctx.push('');
    
    // Managers
    ctx.push('=== المديرون ===');
    try {
      const profiles = JSON.parse(localStorage.getItem('blaban_manager_profiles') || '{}');
      const names = Object.keys(profiles);
      ctx.push('عدد المديرين المسجلين: ' + names.length);
      names.slice(0, 10).forEach(n => {
        const p = profiles[n] || {};
        const meta = [];
        if (p.phone) meta.push('📱 ' + p.phone);
        if (p.branch) meta.push('🏪 ' + (branchNames[p.branch] || p.branch));
        if (p.role) meta.push('🎯 ' + p.role);
        ctx.push('• ' + n + (meta.length ? ' (' + meta.join('، ') + ')' : ''));
      });
    } catch(e) {}
    ctx.push('');
    
    // Branch averages
    ctx.push('=== متوسط أداء الفروع ===');
    branches.forEach(b => {
      const branchEvals = allEvals.filter(e => e.branch === (branchNames[b] || b));
      if (branchEvals.length === 0) {
        ctx.push('• فرع ' + (branchNames[b] || b) + ': لا توجد تقييمات بعد');
        return;
      }
      const avg = Math.round(branchEvals.reduce((sum, e) => sum + e.score, 0) / branchEvals.length);
      const recent = branchEvals[0];
      ctx.push('• فرع ' + (branchNames[b] || b) + ': متوسط ' + avg + '% (عدد التقييمات: ' + branchEvals.length + ') - آخر تقييم: ' + recent.score + '% بتاريخ ' + recent.day + ' ' + MONTH_NAMES[recent.month]);
    });
    
    return ctx.join('\n');
  } catch(e) {
    console.warn('[Chatbot Knowledge]', e);
    return '';
  }
}
window.buildChatbotKnowledgeContext = buildChatbotKnowledgeContext;

function showUpdateBanner() {
  if (sessionStorage.getItem('blaban_update_dismissed') === '1') return;
  const banner = document.getElementById('updateBanner');
  if (!banner) return;
  banner.style.display = 'flex';
  document.body.style.paddingTop = '52px';
  setTimeout(() => {
    if (banner.style.display !== 'none') dismissUpdateBanner();
  }, 30000);
}
function dismissUpdateBanner() {
  const banner = document.getElementById('updateBanner');
  if (banner) banner.style.display = 'none';
  document.body.style.paddingTop = '';
  sessionStorage.setItem('blaban_update_dismissed', '1');
}
window.showUpdateBanner = showUpdateBanner;
window.dismissUpdateBanner = dismissUpdateBanner;

// ============================================================
// APP BADGE (Badging API)
// ============================================================
function updateAppBadge() {
  try {
    if (!('setAppBadge' in navigator)) return;
    const tasks = (typeof tasksData !== 'undefined' && Array.isArray(tasksData)) ? tasksData : [];
    const pending = tasks.filter(t => !t.done && t.status !== 'completed').length;
    if (pending > 0) {
      navigator.setAppBadge(pending).catch(() => {});
    } else {
      if (navigator.clearAppBadge) navigator.clearAppBadge().catch(() => {});
    }
  } catch(e) {}
}
window.updateAppBadge = updateAppBadge;
setInterval(updateAppBadge, 60000);
