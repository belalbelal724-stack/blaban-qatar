<!-- =================================================================
     SUPABASE CRM INTEGRATION
     Adds cloud sync, realtime updates, and multi-user support
     ================================================================= -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ============================================================
// SUPABASE CLIENT INITIALIZATION
// ============================================================
const SUPABASE_URL = localStorage.getItem('blaban_supabase_url') || 'https://txnfhnhhjpvfbnsxywyf.supabase.co';
const SUPABASE_KEY = localStorage.getItem('blaban_supabase_key') || 'sb_publishable_olJU1eVZRgAnpALLqLQZKw_p5GEx_dC';

let supabaseClient = null;
let currentUser = null;
let realtimeChannels = [];
let syncEnabled = false;

function initSupabase() {
  if (!window.supabase) {
    console.warn('[Supabase] Library not loaded');
    return false;
  }
  try {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true },
      realtime: { params: { eventsPerSecond: 5 } }
    });
    window.supabaseClient = supabaseClient;
    console.log('[Supabase] Initialized');
    return true;
  } catch (err) {
    console.error('[Supabase] Init failed:', err);
    return false;
  }
}

// ============================================================
// AUTH
// ============================================================
async function supaSignUp(email, password, fullName) {
  if (!supabaseClient) return { error: 'Supabase not initialized' };
  const { data, error } = await supabaseClient.auth.signUp({
    email,
    password,
    options: { data: { full_name: fullName } }
  });
  if (!error) currentUser = data.user;
  return { data, error };
}

async function supaSignIn(email, password) {
  if (!supabaseClient) return { error: 'Supabase not initialized' };
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (!error) {
    currentUser = data.user;
    syncEnabled = true;
    await initialCloudSync();
    setupRealtimeSubscriptions();
    // Initialize broadcast alerts channel
    if (typeof initBroadcastChannel === 'function') initBroadcastChannel();
  }
  return { data, error };
}

async function supaSignOut() {
  if (!supabaseClient) return;
  cleanupRealtimeSubscriptions();
  await supabaseClient.auth.signOut();
  currentUser = null;
  syncEnabled = false;
}

async function checkAuth() {
  if (!supabaseClient) return null;
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (user) {
    currentUser = user;
    syncEnabled = true;
  }
  return user;
}

// ============================================================
// CLOUD STORAGE — Evaluations
// ============================================================
async function syncEvaluationToCloud(branch, date, visitData) {
  if (!syncEnabled || !currentUser) return { synced: false };
  try {
    const { error } = await supabaseClient
      .from('blaban_evaluations')
      .upsert({
        branch_id: branch,
        eval_date: date,
        managers: visitData.managers || [visitData.manager].filter(Boolean),
        results: visitData.results || {},
        notes: visitData.notes || {},
        photos: visitData.photos || {},
        action_status: visitData.actionStatus || {},
        user_critical: visitData.userCritical || {},
        score_percent: visitData.scorePercent || 0,
        created_by: currentUser.id,
        updated_at: new Date().toISOString()
      }, { onConflict: 'branch_id,eval_date' });
    if (error) {
      console.warn('[Cloud Sync] Eval failed:', error.message);
      return { synced: false, error };
    }
    return { synced: true };
  } catch (err) {
    return { synced: false, error: err };
  }
}

async function pullEvaluationsFromCloud(branch) {
  if (!syncEnabled) return [];
  try {
    let query = supabaseClient.from('blaban_evaluations').select('*');
    if (branch) query = query.eq('branch_id', branch);
    const { data, error } = await query;
    if (error) {
      console.warn('[Cloud Pull] Eval failed:', error.message);
      return [];
    }
    return data || [];
  } catch (err) {
    console.warn('[Cloud Pull] Exception:', err);
    return [];
  }
}

// ============================================================
// CLOUD STORAGE — Tasks (preserves all fields)
// ============================================================
async function syncTaskToCloud(task) {
  if (!syncEnabled || !currentUser) return { synced: false };
  if (!task || !task.id) return { synced: false, error: 'invalid task' };
  try {
    // Store full task as JSONB to preserve all fields (comments, desc, priority, etc.)
    const payload = {
      id: String(task.id),
      title: task.title || task.task || '',
      branch_id: task.branch || null,
      assignee: task.assignee || task.assignedTo || null,
      due_date: task.deadline || task.dueDate || null,
      done: task.status === 'completed' || task.done === true,
      done_by: task.completedBy || task.doneBy || null,
      done_at: task.completedAt || task.doneAt || null,
      photo_url: task.photo || null,
      // Store full task object as JSON for fields not in schema
      extra_data: {
        desc: task.desc || '',
        priority: task.priority || 'normal',
        status: task.status || 'pending',
        createdAt: task.createdAt || null,
        completedAt: task.completedAt || null,
        completedBy: task.completedBy || null,
        comments: task.comments || [],
        photos: task.photos || []
      },
      created_by: currentUser.id,
      updated_at: new Date().toISOString()
    };
    const { error } = await supabaseClient
      .from('blaban_tasks')
      .upsert(payload, { onConflict: 'id' });
    if (error) {
      console.warn('[Cloud Sync] Task failed:', error.message);
      // Fallback: try without extra_data if column doesn't exist
      if (error.message.includes('extra_data')) {
        delete payload.extra_data;
        const { error: err2 } = await supabaseClient
          .from('blaban_tasks')
          .upsert(payload, { onConflict: 'id' });
        if (err2) console.warn('[Cloud Sync] Task retry failed:', err2.message);
        return { synced: !err2 };
      }
    }
    return { synced: !error, error };
  } catch (err) {
    console.warn('[Cloud Sync] Task exception:', err);
    return { synced: false, error: err };
  }
}

async function pullTasksFromCloud() {
  if (!syncEnabled) return [];
  try {
    const { data, error } = await supabaseClient
      .from('blaban_tasks')
      .select('*')
      .order('created_at', { ascending: false });
    if (error) {
      console.warn('[Cloud Pull] Tasks failed:', error.message);
      return [];
    }
    return data || [];
  } catch (err) {
    console.warn('[Cloud Pull] Tasks exception:', err);
    return [];
  }
}

// Delete task from cloud (when deleted locally)
async function deleteTaskFromCloud(taskId) {
  if (!syncEnabled || !currentUser) return;
  try {
    await supabaseClient.from('blaban_tasks').delete().eq('id', String(taskId));
    console.log('[Cloud] Task deleted from cloud:', taskId);
  } catch(e) { console.warn('[Cloud] Delete task failed:', e); }
}
window.deleteTaskFromCloud = deleteTaskFromCloud;

// Map cloud task to local format (preserving all fields)
function mapCloudTaskToLocal(t) {
  const extra = t.extra_data || {};
  return {
    id: t.id,
    title: t.title || '',
    task: t.title || '',  // alias for compatibility
    desc: extra.desc || '',
    branch: t.branch_id || '',
    assignee: t.assignee || '',
    assignedTo: t.assignee || '',
    deadline: t.due_date || '',
    dueDate: t.due_date || '',
    priority: extra.priority || 'normal',
    status: extra.status || (t.done ? 'completed' : 'pending'),
    done: t.done === true,
    doneBy: t.done_by || '',
    completedBy: t.done_by || extra.completedBy || '',
    doneAt: t.done_at || '',
    completedAt: t.done_at || extra.completedAt || '',
    photo: t.photo_url || '',
    photos: extra.photos || [],
    comments: extra.comments || [],
    createdAt: extra.createdAt || t.created_at || '',
    _cloudUpdatedAt: t.updated_at
  };
}
window.mapCloudTaskToLocal = mapCloudTaskToLocal;

// ============================================================
// CLOUD STORAGE — Manager Profiles
// ============================================================
async function syncManagerProfileToCloud(name, profile) {
  if (!syncEnabled || !currentUser) return { synced: false };
  try {
    const { error } = await supabaseClient
      .from('blaban_managers')
      .upsert({
        name: name,
        phone: profile.phone || null,
        email: profile.email || null,
        joined_date: profile.joined || null,
        age: profile.age || null,
        notes: profile.notes || null,
        updated_at: new Date().toISOString()
      }, { onConflict: 'name' });
    return { synced: !error, error };
  } catch (err) {
    return { synced: false, error: err };
  }
}

async function pullManagersFromCloud() {
  if (!syncEnabled) return {};
  try {
    const { data, error } = await supabaseClient.from('blaban_managers').select('*');
    if (error) return {};
    const result = {};
    (data || []).forEach(m => {
      result[m.name] = {
        phone: m.phone, email: m.email, joined: m.joined_date,
        age: m.age, notes: m.notes
      };
    });
    return result;
  } catch (err) {
    return {};
  }
}

// ============================================================
// CLOUD STORAGE — Custom Items
// ============================================================
async function syncCustomItemsToCloud() {
  if (!syncEnabled || !currentUser) return;
  try {
    const customItems = JSON.parse(localStorage.getItem('blaban_custom_items') || '[]');
    const itemEdits = JSON.parse(localStorage.getItem('blaban_item_edits') || '{}');
    const itemDeletions = JSON.parse(localStorage.getItem('blaban_item_deletions') || '[]');
    
    await supabaseClient.from('blaban_settings').upsert({
      key: 'checklist_customizations',
      value: { customItems, itemEdits, itemDeletions },
      updated_by: currentUser.id,
      updated_at: new Date().toISOString()
    }, { onConflict: 'key' });
  } catch (err) {
    console.warn('[Cloud Sync] Custom items failed:', err);
  }
}

async function pullCustomItemsFromCloud() {
  if (!syncEnabled) return false;
  try {
    const { data, error } = await supabaseClient
      .from('blaban_settings')
      .select('value')
      .eq('key', 'checklist_customizations')
      .single();
    if (error || !data) return false;
    const v = data.value || {};
    if (v.customItems) localStorage.setItem('blaban_custom_items', JSON.stringify(v.customItems));
    if (v.itemEdits) localStorage.setItem('blaban_item_edits', JSON.stringify(v.itemEdits));
    if (v.itemDeletions) localStorage.setItem('blaban_item_deletions', JSON.stringify(v.itemDeletions));
    return true;
  } catch (err) {
    return false;
  }
}

// ============================================================
// INITIAL SYNC (after login) - SAFE: merges, doesn't overwrite
// ============================================================
async function initialCloudSync() {
  if (!syncEnabled) return;
  console.log('[Cloud] Starting initial sync...');
  
  try {
    // Pull custom items first (these are settings, safe to replace)
    await pullCustomItemsFromCloud();
    
    // Pull managers (merge: local + cloud)
    const cloudManagers = await pullManagersFromCloud();
    if (Object.keys(cloudManagers).length > 0) {
      const local = JSON.parse(localStorage.getItem('blaban_manager_profiles') || '{}');
      const merged = { ...local, ...cloudManagers };
      localStorage.setItem('blaban_manager_profiles', JSON.stringify(merged));
    }
    
    // === EVALUATIONS: Two-way merge ===
    // 1. Pull cloud evaluations
    const cloudEvals = await pullEvaluationsFromCloud();
    let localData;
    try { localData = JSON.parse(localStorage.getItem('blaban_data_v3') || '{}'); }
    catch(e) { localData = {}; }
    
    // Apply cloud → local (newer wins)
    cloudEvals.forEach(ev => {
      if (!localData[ev.branch_id]) localData[ev.branch_id] = {};
      const dateKey = ev.eval_date;
      const cloudTime = new Date(ev.updated_at).getTime();
      const localTime = localData[ev.branch_id][dateKey] 
        ? new Date(localData[ev.branch_id][dateKey].updatedAt || 0).getTime() 
        : 0;
      
      if (cloudTime > localTime) {
        // Cloud is newer, apply
        localData[ev.branch_id][dateKey] = {
          managers: ev.managers || [],
          manager: (ev.managers || [])[0] || '',
          results: ev.results || {},
          notes: ev.notes || {},
          photos: ev.photos || {},
          actionStatus: ev.action_status || {},
          userCritical: ev.user_critical || {},
          scorePercent: ev.score_percent || 0,
          updatedAt: ev.updated_at
        };
        console.log('[Cloud] Pulled newer eval:', ev.branch_id, dateKey);
      }
    });
    localStorage.setItem('blaban_data_v3', JSON.stringify(localData));
    
    // Push local-only evaluations to cloud (THROTTLED - max 5 per session, 200ms between)
    if (typeof appData !== 'undefined' && appData) {
      const cloudKeys = new Set(cloudEvals.map(e => `${e.branch_id}_${e.eval_date}`));
      const toPush = [];
      Object.keys(appData).forEach(branch => {
        const branchData = appData[branch];
        if (typeof branchData !== 'object') return;
        Object.keys(branchData).forEach(date => {
          const key = `${branch}_${date}`;
          if (!cloudKeys.has(key) && branchData[date]) {
            toPush.push({ branch, date });
          }
        });
      });
      
      // Throttle: max 5 evaluations, with delay between each
      const limited = toPush.slice(0, 5);
      console.log('[Cloud] Pushing', limited.length, 'local-only evals (of', toPush.length, 'total)');
      for (let i = 0; i < limited.length; i++) {
        const { branch, date } = limited[i];
        if (typeof autoSyncEvaluation === 'function') {
          setTimeout(() => autoSyncEvaluation(branch, date), i * 500);
        }
      }
    }
    
    // === TASKS: Two-way merge ===
    const cloudTasks = await pullTasksFromCloud();
    let localTasks = [];
    try { localTasks = JSON.parse(localStorage.getItem('blaban_tasks_v1') || '[]'); }
    catch(e) { localTasks = []; }
    
    const localTaskMap = new Map(localTasks.map(t => [String(t.id), t]));
    const cloudTaskMap = new Map(cloudTasks.map(t => [String(t.id), t]));
    const mergedTasks = [];
    const allIds = new Set([...localTaskMap.keys(), ...cloudTaskMap.keys()]);
    const tasksToPush = [];
    
    allIds.forEach(id => {
      const local = localTaskMap.get(id);
      const cloud = cloudTaskMap.get(id);
      
      if (local && cloud) {
        const cloudTime = new Date(cloud.updated_at).getTime();
        const localTime = local._cloudUpdatedAt ? new Date(local._cloudUpdatedAt).getTime() : 0;
        if (cloudTime > localTime) {
          mergedTasks.push(mapCloudTaskToLocal(cloud));
        } else {
          mergedTasks.push(local);
          tasksToPush.push(local);
        }
      } else if (local) {
        mergedTasks.push(local);
        tasksToPush.push(local);
      } else if (cloud) {
        // Only cloud — pull to local
        mergedTasks.push(mapCloudTaskToLocal(cloud));
      }
    });
    
    localStorage.setItem('blaban_tasks_v1', JSON.stringify(mergedTasks));
    // Update in-memory tasksData
    if (typeof tasksData !== 'undefined') {
      tasksData.length = 0;
      mergedTasks.forEach(t => tasksData.push(t));
    }
    console.log('[Cloud] Tasks merged:', mergedTasks.length, 'total');
    
    // Throttle pushing tasks to cloud (max 5, 500ms between - prevents browser overload)
    const tasksLimited = tasksToPush.slice(0, 5);
    console.log('[Cloud] Pushing', tasksLimited.length, 'local tasks (of', tasksToPush.length, 'total)');
    for (let i = 0; i < tasksLimited.length; i++) {
      const t = tasksLimited[i];
      if (typeof autoSyncTask === 'function') {
        setTimeout(() => autoSyncTask(t), i * 500);
      }
    }
    
    // Refresh UI
    if (typeof showPage === 'function' && typeof currentPage !== 'undefined') {
      try { showPage(currentPage); } catch(e) {}
    }
    if (typeof renderTasksPage === 'function') {
      try { renderTasksPage(); } catch(e) {}
    }
    
    console.log('[Cloud] Initial sync complete');
    if (typeof showNotif === 'function') showNotif('☁️ تمت المزامنة مع السحابة', 'success');
    
    // Check for pending alerts (sent in last 5 minutes) and show them
    try {
      const { data: alertSettings } = await supabaseClient
        .from('blaban_settings')
        .select('*')
        .like('key', 'last_alert_%')
        .order('updated_at', { ascending: false })
        .limit(5);
      
      if (alertSettings && alertSettings.length > 0) {
        const now = Date.now();
        const fiveMinAgo = now - 5 * 60 * 1000;
        const recentAlert = alertSettings.find(a => {
          const t = new Date(a.updated_at).getTime();
          return t > fiveMinAgo && a.value && a.value.from_id !== currentUser?.id;
        });
        if (recentAlert) {
          console.log('[Alert] Showing pending alert from cloud:', recentAlert.value);
          setTimeout(() => {
            try { showIncomingAlert(recentAlert.value); } catch(e) {}
          }, 1500);
        }
      }
    } catch(e) { console.warn('[Alert] Pending check failed:', e); }
  } catch (err) {
    console.error('[Cloud] Sync error:', err);
    if (typeof showNotif === 'function') showNotif('⚠️ خطأ في المزامنة: ' + err.message, 'error');
  }
}

// ============================================================
// REALTIME SUBSCRIPTIONS
// ============================================================
function setupRealtimeSubscriptions() {
  if (!syncEnabled || !supabaseClient) return;
  cleanupRealtimeSubscriptions();
  
  // Evaluations channel
  const evalChannel = supabaseClient
    .channel('blaban-evals')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'blaban_evaluations' }, (payload) => {
      console.log('[Realtime] Eval update:', payload.eventType);
      if (payload.new && payload.new.created_by !== currentUser?.id) {
        try {
          let localData = JSON.parse(localStorage.getItem('blaban_data_v3') || '{}');
          const ev = payload.new;
          if (!localData[ev.branch_id]) localData[ev.branch_id] = {};
          const evObj = {
            managers: ev.managers || [],
            manager: (ev.managers || [])[0] || '',
            results: ev.results || {},
            notes: ev.notes || {},
            photos: ev.photos || {},
            actionStatus: ev.action_status || {},
            userCritical: ev.user_critical || {},
            scorePercent: ev.score_percent || 0,
            updatedAt: ev.updated_at
          };
          localData[ev.branch_id][ev.eval_date] = evObj;
          localStorage.setItem('blaban_data_v3', JSON.stringify(localData));
          
          // Update in-memory appData object too (critical for live UI updates!)
          if (typeof appData !== 'undefined' && appData) {
            if (!appData[ev.branch_id]) appData[ev.branch_id] = {};
            appData[ev.branch_id][ev.eval_date] = evObj;
          }
          
          const branchName = (window.BRANCH_NAMES?.[ev.branch_id]) || ev.branch_id;
          if (typeof showNotif === 'function') {
            showNotif('🔄 تحديث مباشر: ' + branchName + ' (' + ev.eval_date + ')', 'info');
          }
          
          // OS notification (works in background)
          if (typeof showOSNotification === 'function') {
            showOSNotification({
              title: '📊 تقييم جديد — فرع ' + branchName,
              body: 'بتاريخ ' + ev.eval_date + ' — نسبة ' + Math.round(ev.score_percent || 0) + '%',
              icon: './icon-192.png',
              tag: 'eval-' + ev.branch_id + '-' + ev.eval_date,
              vibrate: [200]
            });
          }
          
          // Refresh current page + dashboard
          if (typeof currentPage !== 'undefined' && typeof showPage === 'function') {
            try { showPage(currentPage); } catch(e) {}
          }
          if (typeof renderDashboard === 'function') {
            try { renderDashboard(); } catch(e) {}
          }
          if (typeof renderBranch === 'function' && typeof selectedBranch !== 'undefined' && selectedBranch === ev.branch_id) {
            try { renderBranch(ev.branch_id); } catch(e) {}
          }
        } catch(e) { console.warn(e); }
      }
    })
    .subscribe();
  realtimeChannels.push(evalChannel);
  
  // Tasks channel - handles INSERT, UPDATE, DELETE
  const tasksChannel = supabaseClient
    .channel('blaban-tasks')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'blaban_tasks' }, (payload) => {
      console.log('[Realtime] Task event:', payload.eventType, payload.new?.id || payload.old?.id);
      try {
        let localTasks = JSON.parse(localStorage.getItem('blaban_tasks_v1') || '[]');
        
        if (payload.eventType === 'DELETE') {
          const deletedId = String(payload.old?.id);
          localTasks = localTasks.filter(t => String(t.id) !== deletedId);
          if (typeof showNotif === 'function') showNotif('🗑️ حُذفت مهمة', 'info');
        } else {
          // INSERT or UPDATE
          const cloudTask = payload.new;
          if (!cloudTask) return;
          
          // Don't echo our own update unless it's been more than 2 seconds
          if (cloudTask.created_by === currentUser?.id) {
            const cloudTime = new Date(cloudTask.updated_at).getTime();
            if (Date.now() - cloudTime < 2000) {
              console.log('[Realtime] Skipping own recent update');
              return;
            }
          }
          
          const mapped = mapCloudTaskToLocal(cloudTask);
          const idx = localTasks.findIndex(t => String(t.id) === String(mapped.id));
          const isNewTask = idx < 0;
          if (idx >= 0) {
            localTasks[idx] = mapped;
          } else {
            localTasks.unshift(mapped);
          }
          if (typeof showNotif === 'function') {
            const action = payload.eventType === 'INSERT' ? 'مهمة جديدة' : 'تحديث مهمة';
            showNotif('🔄 ' + action + ': ' + (mapped.title || ''), 'info');
          }
          // Send OS notification for new tasks (works even when app is closed)
          if (isNewTask && typeof showOSNotification === 'function') {
            showOSNotification({
              title: '📋 مهمة جديدة من مدير التشغيل',
              body: mapped.title + (mapped.branch ? ' — فرع ' + (window.BRANCH_NAMES?.[mapped.branch] || mapped.branch) : ''),
              icon: './icon-192.png',
              tag: 'task-' + mapped.id,
              vibrate: [200, 100, 200]
            });
          }
        }
        
        localStorage.setItem('blaban_tasks_v1', JSON.stringify(localTasks));
        // Update in-memory tasksData
        if (typeof tasksData !== 'undefined') {
          tasksData.length = 0;
          localTasks.forEach(t => tasksData.push(t));
        }
        
        // Refresh UI
        if (typeof renderTasksPage === 'function') {
          try { renderTasksPage(); } catch(e) {}
        }
        if (typeof renderDashboard === 'function') {
          try { renderDashboard(); } catch(e) {}
        }
        // Update tasks badge
        if (typeof updateTasksBadge === 'function') {
          try { updateTasksBadge(); } catch(e) {}
        }
      } catch(e) {
        console.warn('[Realtime] Task handler error:', e);
      }
    })
    .subscribe();
  realtimeChannels.push(tasksChannel);
  
  // Managers channel
  const managersChannel = supabaseClient
    .channel('blaban-managers')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'blaban_managers' }, () => {
      pullManagersFromCloud().then(managers => {
        const local = JSON.parse(localStorage.getItem('blaban_manager_profiles') || '{}');
        const merged = { ...local, ...managers };
        localStorage.setItem('blaban_manager_profiles', JSON.stringify(merged));
      });
    })
    .subscribe();
  realtimeChannels.push(managersChannel);
  
  // ============ PRESENCE CHANNEL (who's online now) ============
  setupPresenceChannel();
  
  // ============ CHAT CHANNEL (inter-user messaging) ============
  setupChatChannel();
  
  console.log('[Realtime] Subscribed to all channels (evals, tasks, managers, presence, chat)');
}

// ============ PRESENCE (who is online) ============
let presenceChannel = null;
window.onlineUsers = {}; // { user_id: { email, online_at } }

function setupPresenceChannel() {
  if (!supabaseClient || !currentUser) return;
  
  if (presenceChannel) {
    try { supabaseClient.removeChannel(presenceChannel); } catch(e) {}
  }
  
  presenceChannel = supabaseClient.channel('blaban-presence', {
    config: { presence: { key: currentUser.id } }
  });
  
  presenceChannel
    .on('presence', { event: 'sync' }, () => {
      try {
        const state = presenceChannel.presenceState();
        window.onlineUsers = {};
        Object.keys(state).forEach(userId => {
          const presences = state[userId];
          if (presences && presences.length > 0) {
            window.onlineUsers[userId] = presences[0];
          }
        });
        if (typeof updatePresenceUI === 'function') updatePresenceUI();
      } catch(e) { console.warn('[Presence] sync', e); }
    })
    .on('presence', { event: 'join' }, ({ key, newPresences }) => {
      console.log('[Presence] User joined:', key);
      const p = newPresences[0];
      if (p && p.email && p.user_id !== currentUser?.id) {
        if (typeof showNotif === 'function') {
          showNotif('🟢 ' + (p.email || 'مستخدم') + ' متصل الآن', 'info', 2500);
        }
      }
    })
    .on('presence', { event: 'leave' }, ({ key }) => {
      console.log('[Presence] User left:', key);
    })
    .subscribe(async (status) => {
      if (status === 'SUBSCRIBED') {
        await presenceChannel.track({
          user_id: currentUser.id,
          email: currentUser.email || 'مستخدم',
          online_at: new Date().toISOString()
        });
      }
    });
}

// ============ INTER-USER CHAT ============
let chatChannel = null;
window.chatMessages = []; // [{from_id, from_email, to_id|null, text, timestamp}]
const MAX_CHAT_MESSAGES = 100;

function setupChatChannel() {
  if (!supabaseClient || !currentUser) return;
  
  if (chatChannel) {
    try { supabaseClient.removeChannel(chatChannel); } catch(e) {}
  }
  
  chatChannel = supabaseClient.channel('blaban-chat', {
    config: { broadcast: { self: false, ack: true } }
  });
  
  chatChannel.on('broadcast', { event: 'chat_msg' }, (payload) => {
    try {
      const msg = payload.payload || payload;
      if (!msg || msg.from_id === currentUser?.id) return;
      
      // Filter: only show if it's broadcast (no to_id) OR addressed to me
      if (msg.to_id && msg.to_id !== currentUser?.id) return;
      
      // Add to local chat
      window.chatMessages.push(msg);
      if (window.chatMessages.length > MAX_CHAT_MESSAGES) {
        window.chatMessages = window.chatMessages.slice(-MAX_CHAT_MESSAGES);
      }
      
      // Save in localStorage so it persists
      try { localStorage.setItem('blaban_chat_messages', JSON.stringify(window.chatMessages.slice(-50))); } catch(e) {}
      
      // Notify
      if (typeof showNotif === 'function') {
        showNotif('💬 ' + (msg.from_email || 'مستخدم') + ': ' + (msg.text || '').substring(0, 50), 'info', 4000);
      }
      // OS notification
      if (typeof showOSNotification === 'function') {
        showOSNotification({
          title: '💬 رسالة من ' + (msg.from_email || 'مستخدم'),
          body: msg.text || '',
          icon: './icon-192.png',
          tag: 'chat-' + Date.now()
        });
      }
      
      // Update unread badge
      const myUnread = parseInt(localStorage.getItem('blaban_chat_unread') || '0') + 1;
      localStorage.setItem('blaban_chat_unread', String(myUnread));
      updateChatBadge();
      
      // Refresh chat panel if open
      if (typeof renderChatPanel === 'function' && document.getElementById('chatPanel') && !document.getElementById('chatPanel').classList.contains('hidden')) {
        renderChatPanel();
      }
    } catch(e) { console.warn('[Chat] handler', e); }
  });
  
  chatChannel.subscribe();
  
  // Load saved messages
  try {
    const saved = localStorage.getItem('blaban_chat_messages');
    if (saved) window.chatMessages = JSON.parse(saved);
  } catch(e) {}
  
  updateChatBadge();
}
window.setupChatChannel = setupChatChannel;

function sendChatMessage(text, toUserId, toEmail) {
  if (!text || !text.trim()) return;
  if (!chatChannel || !currentUser) {
    if (typeof showNotif === 'function') showNotif('⚠️ غير متصل بالسحابة', 'error');
    return;
  }
  
  const msg = {
    from_id: currentUser.id,
    from_email: currentUser.email || 'مدير التشغيل',
    to_id: toUserId || null,
    to_email: toEmail || null,
    text: text.trim(),
    timestamp: Date.now()
  };
  
  // Send broadcast
  chatChannel.send({
    type: 'broadcast',
    event: 'chat_msg',
    payload: msg
  }).catch(e => console.warn('[Chat] send failed:', e));
  
  // Add to local
  window.chatMessages.push(msg);
  try { localStorage.setItem('blaban_chat_messages', JSON.stringify(window.chatMessages.slice(-50))); } catch(e) {}
  
  // Refresh UI
  if (typeof renderChatPanel === 'function') renderChatPanel();
}
window.sendChatMessage = sendChatMessage;

  const fullName = (document.getElementById('cloudAuthFullName').value || '').trim();
  const msg = document.getElementById('cloudAuthMsg');
  
  if (!email || !password) {
    msg.innerHTML = '<span style="color:#E74C3C;">⚠️ أدخل البريد وكلمة المرور</span>';
    return;
  }
  if (password.length < 6) {
    msg.innerHTML = '<span style="color:#E74C3C;">⚠️ كلمة المرور أقل من 6 أحرف</span>';
    return;
  }
  
  msg.innerHTML = '<span style="color:#C9A84C;">⏳ جاري المعالجة...</span>';
  
  const result = mode === 'signup' 
    ? await supaSignUp(email, password, fullName)
    : await supaSignIn(email, password);
  
  if (result.error) {
    msg.innerHTML = '<span style="color:#E74C3C;">❌ ' + result.error.message + '</span>';
    return;
  }
  
  if (mode === 'signup') {
    msg.innerHTML = '<span style="color:#2ECC71;">✅ تم إنشاء الحساب! يمكنك الآن تسجيل الدخول</span>';
    setTimeout(() => switchCloudAuthTab('signin'), 1500);
  } else {
    msg.innerHTML = '<span style="color:#2ECC71;">✅ تم تسجيل الدخول! جاري المزامنة...</span>';
    setTimeout(() => {
      document.getElementById('cloudAuthModal').classList.add('hidden');
      updateCloudStatusIndicator();
    }, 1200);
  }
}

  document.getElementById('cloudAuthModal').classList.add('hidden');

async function sendBroadcastAlert() {
  const title = (document.getElementById('alertTitle')?.value || '').trim();
  const message = (document.getElementById('alertMessage')?.value || '').trim();
  const type = document.getElementById('alertType')?.value || 'urgent';
  const target = document.getElementById('alertTarget')?.value || 'all';
  
  if (!title) {
    alert('اكتب عنوان التنبيه أولاً');
    return;
  }
  
  if (!supabaseClient || !currentUser) {
    alert('غير متصل بالسحابة. سجّل دخول أولاً.');
    return;
  }
  
  // Get sender name
  let senderName = currentUser.email || 'مدير التشغيل';
  try {
    const { data } = await supabaseClient.from('blaban_profiles').select('full_name').eq('id', currentUser.id).maybeSingle();
    if (data?.full_name) senderName = data.full_name;
  } catch(e) {}
  
  const alertPayload = {
    type: 'broadcast_alert',
    alert_type: type,  // urgent | important | info
    title: title,
    message: message,
    target: target,    // 'all' or 'branch:xxx'
    from: senderName,
    from_id: currentUser.id,
    timestamp: new Date().toISOString()
  };
  
  try {
    if (!alertsChannel) alertsChannel = setupBroadcastChannel();
    
    // Send via Supabase Realtime broadcast (instant, no DB write)
    const status = await alertsChannel.send({
      type: 'broadcast',
      event: 'urgent_alert',
      payload: alertPayload
    });
    
    console.log('[Alert] Broadcast sent, status:', status);
    
    // Also save to DB so users who join later still see recent alerts
    try {
      await supabaseClient.from('blaban_settings').upsert({
        key: 'last_alert_' + Date.now(),
        value: alertPayload,
        updated_by: currentUser.id,
        updated_at: new Date().toISOString()
      });
    } catch(e) { console.warn('[Alert] DB save failed:', e); }
    
    document.getElementById('broadcastAlertModal').classList.add('hidden');
    if (typeof showNotif === 'function') showNotif('🚨 تم إرسال التنبيه لكل المستخدمين', 'success');
    
    // History log
    if (typeof addHistoryEntry === 'function') {
      addHistoryEntry({
        type: 'alert', action: 'send',
        target: title,
        details: 'تنبيه ' + type + ' إلى ' + (target === 'all' ? 'الكل' : target)
      });
    }
  } catch (err) {
    console.error('[Alert] Send failed:', err);
    alert('فشل الإرسال: ' + err.message);
  }
}

function setupBroadcastChannel() {
  if (!supabaseClient) return null;
  const channel = supabaseClient.channel('blaban-alerts', {
    config: { broadcast: { self: false, ack: true } }  // self: false means don't receive own broadcasts
  });
  
  channel.on('broadcast', { event: 'urgent_alert' }, (payload) => {
    console.log('[Alert] Received broadcast:', payload);
    const data = payload.payload || payload;
    
    // Skip if this alert is for a specific branch and user isn't in it
    if (data.target && data.target.startsWith('branch:')) {
      const targetBranch = data.target.substring(7);
      const myBranch = localStorage.getItem('blaban_my_branch') || '';
      if (myBranch && myBranch !== targetBranch) {
        console.log('[Alert] Skipping - not for my branch');
        return;
      }
    }
    
    // Skip if from self
    if (data.from_id === currentUser?.id) return;
    
    showIncomingAlert(data);
  });
  
  // ============ INSTANT DATA CHANGE BROADCAST ============
  // Same mechanism as urgent_alert, but for data updates
  // This is FASTER than postgres_changes (no DB round-trip needed)
  channel.on('broadcast', { event: 'data_change' }, (payload) => {
    try {
      const data = payload.payload || payload;
      if (!data || data.from_id === currentUser?.id) return; // skip own changes
      
      console.log('[InstantSync] Received:', data.kind, data.action);
      
      switch (data.kind) {
        case 'eval':
          applyRemoteEvalChange(data);
          break;
        case 'task':
          applyRemoteTaskChange(data);
          break;
        case 'task_delete':
          applyRemoteTaskDelete(data);
          break;
        case 'manager':
          applyRemoteManagerChange(data);
          break;
        case 'branch':
          applyRemoteBranchChange(data);
          break;
        case 'item':
          applyRemoteItemChange(data);
          break;
      }
    } catch(e) { console.warn('[InstantSync] Handler error:', e); }
  });
  
  channel.subscribe(status => {
    console.log('[Broadcast] Channel status:', status);
  });
  
  return channel;
}

// ============ BROADCAST DATA CHANGES (instant, <100ms) ============
function broadcastDataChange(kind, action, data) {
  try {
    if (!alertsChannel) {
      if (typeof supabaseClient !== 'undefined' && supabaseClient && currentUser) {
        alertsChannel = setupBroadcastChannel();
      }
      if (!alertsChannel) return;
    }
    if (!currentUser) return;
    
    alertsChannel.send({
      type: 'broadcast',
      event: 'data_change',
      payload: {
        kind: kind,        // 'eval' | 'task' | 'task_delete' | 'manager' | 'branch' | 'item'
        action: action,    // 'create' | 'update' | 'delete'
        data: data,
        from: currentUser.email || 'مستخدم',
        from_id: currentUser.id,
        timestamp: Date.now()
      }
    }).catch(e => console.warn('[Broadcast] send failed:', e));
  } catch(e) { console.warn('[Broadcast] error:', e); }
}
window.broadcastDataChange = broadcastDataChange;

// ============ APPLY REMOTE CHANGES (when received from broadcast) ============
function applyRemoteEvalChange(data) {
  try {
    const ev = data.data;
    if (!ev || !ev.branch || (ev.month == null) || (ev.day == null)) return;
    
    const key = ev.branch + '_' + ev.month + '_' + ev.day;
    if (typeof appData === 'undefined' || !appData) return;
    
    // Initialize if doesn't exist
    if (!appData[key]) {
      appData[key] = { results:{}, notes:{}, comments:{}, actionStatus:{}, images:{}, deptAssign:{}, reported24h:{}, manager:'', shift:'', managers:[] };
    }
    
    // ============ DEEP MERGE — never overwrite local fields silently ============
    const local = appData[key];
    const remote = ev.visit || {};
    
    // For scalar fields, take remote ONLY if remote has a non-empty value
    ['manager', 'shift'].forEach(f => {
      if (remote[f] && String(remote[f]).trim()) local[f] = remote[f];
    });
    if (Array.isArray(remote.managers) && remote.managers.length) {
      local.managers = remote.managers;
    }
    
    // For object fields, merge keys (remote keys override only individual entries)
    ['results', 'notes', 'images', 'reported24h', 'deptAssign', 'actionStatus'].forEach(f => {
      if (!local[f] || typeof local[f] !== 'object') local[f] = {};
      if (remote[f] && typeof remote[f] === 'object') {
        Object.keys(remote[f]).forEach(itemId => {
          // Only accept remote value if it has actual content (non-empty)
          const remoteVal = remote[f][itemId];
          if (remoteVal !== undefined && remoteVal !== null && remoteVal !== '') {
            local[f][itemId] = remoteVal;
          }
        });
      }
    });
    
    // Comments are arrays — concat unique by timestamp
    if (remote.comments && typeof remote.comments === 'object') {
      if (!local.comments) local.comments = {};
      Object.keys(remote.comments).forEach(itemId => {
        const remoteArr = Array.isArray(remote.comments[itemId]) ? remote.comments[itemId] : [];
        const localArr = Array.isArray(local.comments[itemId]) ? local.comments[itemId] : [];
        const merged = [...localArr];
        remoteArr.forEach(rc => {
          if (!merged.find(lc => lc.timestamp === rc.timestamp && lc.text === rc.text)) {
            merged.push(rc);
          }
        });
        local.comments[itemId] = merged;
      });
    }
    
    // Save merged data
    try { localStorage.setItem('blaban_data_v3', JSON.stringify(appData)); } catch(e) {}
    
    const branchName = (window.BRANCH_NAMES && window.BRANCH_NAMES[ev.branch]) || ev.branch;
    if (typeof showNotif === 'function') {
      showNotif('🔄 تحديث: ' + branchName, 'info', 2000);
    }
    
    if (typeof showOSNotification === 'function') {
      showOSNotification({
        title: '📊 تحديث تقييم',
        body: 'فرع ' + branchName + ' — ' + ev.day + '/' + (ev.month + 1),
        icon: './icon-192.png',
        tag: 'eval-' + key
      });
    }
    
    // Refresh UI — debounced to avoid render-storm if many updates arrive
    if (!window._remoteRefreshTimer) {
      window._remoteRefreshTimer = setTimeout(() => {
        window._remoteRefreshTimer = null;
        // Only re-render the relevant branch (NOT a full page swap that loses focus)
        try {
          if (typeof selectedBranch !== 'undefined' && selectedBranch === ev.branch) {
            // Re-render only the checklist (preserves dropdowns/inputs in branch header)
            if (typeof renderChecklist === 'function') renderChecklist(ev.branch);
            if (typeof updateScore === 'function') updateScore(ev.branch);
          }
        } catch(e) {}
      }, 400);
    }
  } catch(e) { console.warn('[InstantSync eval]', e); }
}

function applyRemoteTaskChange(data) {
  try {
    const task = data.data;
    if (!task || !task.id) return;
    
    if (typeof tasksData === 'undefined') return;
    
    const idx = tasksData.findIndex(t => String(t.id) === String(task.id));
    const isNew = idx < 0;
    if (idx >= 0) {
      tasksData[idx] = task;
    } else {
      tasksData.unshift(task);
    }
    
    try { localStorage.setItem('blaban_tasks_v1', JSON.stringify(tasksData)); } catch(e) {}
    
    if (typeof showNotif === 'function') {
      showNotif('🔄 ' + (isNew ? 'مهمة جديدة' : 'تحديث مهمة') + ': ' + (task.title || ''), 'info', 3000);
    }
    
    if (isNew && typeof showOSNotification === 'function') {
      showOSNotification({
        title: '📋 مهمة جديدة',
        body: task.title || 'مهمة جديدة',
        icon: './icon-192.png',
        tag: 'task-' + task.id,
        vibrate: [200, 100, 200]
      });
    }
    
    if (typeof renderTasksPage === 'function') {
      try { renderTasksPage(); } catch(e) {}
    }
    if (typeof updateTasksBadge === 'function') {
      try { updateTasksBadge(); } catch(e) {}
    }
    if (typeof updateAppBadge === 'function') updateAppBadge();
  } catch(e) { console.warn('[InstantSync task]', e); }
}

function applyRemoteTaskDelete(data) {
  try {
    const taskId = data.data?.id;
    if (!taskId || typeof tasksData === 'undefined') return;
    
    const before = tasksData.length;
    tasksData = tasksData.filter(t => String(t.id) !== String(taskId));
    if (tasksData.length < before) {
      try { localStorage.setItem('blaban_tasks_v1', JSON.stringify(tasksData)); } catch(e) {}
      if (typeof showNotif === 'function') showNotif('🗑️ حُذفت مهمة', 'info', 2500);
      if (typeof renderTasksPage === 'function') { try { renderTasksPage(); } catch(e) {} }
      if (typeof updateTasksBadge === 'function') { try { updateTasksBadge(); } catch(e) {} }
    }
  } catch(e) { console.warn('[InstantSync task_delete]', e); }
}

function applyRemoteManagerChange(data) {
  try {
    const mgr = data.data;
    if (!mgr || !mgr.name) return;
    
    const profiles = JSON.parse(localStorage.getItem('blaban_manager_profiles') || '{}');
    profiles[mgr.name] = mgr;
    localStorage.setItem('blaban_manager_profiles', JSON.stringify(profiles));
    
    if (typeof showNotif === 'function') showNotif('🔄 تحديث مدير: ' + mgr.name, 'info', 3000);
    
    if (typeof currentPage !== 'undefined' && currentPage === 'managers' && typeof renderManagersPage === 'function') {
      try { renderManagersPage(); } catch(e) {}
    }
  } catch(e) { console.warn('[InstantSync manager]', e); }
}

function applyRemoteBranchChange(data) {
  try {
    const action = data.action;
    const b = data.data;
    if (!b) return;
    
    if (action === 'create' || action === 'update') {
      const customBranches = JSON.parse(localStorage.getItem('blaban_custom_branches') || '[]');
      const customNames = JSON.parse(localStorage.getItem('blaban_custom_branch_names') || '{}');
      if (b.id && !customBranches.includes(b.id) && b.id !== 'nasr' && b.id !== 'farosiya' && b.id !== 'gharafa' && b.id !== 'wakra' && b.id !== 'khaisa') {
        customBranches.push(b.id);
      }
      if (b.id && b.name) customNames[b.id] = b.name;
      localStorage.setItem('blaban_custom_branches', JSON.stringify(customBranches));
      localStorage.setItem('blaban_custom_branch_names', JSON.stringify(customNames));
    } else if (action === 'delete') {
      let customBranches = JSON.parse(localStorage.getItem('blaban_custom_branches') || '[]');
      const customNames = JSON.parse(localStorage.getItem('blaban_custom_branch_names') || '{}');
      customBranches = customBranches.filter(x => x !== b.id);
      delete customNames[b.id];
      localStorage.setItem('blaban_custom_branches', JSON.stringify(customBranches));
      localStorage.setItem('blaban_custom_branch_names', JSON.stringify(customNames));
    }
    
    if (typeof reloadBranches === 'function') { try { reloadBranches(); } catch(e) {} }
    if (typeof showNotif === 'function') showNotif('🏪 تحديث الفروع', 'info', 2500);
  } catch(e) { console.warn('[InstantSync branch]', e); }
}

function applyRemoteItemChange(data) {
  try {
    if (typeof showNotif === 'function') showNotif('⚙️ تحديث في بنود التقييم', 'info', 2500);
    // Reload custom items if function exists
    if (typeof loadCustomItems === 'function') { try { loadCustomItems(); } catch(e) {} }
  } catch(e) { console.warn('[InstantSync item]', e); }
}

window.applyRemoteEvalChange = applyRemoteEvalChange;
window.applyRemoteTaskChange = applyRemoteTaskChange;
window.applyRemoteTaskDelete = applyRemoteTaskDelete;
window.applyRemoteManagerChange = applyRemoteManagerChange;
window.applyRemoteBranchChange = applyRemoteBranchChange;
window.applyRemoteItemChange = applyRemoteItemChange;

function showIncomingAlert(data) {
  // Remove any existing alert
  const existing = document.querySelector('.broadcast-alert-overlay');
  if (existing) existing.remove();
  
  const type = data.alert_type || 'urgent';
  const icons = { urgent: '🚨', important: '⚠️', info: 'ℹ️' };
  const colors = {
    urgent: 'linear-gradient(135deg, #E74C3C, #C0392B)',
    important: 'linear-gradient(135deg, #F39C12, #D35400)',
    info: 'linear-gradient(135deg, #3498DB, #2980B9)'
  };
  
  const overlay = document.createElement('div');
  overlay.className = 'broadcast-alert-overlay';
  overlay.style.background = colors[type] || colors.urgent;
  overlay.innerHTML = `
    <div class="alert-icon">${icons[type] || '🚨'}</div>
    <div style="font-size:20px;font-weight:900;margin-bottom:6px;">${escapeHTML(data.title || 'تنبيه')}</div>
    ${data.message ? `<div style="font-size:14px;font-weight:500;line-height:1.5;">${escapeHTML(data.message)}</div>` : ''}
    <div class="alert-from">📤 من: ${escapeHTML(data.from || 'النظام')}</div>
    <div class="alert-close-hint">انقر للإغلاق</div>
  `;
  document.body.appendChild(overlay);
  
  // Play LOUD alert sound for 5 seconds
  playAlertSound(type);
  
  // Strong vibration on mobile
  if (navigator.vibrate) {
    try {
      const pattern = type === 'urgent' 
        ? [500, 100, 500, 100, 500, 100, 500, 100, 500] // 5 seconds total
        : type === 'important' 
        ? [300, 100, 300, 100, 300] 
        : [200];
      navigator.vibrate(pattern);
    } catch(e) {}
  }
  
  // Auto-dismiss after 15 seconds
  const dismissTimer = setTimeout(() => overlay.remove(), 15000);
  overlay.addEventListener('click', () => {
    clearTimeout(dismissTimer);
    overlay.style.animation = 'fadeIn 0.3s reverse';
    setTimeout(() => overlay.remove(), 300);
  });
  
  // STRONG OS-level notification (rings via SW even when app is in background)
  showOSNotification({
    title: '🚨 ' + (data.title || 'تنبيه عاجل من مدير التشغيل'),
    body: data.message || 'من: ' + (data.from || 'مدير التشغيل'),
    icon: './icon-192.png',
    badge: './icon-192.png',
    tag: 'urgent-alert-' + Date.now(),
    requireInteraction: type === 'urgent', // stays until user clicks
    vibrate: type === 'urgent' ? [500,100,500,100,500,100,500] : [200,100,200],
    renotify: true,
    silent: false // ensure sound plays
  });
}

// Show OS notification (works when app is in background)
async function showOSNotification(options) {
  if (!('Notification' in window)) return;
  
  // Request permission if needed
  if (Notification.permission === 'default') {
    try {
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') return;
    } catch(e) { return; }
  }
  if (Notification.permission !== 'granted') return;
  
  try {
    // Use service worker notification (works when tab is closed)
    if ('serviceWorker' in navigator) {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg) {
        await reg.showNotification(options.title, {
          body: options.body,
          icon: options.icon || './icon-192.png',
          badge: options.badge || './icon-192.png',
          tag: options.tag || 'default',
          requireInteraction: options.requireInteraction || false,
          vibrate: options.vibrate || [200],
          renotify: options.renotify || false,
          dir: 'rtl',
          lang: 'ar',
          data: { url: window.location.href }
        });
        return;
      }
    }
    // Fallback: regular Notification API
    new Notification(options.title, {
      body: options.body,
      icon: options.icon,
      tag: options.tag,
      dir: 'rtl',
      lang: 'ar'
    });
  } catch(e) { console.warn('[Notif] Failed:', e); }
}
window.showOSNotification = showOSNotification;

// Loud, prolonged alert sound (5 seconds)
function playAlertSound(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    
    if (type === 'urgent') {
      // 5-second loud urgent siren — alternating high/low tones
      const totalDuration = 5; // seconds
      const cycleLen = 0.5; // each beep is 0.5s
      const cycles = Math.floor(totalDuration / cycleLen);
      
      for (let i = 0; i < cycles; i++) {
        const startTime = ctx.currentTime + (i * cycleLen);
        // Alternate frequencies for a siren effect
        const freq = (i % 2 === 0) ? 1200 : 800;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();
        
        osc.type = 'square'; // louder, sharper
        osc.frequency.value = freq;
        filter.type = 'lowpass';
        filter.frequency.value = 3000;
        
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.7, startTime + 0.02); // Loud!
        gain.gain.linearRampToValueAtTime(0.6, startTime + cycleLen - 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + cycleLen);
        
        osc.start(startTime);
        osc.stop(startTime + cycleLen);
      }
    } else if (type === 'important') {
      // 2-second medium alert
      const freqs = [800, 1000, 800, 1000];
      freqs.forEach((f, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = f;
        osc.connect(gain);
        gain.connect(ctx.destination);
        const start = ctx.currentTime + (i * 0.4);
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.5, start + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);
        osc.start(start);
        osc.stop(start + 0.35);
      });
    } else {
      // Single soft tone for info
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 600;
      osc.connect(gain);
      gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      osc.start();
      osc.stop(ctx.currentTime + 0.5);
    }
  } catch(e) { console.warn('[Alert] Sound failed:', e); }
}

function escapeHTML(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Initialize broadcast channel when user logs in
async function initBroadcastChannel() {
  if (!syncEnabled || !supabaseClient) return;
  if (alertsChannel) return; // already initialized
  
  alertsChannel = setupBroadcastChannel();
  
  // Request notification permission for alerts
  if ('Notification' in window && Notification.permission === 'default') {
    try { Notification.requestPermission(); } catch(e) {}
  }
}

window.openBroadcastAlert = openBroadcastAlert;
window.sendBroadcastAlert = sendBroadcastAlert;
window.showIncomingAlert = showIncomingAlert;
window.initBroadcastChannel = initBroadcastChannel;
