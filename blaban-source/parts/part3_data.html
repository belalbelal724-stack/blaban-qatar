// Load custom branches from localStorage (allows user to add new branches)
function loadBranches() {
  try {
    const customBranches = JSON.parse(localStorage.getItem('blaban_custom_branches') || '[]');
    const customNames = JSON.parse(localStorage.getItem('blaban_custom_branch_names') || '{}');
    return {
      list: [...DEFAULT_BRANCHES, ...customBranches.filter(b => !DEFAULT_BRANCHES.includes(b))],
      names: { ...DEFAULT_BRANCH_NAMES, ...customNames }
    };
  } catch(e) {
    return { list: [...DEFAULT_BRANCHES], names: { ...DEFAULT_BRANCH_NAMES } };
  }
}

let _branchData = loadBranches();
let BRANCHES = _branchData.list;
let BRANCH_NAMES = _branchData.names;

// Function to reload branches after add/delete
function reloadBranches() {
  _branchData = loadBranches();
  BRANCHES = _branchData.list;
  BRANCH_NAMES = _branchData.names;
  window.BRANCHES = BRANCHES;
  window.BRANCH_NAMES = BRANCH_NAMES;
}

window.reloadBranches = reloadBranches;

// ============ BRANCH MANAGEMENT API ============
function addCustomBranch(branchId, branchName) {
  if (!branchId || !branchName) {
    if (typeof showNotif === 'function') showNotif('❌ المعرّف والاسم مطلوبان', 'error');
    return false;
  }
  // Sanitize ID: lowercase, English letters/numbers only
  const cleanId = branchId.toLowerCase().replace(/[^a-z0-9_]/g, '_');
  if (!cleanId) {
    if (typeof showNotif === 'function') showNotif('❌ المعرّف يجب أن يحتوي على حروف إنجليزية', 'error');
    return false;
  }
  if (BRANCHES.includes(cleanId)) {
    if (typeof showNotif === 'function') showNotif('❌ هذا المعرّف موجود مسبقاً', 'error');
    return false;
  }
  try {
    const custom = JSON.parse(localStorage.getItem('blaban_custom_branches') || '[]');
    const names = JSON.parse(localStorage.getItem('blaban_custom_branch_names') || '{}');
    if (!custom.includes(cleanId)) custom.push(cleanId);
    names[cleanId] = branchName.trim();
    localStorage.setItem('blaban_custom_branches', JSON.stringify(custom));
    localStorage.setItem('blaban_custom_branch_names', JSON.stringify(names));
    reloadBranches();
    if (typeof showNotif === 'function') showNotif(`✅ تم إضافة فرع "${branchName}"`, 'success');
    return true;
  } catch(e) {
    console.error('Add branch failed:', e);
    return false;
  }
}

function deleteCustomBranch(branchId) {
  if (DEFAULT_BRANCHES.includes(branchId)) {
    if (typeof showNotif === 'function') showNotif('❌ لا يمكن حذف الفروع الافتراضية', 'error');
    return false;
  }
  try {
    const custom = JSON.parse(localStorage.getItem('blaban_custom_branches') || '[]');
    const names = JSON.parse(localStorage.getItem('blaban_custom_branch_names') || '{}');
    const idx = custom.indexOf(branchId);
    if (idx > -1) custom.splice(idx, 1);
    delete names[branchId];
    localStorage.setItem('blaban_custom_branches', JSON.stringify(custom));
    localStorage.setItem('blaban_custom_branch_names', JSON.stringify(names));
    // Optional: clean data
    try {
      const data = JSON.parse(localStorage.getItem('blaban_data_v3') || '{}');
      if (data[branchId]) {
        delete data[branchId];
        localStorage.setItem('blaban_data_v3', JSON.stringify(data));
      }
    } catch(e) {}
    reloadBranches();
    if (typeof showNotif === 'function') showNotif('🗑️ تم حذف الفرع', 'success');
    return true;
  } catch(e) {
    return false;
  }
}

function editCustomBranch(branchId, newName) {
  if (!newName || !newName.trim()) return false;
  try {
    if (DEFAULT_BRANCHES.includes(branchId)) {
      // Allow renaming default branches too
      const names = JSON.parse(localStorage.getItem('blaban_custom_branch_names') || '{}');
      names[branchId] = newName.trim();
      localStorage.setItem('blaban_custom_branch_names', JSON.stringify(names));
    } else {
      const names = JSON.parse(localStorage.getItem('blaban_custom_branch_names') || '{}');
      names[branchId] = newName.trim();
      localStorage.setItem('blaban_custom_branch_names', JSON.stringify(names));
    }
    reloadBranches();
    if (typeof showNotif === 'function') showNotif('✅ تم تعديل اسم الفرع', 'success');
    return true;
  } catch(e) {
    return false;
  }
}

window.addCustomBranch = addCustomBranch;

      el.className = 'branch-page';
      el.style.display = 'none';
      branchView.appendChild(el);
      console.log('[Branches] Created page for:', b);
    }
  });
}

// ===================== STORAGE =====================
let appData = {};
let tasksData = []; // [{id, title, desc, branch, priority, deadline, createdAt, status, completedAt, comments:[{author,role,text,timestamp,type}]}]

function initData() {
  try {
    const saved = localStorage.getItem('blaban_data_v3');
    if (saved) appData = JSON.parse(saved);
    else {
      const old = localStorage.getItem('blaban_data_v2');
      if (old) { appData = JSON.parse(old); saveData(); }
    }
  } catch(e) { appData = {}; }
  
  try {
    const tsk = localStorage.getItem('blaban_tasks_v1');
    if (tsk) tasksData = JSON.parse(tsk);
  } catch(e) { tasksData = []; }
}

// Lightweight cloud sync — fires immediately after each save (no debouncing)
// The autoSync* functions are smart: they only sync the specific record that changed
let _saveDataSyncTimer = null;
let _saveTasksSyncTimer = null;

function saveData() {
  try { localStorage.setItem('blaban_data_v3', JSON.stringify(appData)); }
  catch(e) { localStorage.removeItem('blaban_data_v2'); localStorage.setItem('blaban_data_v3', JSON.stringify(appData)); }
  // Push to firebase if connected
  if (typeof pushDataToFirebase === 'function') pushDataToFirebase();
  // Immediate Supabase sync — uploads ONLY the last-edited branch/date (lightweight)
  if (typeof window.syncEnabled === 'function' && window.syncEnabled()) {
    // Quick debounce 200ms to batch rapid clicks (e.g. fast checkbox toggling)
    if (_saveDataSyncTimer) clearTimeout(_saveDataSyncTimer);
    _saveDataSyncTimer = setTimeout(() => {
      try {
        const lastBranch = window._lastEditedBranch;
        const lastDate = window._lastEditedDate;
        if (lastBranch && lastDate && appData[lastBranch] && appData[lastBranch][lastDate]) {
          if (typeof autoSyncEvaluation === 'function') autoSyncEvaluation(lastBranch, lastDate);
        } else {
          // Fallback: sync today for all branches that have data today
          const today = new Date().toISOString().split('T')[0];
          Object.keys(appData || {}).forEach(branch => {
            if (appData[branch] && appData[branch][today]) {
              if (typeof autoSyncEvaluation === 'function') autoSyncEvaluation(branch, today);
            }
          });
        }
      } catch(e) { console.warn('[Supabase] auto-sync error:', e); }
    }, 200);
  }
}

function saveTasks() {
  try { localStorage.setItem('blaban_tasks_v1', JSON.stringify(tasksData)); }
  catch(e) { console.error('Tasks save failed', e); }
  if (typeof pushDataToFirebase === 'function') pushDataToFirebase();
  // Immediate Supabase task sync
  if (typeof window.syncEnabled === 'function' && window.syncEnabled()) {
    if (_saveTasksSyncTimer) clearTimeout(_saveTasksSyncTimer);
    _saveTasksSyncTimer = setTimeout(() => {
      try {
        const lastTaskId = window._lastEditedTaskId;
        if (lastTaskId) {
          const task = tasksData.find(t => String(t.id) === String(lastTaskId));
          if (task && typeof autoSyncTask === 'function') autoSyncTask(task);
        } else {
          // Fallback: sync only the 3 most recent tasks (avoid spamming)
          const recent = (tasksData || []).slice(0, 3);
          recent.forEach(t => {
            if (typeof autoSyncTask === 'function') autoSyncTask(t);
          });
        }
      } catch(e) { console.warn('[Supabase] task sync error:', e); }
    }, 200);
  }
}

function getKey(branch, month, day) { return `${branch}_${month}_${day}`; }

function getVisitData(branch, month, day) {
  const key = getKey(branch, month, day);
  if (!appData[key]) appData[key] = { manager:'', shift:'', results:{}, deptAssign:{}, notes:{}, images:{}, reported24h:{}, comments:{}, actionStatus:{} };
  if (!appData[key].reported24h) appData[key].reported24h = {};
  if (!appData[key].comments) appData[key].comments = {};
  if (!appData[key].actionStatus) appData[key].actionStatus = {};
  return appData[key];
}

// ===================== SMART SCORING =====================
function calcSmartScore(branch, month, day) {
  const visit = getVisitData(branch, month, day);
  const allItems = CHECKLIST.flatMap(s => s.items);
  let ok = 0, excused = 0, deducted = 0;
  const excusedItems = [], deductedItems = [];
  allItems.forEach(item => {
    const result = visit.results[item.id];
    if (result === 'ok') { ok++; return; }
    if (result === 'fail') {
      const dept = visit.deptAssign[item.id] || 'الفرع';
      if (dept === 'الفرع') { deducted++; deductedItems.push({ item, dept }); }
      else if (visit.reported24h[item.id] === true) { excused++; excusedItems.push({ item, dept }); }
      else { deducted++; deductedItems.push({ item, dept }); }
    }
  });
  const answered = ok + excused + deducted;
  const pct = answered > 0 ? Math.round(((ok + excused) / answered) * 100) : null;
  return { pct, ok, excused, deducted, answered, excusedItems, deductedItems };
}

    else if (tabRole === role) tab.style.display = '';
    else tab.style.display = 'none';
  });

  // Branch selector is now integrated in nav-tabs; this bar is hidden permanently
  const bsBar = document.getElementById('branchSelectorBar');
  if (bsBar) bsBar.style.display = 'none';
  
  // Ensure a DOM container exists for each branch (creates pages for custom branches)
  ensureBranchPages();
  
  const bsSelect = document.getElementById('branchSelector');
  if (bsSelect) {
    bsSelect.disabled = false;
    // Populate options dynamically from BRANCHES (including custom + Khaisa)
    bsSelect.innerHTML = BRANCHES.map(b => 
      `<option value="${b}">${BRANCH_NAMES[b]}</option>`
    ).join('');
    // Default to nasr or first available
    if (!BRANCHES.includes(selectedBranch)) {
      selectedBranch = BRANCHES[0] || 'nasr';
      localStorage.setItem('blaban_selected_branch', selectedBranch);
    }
    bsSelect.value = selectedBranch;
  }
  // Apply selected branch view
  document.querySelectorAll('.branch-page').forEach(p => p.style.display = 'none');
  const targetEl = document.getElementById(`branch-${selectedBranch}`);
  if (targetEl) targetEl.style.display = 'block';
  
  // If current page is hidden, switch to first available
  const activeTab = document.querySelector('.nav-tab.active');
  if (activeTab && activeTab.style.display === 'none') {
    showPage('branch-view');
  }
  
  // Hide legacy lock button (replaced by editModeBtn in header)
  const lockBtn = document.getElementById('lockBtn');
  if (lockBtn) lockBtn.style.display = 'none';
  
  // Hide legacy preview banner (replaced by editModeBanner)
  const previewBanner = document.getElementById('opsPreviewBanner');
  if (previewBanner) previewBanner.style.display = 'none';
  
  localStorage.setItem('blaban_role', role);
  updateTasksBadge();
  // Re-render currently visible branch (action plan looks different per role/edit mode)
  if (typeof selectedBranch !== 'undefined' && typeof renderBranch === 'function') {
    try { renderBranch(selectedBranch); } catch(e) {}
  }
}

let notifTimer = null;
function showNotif(msg, type = 'info') {
  const n = document.getElementById('notif');
  n.textContent = msg;
  const colors = { success:'#1a5c2e', error:'#5c1a1a', info:'#1a2a5c', warning:'#5c3a1a' };

// ============ Header Digital Clock ============
function updateHeaderClock() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const ss = String(now.getSeconds()).padStart(2, '0');
  const timeEl = document.getElementById('headerClockTime');
  const dateEl = document.getElementById('headerClockDate');
  if (timeEl) timeEl.textContent = `${hh}:${mm}:${ss}`;
  if (dateEl) {
    const days = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
    const months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    dateEl.textContent = `${days[now.getDay()]} ${now.getDate()} ${months[now.getMonth()]}`;
  }
}
// Start clock when DOM ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => {
    updateHeaderClock();
    setInterval(updateHeaderClock, 1000);
  });
} else {
  updateHeaderClock();
  setInterval(updateHeaderClock, 1000);
}

// Updated thresholds: 90+ ممتاز / 70-89 جيد / 60-69 متوسط / <60 ضعيف
function scoreRating(pct) {
  if (pct >= 90) return { label: 'ممتاز', cls: 'high', color: 'var(--green)', emoji: '🌟' };
  if (pct >= 70) return { label: 'جيد', cls: 'mid', color: 'var(--blue)', emoji: '👍' };
  if (pct >= 60) return { label: 'متوسط', cls: 'mid', color: 'var(--orange)', emoji: '⚠️' };
  return { label: 'ضعيف', cls: 'low', color: 'var(--red)', emoji: '🔴' };
}
function scoreColor(pct) { return scoreRating(pct).color; }
function scoreLabel(pct) { return scoreRating(pct).label; }
window.scoreRating = scoreRating;
window.scoreColor = scoreColor;
window.scoreLabel = scoreLabel;

// ============ CUSTOM ITEMS + ITEM EDITS + DELETIONS ============
// Apply user customizations to the CHECKLIST (in-place since CHECKLIST array is mutable)
function applyChecklistCustomizations() {
  try {
    const custom = JSON.parse(localStorage.getItem('blaban_custom_items') || '[]');
    const edits = JSON.parse(localStorage.getItem('blaban_item_edits') || '{}');
    const deletions = JSON.parse(localStorage.getItem('blaban_item_deletions') || '[]');
    
    // Apply edits to built-in items, and remove deleted
    CHECKLIST.forEach(section => {
      section.items = section.items.filter(it => !deletions.includes(it.id));
      section.items.forEach(it => {
        const edit = edits[it.id];
        if (edit) {
          if (edit.text !== undefined) it.text = edit.text;
          if (edit.icon !== undefined) it.icon = edit.icon;
          if (edit.critical !== undefined) it.critical = edit.critical;
        }
      });
    });
    
    // Inject custom items into their sections
    custom.forEach(item => {
      let section = CHECKLIST.find(s => s.section === item.section);
      if (!section) {
        section = { section: item.section, items: [] };
        CHECKLIST.push(section);
      }
      if (!section.items.find(i => i.id === item.id)) {
        section.items.push(item);
      }
    });
  } catch(e) {
    console.warn('Customizations apply error:', e);
  }
}
applyChecklistCustomizations();

// Add a custom item
function addCustomItem(section, text, icon, critical) {
  const custom = JSON.parse(localStorage.getItem('blaban_custom_items') || '[]');
  const id = 'cust_' + Date.now();
  const item = { id, section, text, icon: icon || '📌', critical: !!critical, custom: true };
  custom.push(item);
  localStorage.setItem('blaban_custom_items', JSON.stringify(custom));
  let sec = CHECKLIST.find(s => s.section === section);
  if (!sec) { sec = { section, items: [] }; CHECKLIST.push(sec); }
  sec.items.push(item);
  if (typeof addHistoryEntry === 'function') {
    addHistoryEntry({ type:'system', action:'create', target:`بند جديد: ${text}`, details:`القسم: ${section}` });
  }
  return id;
}

// Edit an item (built-in or custom)
function editChecklistItem(id, newText, newIcon, newCritical) {
  const custom = JSON.parse(localStorage.getItem('blaban_custom_items') || '[]');
  const customItem = custom.find(c => c.id === id);
  if (customItem) {
    if (newText !== undefined) customItem.text = newText;
    if (newIcon !== undefined) customItem.icon = newIcon;
    if (newCritical !== undefined) customItem.critical = newCritical;
    localStorage.setItem('blaban_custom_items', JSON.stringify(custom));
  } else {
    const edits = JSON.parse(localStorage.getItem('blaban_item_edits') || '{}');
    if (!edits[id]) edits[id] = {};
    if (newText !== undefined) edits[id].text = newText;
    if (newIcon !== undefined) edits[id].icon = newIcon;
    if (newCritical !== undefined) edits[id].critical = newCritical;
    localStorage.setItem('blaban_item_edits', JSON.stringify(edits));
  }
  CHECKLIST.forEach(s => s.items.forEach(it => {
    if (it.id === id) {
      if (newText !== undefined) it.text = newText;
      if (newIcon !== undefined) it.icon = newIcon;
      if (newCritical !== undefined) it.critical = newCritical;
    }
  }));
}

// Delete a checklist item
function deleteChecklistItem(id) {
  const custom = JSON.parse(localStorage.getItem('blaban_custom_items') || '[]');
  const idx = custom.findIndex(c => c.id === id);
  if (idx >= 0) {
    custom.splice(idx, 1);
    localStorage.setItem('blaban_custom_items', JSON.stringify(custom));
  } else {
    const deletions = JSON.parse(localStorage.getItem('blaban_item_deletions') || '[]');
    if (!deletions.includes(id)) {
      deletions.push(id);
      localStorage.setItem('blaban_item_deletions', JSON.stringify(deletions));
    }
  }
  CHECKLIST.forEach(s => {
    const i = s.items.findIndex(it => it.id === id);
    if (i >= 0) s.items.splice(i, 1);
  });
}

window.addCustomItem = addCustomItem;
window.editChecklistItem = editChecklistItem;
window.deleteChecklistItem = deleteChecklistItem;
function openLogoUpload() {
  const input = document.getElementById('logoFileInput');
  if (input) input.click();
}

async function handleLogoUpload(input) {
  if (!input?.files?.[0]) return;
  const file = input.files[0];
  if (!file.type.startsWith('image/')) {
    if (typeof showNotif === 'function') showNotif('⚠️ اختر ملف صورة', 'error');
    return;
  }
  
  try {
    // Resize logo to max 300px for storage efficiency
    const dataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const maxSize = 300;
          const ratio = Math.max(img.width, img.height) > maxSize ? maxSize / Math.max(img.width, img.height) : 1;
          const w = Math.round(img.width * ratio);
          const h = Math.round(img.height * ratio);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/png', 0.92));
        };
        img.onerror = () => reject(new Error('Invalid image'));
        img.src = e.target.result;
      };
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(file);
    });
    
    localStorage.setItem('blaban_brand_logo', dataUrl);
    applyBrandLogo(dataUrl);
    if (typeof showNotif === 'function') showNotif('✅ تم تحديث الشعار', 'success');
  } catch(err) {
    console.error('Logo upload error:', err);
    if (typeof showNotif === 'function') showNotif('❌ خطأ: ' + err.message, 'error');
  }
  input.value = '';
}

function applyBrandLogo(dataUrl) {
  const img = document.getElementById('brandLogo');
  const placeholder = document.getElementById('logoPlaceholder');
  if (dataUrl && img) {
    img.src = dataUrl;
    img.style.display = 'block';
    if (placeholder) placeholder.style.display = 'none';
  }
}

function removeBrandLogo() {
  if (!confirm('حذف الشعار المخصص؟')) return;
  localStorage.removeItem('blaban_brand_logo');
  const img = document.getElementById('brandLogo');
  const placeholder = document.getElementById('logoPlaceholder');
  if (img) { img.src = ''; img.style.display = 'none'; }
  if (placeholder) placeholder.style.display = 'flex';
  if (typeof showNotif === 'function') showNotif('🗑️ تم حذف الشعار', 'info');
}

function toggleMode() {
  isDark = !isDark;
  document.body.classList.toggle('light-mode', !isDark);
  document.getElementById('modeToggle').textContent = isDark ? '🌙 داكن' : '☀️ فاتح';
  localStorage.setItem('blaban_mode', isDark ? 'dark' : 'light');
  // Re-render currently visible page to refresh chart colors
  const activePage = document.querySelector('.page.active');
  if (activePage) {
    const id = activePage.id;
    const renders = {
      'dashboard': typeof renderDashboardPage === 'function' ? renderDashboardPage : null,
      'analytics': typeof renderAnalyticsPage === 'function' ? renderAnalyticsPage : null,
      'managers': typeof renderManagersPage === 'function' ? renderManagersPage : null,
      'recommendations': typeof renderRecommendationsPage === 'function' ? renderRecommendationsPage : null,
      'ops-manager': typeof renderOpsPage === 'function' ? renderOpsPage : null,
      'other-depts': typeof renderDeptsPage === 'function' ? renderDeptsPage : null
    };
    if (renders[id]) {
      try { renders[id](); } catch(e) { console.warn(e); }
    }
  }
}

function showPage(pageId) {
  // All pages are now readable by everyone (read-only by default).
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  const page = document.getElementById(pageId);
  if (page) {
    page.classList.add('active');
    const renders = {
      'dashboard': renderDashboardPage,
      'tasks': renderTasksPage,
      'managers': renderManagersPage,
      'analytics': renderAnalyticsPage,
      'recommendations': renderRecommendationsPage,
      'ops-manager': renderOpsPage,
      'other-depts': renderDeptsPage
    };
    if (renders[pageId]) renders[pageId]();
    // Special handling: branch-view must re-render the currently selected branch
    if (pageId === 'branch-view' && typeof renderBranch === 'function') {
      renderBranch(selectedBranch);
    }
    // Inject page signature at the bottom (Diwani, subtle glow)
    setTimeout(() => addPageSignature(page), 50);
  }
  document.querySelectorAll('.nav-tab').forEach(t => { if (t.getAttribute('data-page') === pageId) t.classList.add('active'); });
  const activeTab = document.querySelector(`.nav-tab[data-page="${pageId}"]`);
  if (activeTab) activeTab.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
}

// Add or refresh the diwani signature at the bottom of a page
function addPageSignature(pageEl) {
  if (!pageEl) return;
  // Remove existing signature if present
  pageEl.querySelectorAll('.page-signature').forEach(s => s.remove());
  // Create new signature
  const sig = document.createElement('div');
  sig.className = 'page-signature';
  sig.textContent = 'بِلَال الأَنْصَارِي';
  pageEl.appendChild(sig);
}
