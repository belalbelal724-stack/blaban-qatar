<script>
// ===================================================================
// PART 11: Authentication System (Password + Biometric WebAuthn)
// ===================================================================

// ============ AUTH STATE ============
// Stored in localStorage:
// - blaban_auth_pwd_hash: SHA-256 hash of ops password
// - blaban_auth_pwd_salt: random salt
// - blaban_auth_webauthn_id: WebAuthn credential ID (if registered)
// - blaban_auth_session: { until: timestamp } — session expiry (15 min idle)
// - blaban_auth_initialized: flag

const AUTH_SESSION_DURATION = 15 * 60 * 1000; // 15 minutes
let authSession = null;
try {
  authSession = JSON.parse(localStorage.getItem('blaban_auth_session') || 'null');
} catch(e) { authSession = null; }

// ============ Utilities ============
// SHA-256 hash with fallback for non-secure contexts (file://, http://)
async function sha256Hash(text) {
  // Try Web Crypto first (works on HTTPS and localhost)
  try {
    if (typeof crypto !== 'undefined' && crypto.subtle && typeof crypto.subtle.digest === 'function') {
      const enc = new TextEncoder();
      const buf = await crypto.subtle.digest('SHA-256', enc.encode(text));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }
  } catch(e) {
    console.warn('[Auth] crypto.subtle failed, using fallback:', e.message);
  }
  // Fallback: pure JS SHA-256 (slower but works everywhere including file://)
  return sha256Fallback(text);
}

// Pure JavaScript SHA-256 implementation (works in any context)
function sha256Fallback(ascii) {
  function rightRotate(value, amount) {
    return (value >>> amount) | (value << (32 - amount));
  }
  const maxWord = Math.pow(2, 32);
  const result = [];
  const words = [];
  const asciiBitLength = ascii.length * 8;
  // Initialize hash values
  let hash = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
  const k = [0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
  // Convert to UTF-8 bytes
  const utf8 = unescape(encodeURIComponent(ascii));
  ascii = utf8;
  // Pre-processing
  ascii += '\x80';
  while (ascii.length % 64 - 56) ascii += '\x00';
  for (let i = 0; i < ascii.length; i++) {
    const j = ascii.charCodeAt(i);
    if (j >> 8) return ''; // Should not happen
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words.length] = ((utf8.length * 8) / Math.pow(2, 32)) | 0;
  words[words.length] = (utf8.length * 8);
  // Process blocks
  for (let j = 0; j < words.length;) {
    const w = words.slice(j, j += 16);
    const oldHash = hash.slice(0);
    for (let i = 0; i < 64; i++) {
      const w15 = w[i - 15], w2 = w[i - 2];
      const a = hash[0], e = hash[4];
      const temp1 = hash[7] +
        (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) +
        ((e & hash[5]) ^ ((~e) & hash[6])) +
        k[i] +
        (w[i] = (i < 16) ? w[i] : (
          w[i - 16] +
          (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3)) +
          w[i - 7] +
          (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
        ) | 0);
      const temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) +
        ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(temp1 + temp2) | 0].concat(hash);
      hash[4] = (hash[4] + temp1) | 0;
    }
    for (let i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
  }
  for (let i = 0; i < 8; i++) {
    for (let j = 3; j + 1; j--) {
      const b = (hash[i] >> (j * 8)) & 255;
      result.push(((b < 16) ? '0' : '') + b.toString(16));
    }
  }
  return result.join('');
}

function generateSalt() {
  const arr = new Uint8Array(16);
  try {
    if (typeof crypto !== 'undefined' && crypto.getRandomValues) {
      crypto.getRandomValues(arr);
    } else {
      // Fallback: use Math.random (less secure but functional)
      for (let i = 0; i < arr.length; i++) arr[i] = Math.floor(Math.random() * 256);
    }
  } catch(e) {
    for (let i = 0; i < arr.length; i++) arr[i] = Math.floor(Math.random() * 256);
  }
  return Array.from(arr).map(b => b.toString(16).padStart(2,'0')).join('');
}

function isAuthInitialized() {
  return localStorage.getItem('blaban_auth_initialized') === '1' &&
         localStorage.getItem('blaban_auth_pwd_hash');
}

function isOpsSessionValid() {
  if (!authSession) return false;
  if (Date.now() > authSession.until) {
    authSession = null;
    localStorage.removeItem('blaban_auth_session');
    return false;
  }
  return true;
}

function startOpsSession() {
  authSession = { until: Date.now() + AUTH_SESSION_DURATION };
  localStorage.setItem('blaban_auth_session', JSON.stringify(authSession));
  // Switch role to ops (so user has full access)
  if (typeof _originalSetRole === 'function') {
    try { _originalSetRole('ops'); } catch(e) { console.warn('Set role failed:', e); }
  } else if (typeof setRole === 'function') {
    try { setRole('ops'); } catch(e) {}
  }
  // Schedule auto-lock
  scheduleAutoLock();
  // Refresh edit mode button
  if (typeof refreshEditModeButton === 'function') {
    try { refreshEditModeButton(); } catch(e) {}
  }
  console.log('[Auth] Ops session started, valid until:', new Date(authSession.until).toLocaleString('ar'));
}

function endOpsSession() {
  authSession = null;
  localStorage.removeItem('blaban_auth_session');
  if (typeof setRole === 'function' && currentRole === 'ops') {
    setRole('manager');
  }
}

let autoLockTimer = null;
function scheduleAutoLock() {
  clearTimeout(autoLockTimer);
  if (!authSession) return;
  const remaining = authSession.until - Date.now();
  if (remaining <= 0) { endOpsSession(); return; }
  autoLockTimer = setTimeout(() => {
    if (currentRole === 'ops') {
      showNotif('🔒 انتهت الجلسة — تم القفل تلقائياً', 'info');
      endOpsSession();
    }
  }, remaining);
}

// ============ AUTH MODAL ============
function openAuthModal(mode, callback) {
  // mode: 'login' | 'setup' | 'reset' | 'change'
  // callback: function called on success
  const modal = document.getElementById('authModal');
  if (!modal) return;
  modal.dataset.mode = mode || 'login';
  modal.dataset.hasCallback = callback ? '1' : '0';
  if (callback) window._authCallback = callback;
  
  const title = document.getElementById('authModalTitle');
  const subtitle = document.getElementById('authModalSubtitle');
  const setupSection = document.getElementById('authSetupSection');
  const loginSection = document.getElementById('authLoginSection');
  const emailSection = document.getElementById('authEmailSection');
  const emailField = document.getElementById('authEmailField');
  const biometricBtn = document.getElementById('authBiometricBtn');
  
  // Pre-fill email field if exists
  const savedEmail = localStorage.getItem('blaban_auth_ops_email') || '';
  if (emailField) emailField.value = savedEmail;
  
  if (mode === 'setup') {
    title.textContent = '🔐 إعداد حساب مدير التشغيل';
    subtitle.innerHTML = 'هذا الحساب فقط يمكنه تعديل بنود التقييم والفروع.<br>اختر بريداً وكلمة مرور قوية.';
    setupSection.style.display = '';
    loginSection.style.display = 'none';
    emailSection.style.display = '';  // Show email for setup
    if (emailField) emailField.readOnly = false;
    biometricBtn.style.display = 'none';
  } else if (mode === 'reset') {
    title.textContent = '🔄 إعادة تعيين كلمة المرور';
    subtitle.textContent = '⚠️ سيتم مسح كلمة المرور الحالية وإعداد كلمة جديدة. ستحتاج للتحقق مرة قبل التغيير.';
    setupSection.style.display = '';
    loginSection.style.display = '';
    emailSection.style.display = '';
    if (emailField) emailField.readOnly = false;
    biometricBtn.style.display = localStorage.getItem('blaban_auth_webauthn_id') ? '' : 'none';
    document.getElementById('authNewPwd').placeholder = 'كلمة المرور الجديدة';
  } else if (mode === 'change') {
    title.textContent = '🔄 تغيير كلمة المرور';
    subtitle.textContent = 'أدخل بريدك وكلمة المرور الحالية ثم الجديدة';
    setupSection.style.display = '';
    loginSection.style.display = '';
    emailSection.style.display = '';
    if (emailField) emailField.readOnly = false;
    biometricBtn.style.display = 'none';
    document.getElementById('authNewPwd').placeholder = 'كلمة المرور الجديدة';
  } else {
    // login
    title.textContent = '🔓 تسجيل دخول مدير التشغيل';
    subtitle.innerHTML = 'هذه الوظيفة محمية ومتاحة لمدير التشغيل فقط.<br>أدخل بريدك وكلمة المرور للمتابعة.';
    setupSection.style.display = 'none';
    loginSection.style.display = '';
    emailSection.style.display = '';
    if (emailField) emailField.readOnly = false;
    biometricBtn.style.display = localStorage.getItem('blaban_auth_webauthn_id') ? '' : 'none';
  }
  
  // Reset error
  const err = document.getElementById('authError');
  if (err) err.style.display = 'none';
  // Clear password inputs (but keep email)
  document.getElementById('authPwd').value = '';
  document.getElementById('authNewPwd').value = '';
  document.getElementById('authNewPwdConfirm').value = '';
  
  // Show/hide biometric registration option (only in setup if WebAuthn supported)
  const bioSetup = document.getElementById('authBiometricSetup');
  if (bioSetup) {
    bioSetup.style.display = (mode === 'setup' && isWebAuthnSupported()) ? '' : 'none';
  }
  
  modal.classList.remove('hidden');
  setTimeout(() => {
    // Focus appropriate field
    if (mode === 'setup' || !savedEmail) {
      if (emailField) emailField.focus();
    } else {
      if (mode === 'change' || mode === 'reset') {
        document.getElementById('authPwd').focus();
      } else {
        document.getElementById('authPwd').focus();
      }
    }
  }, 100);
}

function closeAuthModal() {
  const m = document.getElementById('authModal');
  if (m) m.classList.add('hidden');
  window._authCallback = null;
}

function showAuthError(msg) {
  const err = document.getElementById('authError');
  if (!err) return;
  err.textContent = '⚠️ ' + msg;
  err.style.display = 'block';
}

async function submitAuth() {
  console.log('[Auth] submitAuth called');
  try {
    await _submitAuthCore();
  } catch (err) {
    console.error('[Auth] Error in submitAuth:', err);
    showAuthError('خطأ تقني: ' + (err.message || err));
  }
}

async function _submitAuthCore() {
  const modal = document.getElementById('authModal');
  if (!modal) {
    console.error('authModal not found');
    return;
  }
  const mode = modal.dataset.mode || 'login';
  console.log('[Auth] Mode:', mode);
  
  // Safely get input values (elements may or may not be visible)
  const emailEl = document.getElementById('authEmailField');
  const pwdEl = document.getElementById('authPwd');
  const newPwdEl = document.getElementById('authNewPwd');
  const newPwdConfirmEl = document.getElementById('authNewPwdConfirm');
  
  const email = emailEl ? (emailEl.value || '').trim().toLowerCase() : '';
  const pwd = pwdEl ? pwdEl.value : '';
  const newPwd = newPwdEl ? newPwdEl.value : '';
  const newPwdConfirm = newPwdConfirmEl ? newPwdConfirmEl.value : '';
  
  // Helper: validate email format
  const isValidEmail = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
  
  if (mode === 'setup') {
    // Validate email
    if (!email) {
      showAuthError('أدخل البريد الإلكتروني');
      if (emailEl) emailEl.focus();
      return;
    }
    if (!isValidEmail(email)) {
      showAuthError('صيغة البريد الإلكتروني غير صحيحة');
      if (emailEl) emailEl.focus();
      return;
    }
    // Validate password
    if (!newPwd || newPwd.length < 6) {
      showAuthError('كلمة المرور يجب أن تكون 6 أحرف على الأقل');
      if (newPwdEl) newPwdEl.focus();
      return;
    }
    if (newPwd !== newPwdConfirm) {
      showAuthError('كلمتا المرور غير متطابقتين');
      if (newPwdConfirmEl) newPwdConfirmEl.focus();
      return;
    }
    
    // Save email + password hash
    const salt = generateSalt();
    const hash = await sha256Hash(newPwd + salt);
    localStorage.setItem('blaban_auth_pwd_hash', hash);
    localStorage.setItem('blaban_auth_pwd_salt', salt);
    localStorage.setItem('blaban_auth_ops_email', email);
    localStorage.setItem('blaban_auth_initialized', '1');
    
    // Optional biometric registration
    const bioChk = document.getElementById('authBioCheckbox');
    const wantBio = bioChk ? bioChk.checked : false;
    if (wantBio && isWebAuthnSupported()) {
      try {
        await registerBiometric();
        showNotif('✅ تم إعداد الحساب والبصمة بنجاح!', 'success');
      } catch(e) {
        console.warn('Biometric registration failed:', e);
        showNotif('✅ تم إعداد الحساب — لكن تسجيل البصمة فشل', 'info');
      }
    } else {
      showNotif('✅ تم إعداد حساب مدير التشغيل بنجاح!', 'success');
    }
    
    if (typeof addHistoryEntry === 'function') {
      addHistoryEntry({ type:'auth', action:'create', target:'حساب مدير التشغيل', details:'تم الإعداد لأول مرة: '+email });
    }
    
    startOpsSession();
    closeAuthModal();
    if (window._authCallback) {
      const cb = window._authCallback;
      window._authCallback = null;
      try { cb(); } catch(e) { console.error('Callback error:', e); }
    }
    return;
  }
  
  if (mode === 'login') {
    const storedHash = localStorage.getItem('blaban_auth_pwd_hash');
    const salt = localStorage.getItem('blaban_auth_pwd_salt');
    const storedEmail = (localStorage.getItem('blaban_auth_ops_email') || '').toLowerCase();
    
    if (!storedHash || !salt) {
      showAuthError('لم يتم إعداد حساب مدير التشغيل بعد. يرجى الإعداد أولاً.');
      return;
    }
    if (!email) {
      showAuthError('أدخل البريد الإلكتروني');
      if (emailEl) emailEl.focus();
      return;
    }
    if (!pwd) {
      showAuthError('أدخل كلمة المرور');
      if (pwdEl) pwdEl.focus();
      return;
    }
    
    // Check email (if was set, must match)
    if (storedEmail && email !== storedEmail) {
      showAuthError('البريد الإلكتروني أو كلمة المرور غير صحيحة');
      await new Promise(r => setTimeout(r, 400));
      return;
    }
    
    const hash = await sha256Hash(pwd + salt);
    if (hash !== storedHash) {
      showAuthError('البريد الإلكتروني أو كلمة المرور غير صحيحة');
      await new Promise(r => setTimeout(r, 400));
      return;
    }
    
    startOpsSession();
    closeAuthModal();
    if (typeof addHistoryEntry === 'function') {
      addHistoryEntry({ type:'auth', action:'update', target:'دخول مدير التشغيل', details:'تم التحقق: '+email });
    }
    if (window._authCallback) {
      const cb = window._authCallback;
      window._authCallback = null;
      try { cb(); } catch(e) { console.error('Callback error:', e); }
    }
    showNotif('✅ تم التحقق بنجاح', 'success');
    return;
  }
  
  if (mode === 'change' || mode === 'reset') {
    // Verify current password
    const storedHash = localStorage.getItem('blaban_auth_pwd_hash');
    const salt = localStorage.getItem('blaban_auth_pwd_salt');
    const storedEmail = (localStorage.getItem('blaban_auth_ops_email') || '').toLowerCase();
    
    if (storedHash && salt) {
      if (storedEmail && email !== storedEmail) {
        showAuthError('البريد الإلكتروني غير صحيح');
        return;
      }
      const hash = await sha256Hash(pwd + salt);
      if (hash !== storedHash) {
        showAuthError('كلمة المرور الحالية غير صحيحة');
        await new Promise(r => setTimeout(r, 400));
        return;
      }
    }
    // Set new password
    if (!newPwd || newPwd.length < 6) {
      showAuthError('كلمة المرور الجديدة يجب أن تكون 6 أحرف على الأقل');
      return;
    }
    if (newPwd !== newPwdConfirm) {
      showAuthError('كلمتا المرور الجديدتان غير متطابقتين');
      return;
    }
    const newSalt = generateSalt();
    const newHash = await sha256Hash(newPwd + newSalt);
    localStorage.setItem('blaban_auth_pwd_hash', newHash);
    localStorage.setItem('blaban_auth_pwd_salt', newSalt);
    // Update email if provided
    if (email && isValidEmail(email)) {
      localStorage.setItem('blaban_auth_ops_email', email);
    }
    if (typeof addHistoryEntry === 'function') {
      addHistoryEntry({ type:'auth', action:'update', target:'كلمة مرور مدير التشغيل', details: mode==='reset'?'تمت إعادة التعيين':'تم التغيير' });
    }
    showNotif('✅ تم تحديث كلمة المرور', 'success');
    closeAuthModal();
    return;
  }
}

// ============ EMERGENCY RESET (when user forgets) ============
function emergencyResetPassword() {
  const confirmText = prompt('⚠️ تحذير: ستفقد كلمة المرور الحالية ويتم إعداد جديدة.\n\nاكتب "موافق" للتأكيد:');
  if (confirmText !== 'موافق') {
    showNotif('❌ تم الإلغاء', 'info');
    return;
  }
  // Optionally also remove biometric
  if (confirm('هل تريد أيضاً إزالة البصمة المسجلة (إن وُجدت)؟')) {
    localStorage.removeItem('blaban_auth_webauthn_id');
    localStorage.removeItem('blaban_auth_webauthn_pubkey');
  }
  localStorage.removeItem('blaban_auth_pwd_hash');
  localStorage.removeItem('blaban_auth_pwd_salt');
  localStorage.removeItem('blaban_auth_initialized');
  endOpsSession();
  if (typeof addHistoryEntry === 'function') {
    addHistoryEntry({ type:'auth', action:'delete', target:'كلمة مرور مدير التشغيل', details:'إعادة تعيين طارئة' });
  }
  closeAuthModal();
  showNotif('🔓 تم إعادة التعيين — أعد إعداد كلمة مرور جديدة', 'info');
  // Open setup
  setTimeout(() => {
    openAuthModal('setup', () => {});
  }, 500);
}

// ============ WEB AUTHN (Biometric/Fingerprint) ============
function isWebAuthnSupported() {
  return typeof window.PublicKeyCredential !== 'undefined' &&
         typeof navigator.credentials !== 'undefined' &&
         typeof navigator.credentials.create === 'function';
}

async function isBiometricAvailable() {
  if (!isWebAuthnSupported()) return false;
  try {
    return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
  } catch(e) { return false; }
}

async function registerBiometric() {
  if (!isWebAuthnSupported()) {
    showNotif('⚠️ هذا الجهاز لا يدعم البصمة', 'error');
    return false;
  }
  
  // Generate user ID + challenge
  const userId = new TextEncoder().encode('blaban-ops-' + (fbWorkspace || 'default'));
  const challenge = new Uint8Array(32);
  crypto.getRandomValues(challenge);
  
  const publicKey = {
    challenge: challenge,
    rp: { name: 'ب لبن قطر — تقييم الأداء' },
    user: {
      id: userId,
      name: 'ops@blaban-qatar',
      displayName: 'مدير التشغيل'
    },
    pubKeyCredParams: [
      { type: 'public-key', alg: -7 },   // ES256
      { type: 'public-key', alg: -257 }  // RS256
    ],
    authenticatorSelection: {
      authenticatorAttachment: 'platform', // require platform authenticator (built-in fingerprint/face)
      userVerification: 'required',
      requireResidentKey: false
    },
    timeout: 60000,
    attestation: 'none'
  };
  
  try {
    const cred = await navigator.credentials.create({ publicKey });
    if (!cred) throw new Error('No credential returned');
    
    // Store credential ID (and a challenge token for later verification)
    const credIdArr = new Uint8Array(cred.rawId);
    const credIdB64 = btoa(String.fromCharCode(...credIdArr));
    localStorage.setItem('blaban_auth_webauthn_id', credIdB64);
    
    showNotif('✅ تم تسجيل البصمة بنجاح!', 'success');
    if (typeof addHistoryEntry === 'function') {
      addHistoryEntry({ type:'auth', action:'create', target:'بصمة مدير التشغيل', details:'تم التسجيل' });
    }
    return true;
  } catch(err) {
    console.error('WebAuthn registration error:', err);
    if (err.name === 'NotAllowedError') {
      showNotif('❌ تم إلغاء العملية', 'error');
    } else {
      showNotif('❌ فشل تسجيل البصمة: ' + (err.message||err.name), 'error');
    }
    return false;
  }
}

async function verifyBiometric() {
  if (!isWebAuthnSupported()) {
    showNotif('⚠️ هذا الجهاز لا يدعم البصمة', 'error');
    return false;
  }
  const credIdB64 = localStorage.getItem('blaban_auth_webauthn_id');
  if (!credIdB64) {
    showNotif('⚠️ لم يتم تسجيل بصمة بعد. سجّل أولاً من الإعدادات.', 'error');
    return false;
  }
  
  const credIdArr = Uint8Array.from(atob(credIdB64), c => c.charCodeAt(0));
  const challenge = new Uint8Array(32);
  crypto.getRandomValues(challenge);
  
  const publicKey = {
    challenge,
    allowCredentials: [{
      type: 'public-key',
      id: credIdArr,
      transports: ['internal']
    }],
    userVerification: 'required',
    timeout: 60000
  };
  
  try {
    const assertion = await navigator.credentials.get({ publicKey });
    if (!assertion) return false;
    
    // We trust the platform's user verification (since we required it)
    // Note: Without a server, we can't cryptographically verify the signature.
    // This is a "presence + user verification" check — relies on platform security.
    return true;
  } catch(err) {
    console.error('WebAuthn verification error:', err);
    if (err.name === 'NotAllowedError') {
      showNotif('❌ تم إلغاء أو فشل التحقق', 'error');
    } else {
      showNotif('❌ خطأ: ' + (err.message||err.name), 'error');
    }
    return false;
  }
}

async function loginWithBiometric() {
  const ok = await verifyBiometric();
  if (!ok) return;
  startOpsSession();
  closeAuthModal();
  if (typeof addHistoryEntry === 'function') {
    addHistoryEntry({ type:'auth', action:'update', target:'دخول مدير التشغيل', details:'تم التحقق بالبصمة' });
  }
  if (window._authCallback) {
    const cb = window._authCallback;
    window._authCallback = null;
    cb();
  }
  showNotif('✅ تم التحقق بالبصمة بنجاح', 'success');
}

// ============ SETUP / MANAGEMENT ============
function openAuthSettingsModal() {
  // Unified modal: edit-mode toggle (primary) + auth management
  const initialized = isAuthInitialized();
  const hasBio = !!localStorage.getItem('blaban_auth_webauthn_id');
  const myBranch = localStorage.getItem('blaban_my_branch');
  const editing = canEditNow();
  
  let html = '';
  
  // Top: edit-mode primary action
  if (!initialized) {
    html += `<div class="alert alert-info" style="margin-bottom:12px;">🔓 لم يتم إعداد رمز التعديل بعد. أنشئ رمزاً لحماية وضع مدير التشغيل من التعديل غير المصرح به.</div>
      <button class="btn btn-gold" onclick="closeAuthSettingsModal();openAuthModal('setup',()=>{refreshEditModeButton();if(typeof selectedBranch!=='undefined'&&typeof renderBranch==='function'){try{renderBranch(selectedBranch);}catch(e){}}showNotif('🔓 تم الإعداد ووضع التعديل مفعّل','success');})" style="width:100%;font-size:14px;padding:12px;">
        🆕 إنشاء رمز التعديل وفتحه
      </button>`;
  } else {
    if (editing) {
      html += `<div class="alert alert-success" style="margin-bottom:12px;">✅ <strong>وضع التعديل مفعّل</strong> — الجلسة فعّالة لمدة ${Math.ceil((authSession.until-Date.now())/60000)} دقيقة</div>
        <button class="btn btn-red" onclick="lockEditFromMenu()" style="width:100%;font-size:14px;padding:12px;margin-bottom:14px;">
          🔒 قفل التعديل (العودة للقراءة فقط)
        </button>`;
    } else {
      html += `<div class="alert alert-info" style="margin-bottom:12px;">👁️ <strong>وضع القراءة فقط</strong> — لتعديل التقييم افتح وضع التعديل</div>
        <button class="btn btn-gold" onclick="openEditFromMenu()" style="width:100%;font-size:14px;padding:12px;margin-bottom:14px;">
          🔓 فتح وضع التعديل (يتطلب الرمز)
        </button>`;
    }
    
    // Secondary: management options
    html += `<div style="font-size:12px;font-weight:700;color:var(--text-muted);margin-top:14px;margin-bottom:8px;">⚙️ إدارة الأمان:</div>
      <div style="display:grid;gap:8px;">
        <button class="btn btn-blue" onclick="closeAuthSettingsModal();openAuthModal('change',()=>{})">🔄 تغيير الرمز</button>
        ${hasBio 
          ? `<button class="btn btn-orange" onclick="removeBiometric()">🗑️ حذف البصمة المسجلة</button>` 
          : `<button class="btn btn-purple" onclick="setupBiometric()">👆 إضافة بصمة / Face ID</button>`}
        ${myBranch ? `<button class="btn btn-orange" onclick="resetMyBranch()">🏪 إعادة تعيين فرعي (${BRANCH_NAMES[myBranch]||myBranch})</button>` : ''}
        <button class="btn btn-red" onclick="emergencyResetPassword()">⚠️ إعادة تعيين طارئة (نسيت الرمز)</button>
      </div>
      <div style="margin-top:14px;padding:10px;background:rgba(0,0,0,0.2);border-radius:8px;font-size:11px;color:var(--text-muted);">
        <strong>الحالة:</strong><br>
        ${editing ? `🔓 الجلسة فعّالة لمدة ${Math.ceil((authSession.until-Date.now())/60000)} دقيقة` : '🔒 لا توجد جلسة نشطة'}<br>
        ${hasBio ? '✅ البصمة مسجّلة' : '⚪ لا توجد بصمة مسجّلة'}
      </div>`;
  }
  
  const modal = document.getElementById('authSettingsModal');
  if (!modal) return;
  document.getElementById('authSettingsContent').innerHTML = html;
  modal.classList.remove('hidden');
}

// Helper: open edit from inside settings menu
function openEditFromMenu() {
  closeAuthSettingsModal();
  requireOpsPin(() => {
    refreshEditModeButton();
    if (typeof selectedBranch !== 'undefined' && typeof renderBranch === 'function') {
      try { renderBranch(selectedBranch); } catch(e){}
    }
    showNotif('🔓 وضع التعديل مفعّل — لمدة 15 دقيقة', 'success');
  });
}

// Helper: lock edit from inside settings menu
function lockEditFromMenu() {
  closeAuthSettingsModal();
  endOpsSession();
  showNotif('🔒 تم قفل التعديل — كل البيانات للقراءة الآن', 'info');
  refreshEditModeButton();
  if (typeof selectedBranch !== 'undefined' && typeof renderBranch === 'function') {
    try { renderBranch(selectedBranch); } catch(e){}
  }
}

function resetMyBranch() {
  if (!confirm('هل تريد إعادة اختيار الفرع؟ سيتم سؤالك من جديد.')) return;
  localStorage.removeItem('blaban_my_branch');
  closeAuthSettingsModal();
  showNotif('🏪 تم إعادة التعيين — اختر فرعك من جديد', 'info');
  // Re-trigger setRole if currently in manager mode
  if (currentRole === 'manager' && typeof window.setRole === 'function') {
    setTimeout(() => window.setRole('manager'), 200);
  }
}

function closeAuthSettingsModal() {
  const m = document.getElementById('authSettingsModal');
  if (m) m.classList.add('hidden');
}

async function setupBiometric() {
  if (!isWebAuthnSupported()) {
    showNotif('⚠️ المتصفح/الجهاز لا يدعم البصمة', 'error');
    return;
  }
  const available = await isBiometricAvailable();
  if (!available) {
    showNotif('⚠️ لم يتم اكتشاف بصمة/Face ID مفعّل على هذا الجهاز', 'error');
    return;
  }
  // Verify password first
  closeAuthSettingsModal();
  openAuthModal('login', async () => {
    await registerBiometric();
    setTimeout(openAuthSettingsModal, 500);
  });
}

function removeBiometric() {
  if (!confirm('هل تريد حذف البصمة المسجلة؟')) return;
  localStorage.removeItem('blaban_auth_webauthn_id');
  if (typeof addHistoryEntry === 'function') {
    addHistoryEntry({ type:'auth', action:'delete', target:'بصمة مدير التشغيل', details:'تمت إزالتها' });
  }
  showNotif('🗑️ تم حذف البصمة', 'info');
  openAuthSettingsModal();
}

// ============ ROLE SWITCHING (NO AUTHENTICATION REQUIRED) ============
// Logic (NEW):
//  - Switching between roles is FREE for everyone (read-only by default)
//  - Editing data (evaluations, recommendations, etc.) requires the OPS PIN
//  - Once PIN entered, an "edit session" is active for 15 minutes
//  - The edit session works regardless of which role you're viewing
const _originalSetRole = window.setRole || setRole;
window.setRole = function(role) {
  _originalSetRole(role);
  // If switching, just keep the session if any
  if (isOpsSessionValid()) scheduleAutoLock();
};

// ============ REQUIRE OPS PIN BEFORE EDITING ============
// Wraps any action that modifies data. Shows PIN modal if no valid session.
function requireOpsPin(callback, opts) {
  opts = opts || {};
  // Already authenticated? Just run.
  if (isOpsSessionValid()) {
    scheduleAutoLock();
    callback();
    return;
  }
  // No password set yet? Setup
  if (!isAuthInitialized()) {
    openAuthModal('setup', callback);
    return;
  }
  // Need PIN
  openAuthModal('login', callback);
}

// Helper for inline edit attempts: returns true if allowed, false otherwise (and triggers prompt)
function canEditNow() {
  return isOpsSessionValid();
}

function blockEditWithPrompt(callback) {
  if (canEditNow()) { scheduleAutoLock(); return true; }
  requireOpsPin(callback);
  return false;
}

// Expose globally for cross-script access
window.canEditNow = canEditNow;
window.requireOpsPin = requireOpsPin;
window.isOpsSessionValid = isOpsSessionValid;
window.openAuthModal = openAuthModal;
window.closeAuthModal = closeAuthModal;
window.submitAuth = submitAuth;
window.showAuthError = showAuthError;

// Edit Mode + Security combined menu
function toggleEditMode() {
  // Open the unified security menu (which contains: lock/unlock + manage password + biometric + reset)
  openAuthSettingsModal();
}

// Update the edit-mode button label/style based on session state
function refreshEditModeButton() {
  const btn = document.getElementById('editModeBtn');
  if (!btn) return;
  if (canEditNow()) {
    btn.innerHTML = '🔓 تعديل مفعّل';
    btn.classList.add('editing-active');
    btn.title = 'وضع التعديل مفعّل — اضغط لإدارته';
    // Show edit-mode banner
    const banner = document.getElementById('editModeBanner');
    if (banner) banner.style.display = '';
  } else {
    btn.classList.remove('editing-active');
    if (!isAuthInitialized()) {
      btn.innerHTML = '🆕 الأمان';
      btn.title = 'أنشئ رمز مدير التشغيل لفتح التعديل';
    } else {
      btn.innerHTML = '🔐 الأمان';
      btn.title = 'إعدادات الأمان وفتح التعديل';
    }
    const banner = document.getElementById('editModeBanner');
    if (banner) banner.style.display = 'none';
  }
}

// Auto-refresh button periodically
setInterval(refreshEditModeButton, 5000);

// Lock button (manual) — kept for backwards compat
function lockOpsMode() {
  toggleEditMode();
}

// Reset session timer on user activity (session-based, not role-based)
['click','keydown','touchstart'].forEach(evt => {
  document.addEventListener(evt, () => {
    if (authSession) {
      // Extend session
      authSession.until = Date.now() + AUTH_SESSION_DURATION;
      localStorage.setItem('blaban_auth_session', JSON.stringify(authSession));
      scheduleAutoLock();
    }
  }, { passive: true });
});

// Restore session on load
if (isOpsSessionValid()) {
  scheduleAutoLock();
} else if (currentRole === 'ops' && isAuthInitialized()) {
  // Was ops but session expired — downgrade to manager
  setTimeout(() => {
    if (typeof _originalSetRole === 'function') {
      _originalSetRole('manager');
    }
  }, 100);
}

// ============ Helper for readonly alerts ============
function showReadonlyAlert() {
  showNotif('🔒 وضع القراءة فقط — مدير الفرع لا يمكنه تعديل التقييم', 'info');
}
</script>
