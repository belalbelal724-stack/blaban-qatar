<script>
// ===================== RENDER BRANCH =====================
function renderBranch(branch) {
  const branchName = BRANCH_NAMES[branch];
  const container = document.getElementById(`branch-${branch}`);
  if (!container) return;
  const monthOpts = MONTHS.map((m,i) => `<option value="${i}" ${i===currentMonth?'selected':''}>${m} 2026</option>`).join('');
  const daysCount = MONTH_DAYS[currentMonth];
  const dayOpts = Array.from({length:daysCount},(_,i)=>`<option value="${i+1}" ${i+1===currentDay?'selected':''}>${i+1}</option>`).join('');
  const visitData = getVisitData(branch, currentMonth, currentDay);
  const isReadonly = !(typeof isOpsSessionValid === 'function' && isOpsSessionValid());
  const ro = isReadonly ? 'disabled' : '';
  const roReadonly = isReadonly ? 'readonly' : '';

  container.innerHTML = `
  <div class="card">
    <div class="card-title">🏪 فرع ${branchName} — 2026 ${isReadonly?'<span style="font-size:var(--fs-xs);color:var(--gold);font-weight:700;">(عرض)</span>':''}</div>
    
    <!-- Date navigation quick bar -->
    <div class="date-nav-bar">
      <button class="date-nav-btn" onclick="setBranchDateToday('${branch}')" title="الذهاب لتاريخ اليوم">📅 اليوم</button>
      <button class="date-nav-btn" onclick="openDatePickerForBranch('${branch}')" title="اختر تاريخاً للرجوع إليه">🗓️ اختر تاريخاً</button>
      <button class="date-nav-btn date-nav-log" onclick="openBranchEvalsLog('${branch}')" title="عرض جميع أيام التقييم لهذا الفرع">📋 سجل التقييمات</button>
      <span class="date-nav-info" id="${branch}_dateInfo">📆</span>
    </div>
    
    <div class="form-row">
      <div class="form-group">
        <label>الشهر</label>
        <select id="${branch}_month" ${ro} ${isReadonly?'':`onchange="onMonthChange('${branch}')"`}>${monthOpts}</select>
      </div>
      <div class="form-group">
        <label>اليوم</label>
        <select id="${branch}_day" ${ro} ${isReadonly?'':`onchange="onDayChange('${branch}')"`}>${dayOpts}</select>
      </div>
      <div class="form-group">
        <label>المدير(ون) المتواجد(ون)</label>
        <input type="text" id="${branch}_manager" placeholder="اسم المدير (أو: محمد، أحمد)" ${roReadonly} ${isReadonly?'':`oninput="onManagerChange('${branch}')"`} value="${(visitData.managers&&visitData.managers.length)?visitData.managers.join('، '):(visitData.manager||'')}">
        <div style="margin-top:3px;font-size:10px;color:var(--text-muted);font-weight:600;">💡 افصل بفاصلة لتعدد المدراء${(visitData.managers&&visitData.managers.length>1)?` • <strong style="color:var(--green);">👥 ${visitData.managers.length} مدراء</strong>`:''}</div>
      </div>
      <div class="form-group">
        <label>الشيفت</label>
        <select id="${branch}_shift" ${ro} ${isReadonly?'':`onchange="onShiftChange('${branch}')"`}>
          <option value="">اختر الشيفت</option>
          <option value="صباحي" ${visitData.shift==='صباحي'?'selected':''}>☀️ صباحي</option>
          <option value="مسائي" ${visitData.shift==='مسائي'?'selected':''}>🌙 مسائي</option>
        </select>
      </div>
    </div>
    <div id="${branch}_repeat_alert"></div>
  </div>

  <div id="${branch}_checklist"></div>

  <div class="card">
    <div class="card-title">📊 نتيجة التقييم</div>
    <div class="grid-4">
      <div class="stat-card"><div class="stat-icon">✅</div><div class="stat-value" id="${branch}_ok_count">0</div><div class="stat-label">مطابق (شامل المعفى)</div></div>
      <div class="stat-card"><div class="stat-icon">❌</div><div class="stat-value" id="${branch}_fail_count">0</div><div class="stat-label">مخصوم على الفرع</div></div>
      <div class="stat-card" id="${branch}_excused_wrap"><div class="stat-icon">💙</div><div class="stat-value" id="${branch}_excused_count">0</div><div class="stat-label">معفى تلقائياً ✓</div></div>
      <div class="stat-card"><div class="stat-icon">⭐</div><div class="stat-value" id="${branch}_pct">-</div><div class="stat-label">نسبة تقييم الفرع</div></div>
    </div>
    <div style="margin-top:14px;" id="${branch}_action_rec"></div>
  </div>

  <div class="card action-plan-card">
    <div class="card-title">🎯 خطة العمل (الأكشن بلان) — فرع ${branchName}</div>
    <div id="${branch}_action_plan_status_summary" style="margin-bottom:10px;"></div>
    <div style="font-size:var(--fs-sm);color:var(--text-muted);margin-bottom:10px;font-style:italic;">
      ⚠️ هذه البنود تُولَّد <strong>تلقائياً</strong> من بنود التقييم غير المطابقة. الصورة المُضافة في التقييم تظهر هنا تلقائياً كـ "صورة قبل"، ومدير الفرع يضيف "صورة بعد" التصحيح.
    </div>
    <div id="${branch}_action_plan_items"></div>
    <div class="img-upload-area" onclick="document.getElementById('${branch}_img_input').click()" style="margin-top:12px;">
      📷 انقر لإرفاق صور توثيقية للأكشن بلان
      <input type="file" id="${branch}_img_input" multiple accept="image/*" style="display:none" onchange="handleImages('${branch}', this)">
    </div>
    <div class="uploaded-imgs" id="${branch}_imgs"></div>
  </div>

  <div class="page-footer">
    
    <div class="footer-actions">
      <button class="btn btn-gold btn-sm" onclick="exportBranchExcel('${branch}','${branchName}')">📊 Excel كامل</button>
      <button class="btn btn-gold btn-sm" onclick="exportBranchDailyExcel('${branch}','${branchName}')">📋 تقرير اليوم</button>
      <button class="btn btn-orange btn-sm" style="background:linear-gradient(135deg,#D35400,#E67E22);color:#fff;font-weight:800;" onclick="exportFullReportExcel('${branch}')">📑 التقرير الشامل (6 أوراق)</button>
      <button class="btn btn-green btn-sm" style="background:linear-gradient(135deg,#27AE60,#2ECC71);color:#fff;font-weight:800;" onclick="exportBranchZipWithPhotos('${branch}')">📦 Excel + الصور (ZIP)</button>
      <button class="btn" style="background:linear-gradient(135deg,#E74C3C,#C0392B);color:#fff;font-weight:800;font-size:13px;padding:6px 14px;border-radius:8px;border:none;cursor:pointer;" onclick="openPdfExportModal('${branch}')">📄 تصدير PDF</button>
      <button class="btn btn-blue btn-sm" onclick="openActionPlanImport()" title="ارفع Excel الأكشن بلان">📂 استيراد الأكشن بلان</button>
      <button class="btn btn-primary btn-sm" onclick="window.print()">🖨️ طباعة</button>
      <button class="btn btn-gold" onclick="openShareModal('branch','${branch}','${branchName}')">📤 مشاركة التقرير</button>
    </div>
  </div>`;

  renderChecklist(branch);
  updateScore(branch);
  renderImages(branch, currentMonth, currentDay);
}

function renderChecklist(branch) {
  const container = document.getElementById(`${branch}_checklist`);
  if (!container) return;
  const month = getSelMonth(branch);
  const day = getSelDay(branch);
  const visitData = getVisitData(branch, month, day);
  const isReadonly = !(typeof isOpsSessionValid === 'function' && isOpsSessionValid());
  const disabledAttr = isReadonly ? 'disabled' : '';
  const onclickGuard = (fn) => isReadonly ? `onclick="showReadonlyAlert()"` : fn;
  let html = '';
  if (isReadonly) {
    html += `<div class="alert alert-info" style="font-size:var(--fs-sm);margin-bottom:10px;">
      🔒 <strong>وضع القراءة فقط</strong> — أنت مدير فرع، يمكنك مشاهدة التقييم والعمل على الأكشن بلان أدناه فقط. التعديل على نتائج التقييم محصور بمدير التشغيل.
    </div>`;
  }
  CHECKLIST.forEach(sec => {
    html += `<div class="checklist-section${isReadonly?' readonly':''}"><div class="section-header">${sec.section}</div>`;
    sec.items.forEach(item => {
      const result = visitData.results[item.id];
      const dept = visitData.deptAssign[item.id] || 'الفرع';
      const reported = visitData.reported24h[item.id] === true;
      const isRepeat = checkRepeated(branch, item.id, month, day);
      const isOtherDept = result === 'fail' && dept !== 'الفرع';
      const isAutoExcused = isOtherDept && reported;
      const isAutoDeducted = isOtherDept && !reported;

      // User can mark ANY item as critical (per-day per-item)
      const userCritical = visitData.userCritical?.[item.id] === true;
      const isCriticalItem = item.critical || userCritical;
      
      html += `
      <div class="check-item ${isRepeat&&result==='fail'?'repeated-error':''}${isCriticalItem?' critical-item':''}${isCriticalItem&&result==='fail'?' critical-fail':''}${isReadonly?' readonly':''}" id="${branch}_item_${item.id}">
        ${isRepeat&&result==='fail'?`<span class="repeat-badge">⚠️ مكرر</span>`:''}
        ${isCriticalItem?`<span class="critical-badge">🚨 بند حرج</span>`:''}
        <div class="check-label"><span class="item-icon">${item.icon}</span>${item.text}${isCriticalItem?' <strong style="color:var(--red);font-size:0.85em;">(CRITICAL)</strong>':''}</div>
        <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;">
          <div class="check-options">
            <button class="check-btn ok ${result==='ok'?'selected':''}" ${isReadonly?'disabled':`onclick="setResult('${branch}','${item.id}','ok')"`}>✅ مطابق</button>
            <button class="check-btn fail ${result==='fail'?'selected':''}" ${isReadonly?'disabled':`onclick="setResult('${branch}','${item.id}','fail')"`}>❌ غير مطابق</button>
            ${result ? `<button class="check-btn clear-btn" ${isReadonly?'disabled':`onclick="clearResult('${branch}','${item.id}')"`} title="إلغاء الاختيار / تراجع">↩️ تراجع</button>` : ''}
          </div>
          ${!isReadonly && !item.critical ? `
          <label class="user-critical-toggle" title="جعل هذا البند حرجاً">
            <input type="checkbox" ${userCritical?'checked':''} onchange="toggleUserCritical('${branch}','${item.id}',this.checked)">
            <span>🚨 جعل البند حرجاً</span>
          </label>
          ` : ''}
          <select class="dept-select ${result==='fail'?'visible':''}" id="${branch}_dept_${item.id}" ${disabledAttr} ${isReadonly?'':`onchange="setDept('${branch}','${item.id}',this.value)"`}>
            ${DEPTS.map(d=>`<option value="${d}" ${dept===d?'selected':''}>${d}</option>`).join('')}
          </select>
          ${result==='fail' && dept !== 'الفرع' ? `
          <div style="display:flex;align-items:center;gap:5px;margin-top:3px;background:rgba(52,152,219,0.1);border:1px solid #3498DB;border-radius:8px;padding:4px 8px;flex-wrap:wrap;">
            <span style="font-size:var(--fs-xs);color:#7EC8E3;font-weight:700;">📣 أُبلغ قبل 24 ساعة؟</span>
            <button class="check-btn ok ${reported?'selected':''}" style="font-size:var(--fs-xs);padding:4px 10px;font-weight:700;" ${isReadonly?'disabled':`onclick="setReported24h('${branch}','${item.id}',true)"`}>نعم ✓</button>
            <button class="check-btn fail ${!reported?'selected':''}" style="font-size:var(--fs-xs);padding:4px 10px;font-weight:700;" ${isReadonly?'disabled':`onclick="setReported24h('${branch}','${item.id}',false)"`}>لا</button>
          </div>
          ${isAutoExcused ? `<div class="auto-excuse-badge">✅ معفى تلقائياً — يُحسب للفرع (${dept})</div>` : ''}
          ${isAutoDeducted ? `<div class="auto-deduct-badge">❌ يُخصم من الفرع (لم يُبلَّغ عن ${dept})</div>` : ''}
          ` : ''}
          ${isRepeat&&result==='fail'?`<span style="font-size:var(--fs-xs);color:var(--red);font-weight:700;">📅 تكرار من: ${getRepeatDate(branch,item.id,month,day)}</span>`:''}
          ${result ? `
          <div style="margin-top:6px;width:100%;">
            <textarea rows="2" placeholder="${result==='ok'?'💬 أضف ملاحظة (اختياري) — حتى للبنود المطابقة...':'💬 أضف ملاحظة أو تعليق على هذا البند...'}" 
              ${isReadonly?'readonly':''} 
              style="width:100%;background:var(--bg-card);border:1px solid var(--border);color:var(--text-light);padding:6px 10px;border-radius:8px;font-family:Tajawal,sans-serif;font-size:calc(var(--fs-xs) - 2px);resize:vertical;min-height:52px;outline:none;${isReadonly?'opacity:0.7;cursor:not-allowed;':''}"
              ${isReadonly?'':`oninput="saveComment('${branch}','${item.id}',this.value)"`}>${visitData.comments&&visitData.comments[item.id]||''}</textarea>
          </div>
          ${result==='fail' ? renderItemPhotoSlot(branch, item.id, visitData) : ''}
          ` : ''}
        </div>
      </div>`;
    });
    html += `</div>`;
  });
  container.innerHTML = html;
  // Update date info bar
  if (typeof updateBranchDateInfo === 'function') updateBranchDateInfo(branch);
}

// ============ Date Navigation ============
function setBranchDateToday(branch) {
  const now = new Date();
  setBranchDate(branch, now.getMonth(), now.getDate());
}
function setBranchDateYesterday(branch) {
  const y = new Date();
  y.setDate(y.getDate() - 1);
  setBranchDate(branch, y.getMonth(), y.getDate());
}
function shiftBranchDate(branch, delta) {
  const m = getSelMonth(branch), d = getSelDay(branch);
  const date = new Date(2026, m, d);
  date.setDate(date.getDate() + delta);
  setBranchDate(branch, date.getMonth(), date.getDate());
}
function setBranchDate(branch, month, day) {
  const monthEl = document.getElementById(`${branch}_month`);
  const dayEl = document.getElementById(`${branch}_day`);
  if (!monthEl || !dayEl) return;
  monthEl.value = month;
  // Repopulate day options for new month
  const daysCount = MONTH_DAYS[month];
  dayEl.innerHTML = Array.from({length:daysCount},(_,i)=>`<option value="${i+1}" ${i+1===Math.min(day,daysCount)?'selected':''}>${i+1}</option>`).join('');
  renderChecklist(branch); updateScore(branch);
  updateBranchDateInfo(branch);
}

// Open a calendar-style date picker
function openDatePickerForBranch(branch) {
  let modal = document.getElementById('datePickerModal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'datePickerModal';
    modal.className = 'modal-overlay hidden';
    document.body.appendChild(modal);
  }
  
  const curM = getSelMonth(branch);
  const curD = getSelDay(branch);
  
  modal.innerHTML = `
    <div class="modal-box" style="max-width:520px;">
      <h3>🗓️ اختر تاريخاً للرجوع إليه</h3>
      <p style="font-size:var(--fs-sm);color:var(--text-muted);margin-bottom:14px;">
        اختر أي يوم في 2026 لمشاهدة التقييم في ذلك اليوم. البيانات تُحفظ تلقائياً لكل يوم على حدة.
      </p>
      
      <div class="form-row">
        <div class="form-group">
          <label>الشهر</label>
          <select id="datePickerMonth" onchange="updateDatePickerDays()">
            ${MONTHS.map((m,i) => `<option value="${i}" ${i===curM?'selected':''}>${m}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label>اليوم</label>
          <select id="datePickerDay">
            ${Array.from({length:MONTH_DAYS[curM]},(_,i) => `<option value="${i+1}" ${i+1===curD?'selected':''}>${i+1}</option>`).join('')}
          </select>
        </div>
      </div>
      
      <div style="background:var(--bg-card2);padding:12px;border-radius:10px;margin:12px 0;font-size:var(--fs-sm);">
        <strong style="color:var(--gold-light);">📌 اختصارات سريعة:</strong>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
          <button class="btn btn-blue btn-sm" onclick="datePickerQuick('today')">📅 اليوم</button>
          <button class="btn btn-blue btn-sm" onclick="datePickerQuick('yesterday')">⏮️ أمس</button>
          <button class="btn btn-blue btn-sm" onclick="datePickerQuick('week-ago')">📅 قبل أسبوع</button>
          <button class="btn btn-blue btn-sm" onclick="datePickerQuick('month-start')">📅 بداية الشهر</button>
        </div>
      </div>
      
      <div class="modal-actions">
        <button class="btn btn-primary btn-sm" onclick="document.getElementById('datePickerModal').classList.add('hidden')">إلغاء</button>
        <button class="btn btn-gold" onclick="applyDatePicker('${branch}')">✓ الذهاب لهذا التاريخ</button>
      </div>
    </div>
  `;
  modal.classList.remove('hidden');
}

function updateDatePickerDays() {
  const monthEl = document.getElementById('datePickerMonth');
  const dayEl = document.getElementById('datePickerDay');
  if (!monthEl || !dayEl) return;
  const m = parseInt(monthEl.value);
  const curD = parseInt(dayEl.value) || 1;
  const daysCount = MONTH_DAYS[m];
  dayEl.innerHTML = Array.from({length:daysCount},(_,i)=>`<option value="${i+1}" ${i+1===Math.min(curD,daysCount)?'selected':''}>${i+1}</option>`).join('');
}

function datePickerQuick(kind) {
  const monthEl = document.getElementById('datePickerMonth');
  const dayEl = document.getElementById('datePickerDay');
  if (!monthEl || !dayEl) return;
  const now = new Date();
  let target;
  if (kind === 'today') target = now;
  else if (kind === 'yesterday') { target = new Date(); target.setDate(target.getDate() - 1); }
  else if (kind === 'week-ago') { target = new Date(); target.setDate(target.getDate() - 7); }
  else if (kind === 'month-start') { target = new Date(); target.setDate(1); }
  else target = now;
  monthEl.value = target.getMonth();
  updateDatePickerDays();
  dayEl.value = target.getDate();
}

function applyDatePicker(branch) {
  const m = parseInt(document.getElementById('datePickerMonth').value);
  const d = parseInt(document.getElementById('datePickerDay').value);
  setBranchDate(branch, m, d);
  document.getElementById('datePickerModal').classList.add('hidden');
  if (typeof showNotif === 'function') showNotif(`📅 الذهاب إلى ${d} ${MONTHS[m]}`, 'success');
}

function updateBranchDateInfo(branch) {
  const el = document.getElementById(`${branch}_dateInfo`);
  if (!el) return;
  const m = getSelMonth(branch), d = getSelDay(branch);
  const today = new Date();
  const isToday = m === today.getMonth() && d === today.getDate();
  el.innerHTML = `📆 ${d} ${MONTHS[m]} 2026${isToday ? ' <span style="color:var(--green);font-weight:800;">(اليوم)</span>' : ''}`;
}

function getSelMonth(branch) { return parseInt(document.getElementById(`${branch}_month`)?.value ?? currentMonth); }
function getSelDay(branch) { return parseInt(document.getElementById(`${branch}_day`)?.value ?? currentDay); }

function setResult(branch, itemId, val) {
  // Editing requires ops PIN session
  if (typeof canEditNow === 'function' && !canEditNow()) {
    requireOpsPin(() => setResult(branch, itemId, val));
    return;
  }
  const month = getSelMonth(branch), day = getSelDay(branch);
  const visit = getVisitData(branch, month, day);
  const oldVal = visit.results[itemId];
  visit.results[itemId] = val;
  saveData(); renderChecklist(branch); updateScore(branch);
  if (val === 'fail') checkRepeatedAlert(branch, itemId, month, day);
  
  // CRITICAL item failure → strong warning (handles built-in + user-marked critical)
  const itemDef = CHECKLIST.flatMap(s=>s.items).find(i=>i.id===itemId);
  const userCritical = visit.userCritical?.[itemId] === true;
  const isCritical = itemDef?.critical || userCritical;
  if (val === 'fail' && isCritical) {
    showCriticalAlert(branch, itemDef);
  }
  
  // History
  if (typeof addHistoryEntry === 'function' && oldVal !== val) {
    const itemText = itemDef?.text || itemId;
    addHistoryEntry({
      type: 'evaluation', action: oldVal ? 'update' : 'create',
      target: `${BRANCH_NAMES[branch]} • ${itemText.substring(0,40)}`,
      details: `${val === 'ok' ? '✅ مطابق' : '❌ غير مطابق'}${isCritical ? ' 🚨 [بند حرج]' : ''} (${day} ${MONTHS[month]})`
    });
  }
}

// Clear/undo a result selection
function clearResult(branch, itemId) {
  if (typeof canEditNow === 'function' && !canEditNow()) {
    requireOpsPin(() => clearResult(branch, itemId));
    return;
  }
  const month = getSelMonth(branch), day = getSelDay(branch);
  const visit = getVisitData(branch, month, day);
  const oldVal = visit.results[itemId];
  if (!oldVal) return;
  delete visit.results[itemId];
  // Also clear dependent fields
  delete visit.deptAssign?.[itemId];
  delete visit.reported24h?.[itemId];
  saveData(); renderChecklist(branch); updateScore(branch);
  
  if (typeof addHistoryEntry === 'function') {
    const itemText = CHECKLIST.flatMap(s=>s.items).find(i=>i.id===itemId)?.text || itemId;
    addHistoryEntry({
      type: 'evaluation', action: 'delete',
      target: `${BRANCH_NAMES[branch]} • ${itemText.substring(0,40)}`,
      details: `↩️ تم التراجع عن الاختيار (${day} ${MONTHS[month]})`
    });
  }
  if (typeof showNotif === 'function') showNotif('↩️ تم التراجع', 'info');
}

// Toggle user-marked critical flag for an item
function toggleUserCritical(branch, itemId, isCritical) {
  if (typeof canEditNow === 'function' && !canEditNow()) {
    requireOpsPin(() => toggleUserCritical(branch, itemId, isCritical));
    return;
  }
  const month = getSelMonth(branch), day = getSelDay(branch);
  const visit = getVisitData(branch, month, day);
  if (!visit.userCritical) visit.userCritical = {};
  if (isCritical) visit.userCritical[itemId] = true;
  else delete visit.userCritical[itemId];
  saveData(); renderChecklist(branch); updateScore(branch);
  
  if (typeof addHistoryEntry === 'function') {
    const itemText = CHECKLIST.flatMap(s=>s.items).find(i=>i.id===itemId)?.text || itemId;
    addHistoryEntry({
      type: 'evaluation', action: 'update',
      target: `${BRANCH_NAMES[branch]} • ${itemText.substring(0,40)}`,
      details: isCritical ? '🚨 تم جعل البند حرجاً' : 'تم إلغاء الحرج عن البند'
    });
  }
  if (typeof showNotif === 'function') showNotif(isCritical ? '🚨 البند أصبح حرجاً' : 'تم إلغاء الحرج', 'info');
}

// Show a strong, blocking alert when a CRITICAL item fails
function showCriticalAlert(branch, item) {
  // Audio chime
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.value = 0.2;
    osc.start();
    setTimeout(() => { osc.frequency.value = 660; }, 200);

  // Vibrate on mobile (3 strong pulses)

  // Visual blocking modal

  modal.innerHTML = `
    <div class="modal-box critical-modal-box" style="max-width:520px;border:3px solid #C0392B;background:linear-gradient(135deg,#5A0E1A,#3A0810);box-shadow:0 0 60px rgba(192,57,43,0.8);">

          بند حرج (CRITICAL) غير مطابق
        </div>
      </div>
      <div style="background:rgba(192,57,43,0.2);border:2px solid #C0392B;border-radius:12px;padding:14px;margin-bottom:14px;">
        <div style="font-size:14px;color:#F0E6D3;margin-bottom:6px;font-weight:700;">🏪 الفرع:</div>
        <div style="font-size:18px;color:#FFE08A;font-weight:900;margin-bottom:10px;">${BRANCH_NAMES[branch]}</div>
        <div style="font-size:14px;color:#F0E6D3;margin-bottom:6px;font-weight:700;">📋 البند الحرج:</div>
        <div style="font-size:17px;color:#fff;font-weight:800;line-height:1.5;">
          ${item.icon} ${item.text}
        </div>
      </div>
      <div style="background:rgba(0,0,0,0.3);border-radius:10px;padding:12px;margin-bottom:14px;font-size:13px;color:#F0E6D3;line-height:1.7;">
        ⚠️ <strong style="color:#FFE08A;">هذا البند حرج للغاية</strong> ولا يمكن التساهل فيه. 
        يجب على مدير الفرع <strong>المعالجة الفورية</strong> ورفع صورة "بعد التصحيح" في أقرب وقت.
        سيتم رصد هذا البند في الأكشن بلان بأولوية قصوى.
      </div>
      <div class="modal-actions" style="justify-content:center;">
        <button class="btn btn-red" style="font-size:16px;padding:12px 32px;font-weight:800;" onclick="document.getElementById('criticalAlertModal').classList.add('hidden');">
          ✓ تم الاطلاع — سيتم العمل عليه فوراً
        </button>
      </div>
    </div>
  `;
  modal.classList.remove('hidden');
  
  // Also a toast notification
  if (typeof showNotif === 'function') {
    showNotif('🚨 تحذير شديد: بند حرج غير مطابق في فرع ' + BRANCH_NAMES[branch], 'error');

function setDept(branch, itemId, val) {
  if (typeof canEditNow === 'function' && !canEditNow()) {
    requireOpsPin(() => setDept(branch, itemId, val));
    return;
  }
  const month = getSelMonth(branch), day = getSelDay(branch);
  const visit = getVisitData(branch, month, day);
  visit.deptAssign[itemId] = val;
  if (val === 'الفرع') delete visit.reported24h[itemId];
  saveData(); renderChecklist(branch); updateScore(branch);
}

function setReported24h(branch, itemId, val) {
  if (typeof canEditNow === 'function' && !canEditNow()) {
    requireOpsPin(() => setReported24h(branch, itemId, val));
    return;
  }
  const month = getSelMonth(branch), day = getSelDay(branch);
  const visit = getVisitData(branch, month, day);
  visit.reported24h[itemId] = val;
  saveData(); renderChecklist(branch); updateScore(branch);
}

function checkRepeated(branch, itemId, month, day) {
  for (let m = 0; m <= month; m++) {
    const maxD = m === month ? day - 1 : MONTH_DAYS[m];
    for (let d = 1; d <= maxD; d++) {
      const key = getKey(branch, m, d);
      if (appData[key]?.results[itemId] === 'fail') return true;
    }
  }
  return false;
}

function getRepeatDate(branch, itemId, month, day) {
  for (let m = 0; m <= month; m++) {
    const maxD = m === month ? day - 1 : MONTH_DAYS[m];
    for (let d = 1; d <= maxD; d++) {
      const key = getKey(branch, m, d);
      if (appData[key]?.results[itemId] === 'fail') return `${d} ${MONTHS[m]}`;
    }
  }
  return '';
}

function checkRepeatedAlert(branch, itemId, month, day) {
  if (checkRepeated(branch, itemId, month, day)) {
    const itemText = CHECKLIST.flatMap(s=>s.items).find(i=>i.id===itemId)?.text || itemId;
    const alertDiv = document.getElementById(`${branch}_repeat_alert`);
    if (alertDiv) {
      alertDiv.innerHTML = `<div class="alert alert-danger">⚠️ تنبيه: البند "<strong>${itemText.substring(0,40)}...</strong>" مكرر من زيارة سابقة!</div>`;
      setTimeout(() => { alertDiv.innerHTML = ''; }, 5000);
    }
  }
}

function updateScore(branch) {
  const month = getSelMonth(branch), day = getSelDay(branch);
  const visit = getVisitData(branch, month, day);
  const { pct, ok, excused, deducted } = calcSmartScore(branch, month, day);
  const el = id => document.getElementById(`${branch}_${id}`);
  if (el('ok_count')) el('ok_count').textContent = ok + excused;
  if (el('fail_count')) el('fail_count').textContent = deducted;
  if (el('excused_count')) el('excused_count').textContent = excused;
  if (el('excused_wrap')) el('excused_wrap').style.opacity = excused > 0 ? '1' : '0.4';
  if (el('pct')) {
    const rating = pct !== null ? scoreRating(pct) : null;
    el('pct').innerHTML = pct !== null 
      ? `<span style="color:${rating.color};">${pct}%</span> <span style="font-size:0.6em;color:${rating.color};font-weight:800;">${rating.emoji} ${rating.label}</span>` 
      : '-';
  }

  const rec = el('action_rec');
  if (rec && pct !== null) {
    let msg = '', cls = '';
    if (pct < 60) { msg = `🔴 <strong>الأداء ضعيف:</strong> اجتماع فوري مع المدير، توثيق المخالفات، إنذار رسمي مع خطة تصحيحية في 48 ساعة.`; cls = 'alert-danger'; }
    else if (pct < 70) { msg = `⚠️ <strong>الأداء متوسط:</strong> برنامج تطوير أسبوعي، متابعة مكثفة، تدريب على البنود الضعيفة.`; cls = 'alert-warning'; }
    else if (pct < 90) { msg = `👍 <strong>الأداء جيد:</strong> استمرار مع التركيز على البنود الضعيفة، زيارة تفقدية خلال أسبوع.`; cls = 'alert-info'; }
    else { msg = `🌟 <strong>الأداء ممتاز:</strong> تهنئة المدير والفريق، مشاركة التجربة مع الفروع، ترشيح للمكافأة الشهرية.`; cls = 'alert-success'; }
    let excusedNote = excused > 0 ? `<div class="alert alert-info" style="margin-top:8px;">💡 <strong>${excused} بند معفى تلقائياً</strong> لأن المدير أبلغ مسبقاً — تُحسب للفرع.</div>` : '';
    rec.innerHTML = `<div class="alert ${cls}">${msg}</div>${excusedNote}`;
  }

  const ap = el('action_plan_items');
  if (ap) {
    const allItems = CHECKLIST.flatMap(s => s.items);
    // Action plan items = all FAIL items (excused fails are still actionable for awareness)
    const failItems = allItems.filter(i => visit.results[i.id] === 'fail');
    
    // Update summary card
    const summary = el('action_plan_status_summary');
    if (summary) {
      const total = failItems.length;
      const done = failItems.filter(i => visit.actionStatus?.[i.id]?.status === 'done').length;
      const inProgress = failItems.filter(i => visit.actionStatus?.[i.id]?.status === 'in-progress').length;
      const pending = total - done - inProgress;
      if (total === 0) {
        summary.innerHTML = '';
      } else {
        const pctDone = total > 0 ? Math.round((done/total)*100) : 0;
        summary.innerHTML = `
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:8px;">
            <div class="ap-stat ap-stat-total"><span class="ap-stat-num">${total}</span><span class="ap-stat-label">إجمالي البنود</span></div>
            <div class="ap-stat ap-stat-pending"><span class="ap-stat-num">${pending}</span><span class="ap-stat-label">⏳ معلقة</span></div>
            <div class="ap-stat ap-stat-progress"><span class="ap-stat-num">${inProgress}</span><span class="ap-stat-label">🔄 قيد التنفيذ</span></div>
            <div class="ap-stat ap-stat-done"><span class="ap-stat-num">${done}</span><span class="ap-stat-label">✅ تم الإنجاز</span></div>
          </div>
          <div class="ap-progress-bar"><div class="ap-progress-fill" style="width:${pctDone}%"></div></div>
          <div style="text-align:center;font-size:var(--fs-xs);color:var(--text-muted);font-weight:700;margin-top:4px;">نسبة التنفيذ: <strong style="color:var(--green);">${pctDone}%</strong></div>
        `;
      }
    }
    
    if (failItems.length === 0) {
      ap.innerHTML = `<div class="alert alert-success">✅ لا توجد بنود تحتاج إلى أكشن بلان — كل البنود مطابقة!</div>`;
    } else {
      const isManager = currentRole === 'manager';
      ap.innerHTML = failItems.map(item => {
        const dept = visit.deptAssign[item.id] || 'الفرع';
        const reported = visit.reported24h[item.id];
        const isExcused = dept !== 'الفرع' && reported === true;
        const opsNote = visit.notes && visit.notes[item.id] || '';
        const opsComment = visit.comments && visit.comments[item.id] || '';
        const aStatus = visit.actionStatus?.[item.id] || { status:'pending' };
        const isDone = aStatus.status === 'done';
        const isInProgress = aStatus.status === 'in-progress';
        const statusBorder = isDone ? 'var(--green)' : isInProgress ? 'var(--orange)' : 'var(--red)';
        const statusBg = isDone ? 'rgba(39,174,96,0.10)' : isInProgress ? 'rgba(211,84,0,0.08)' : 'transparent';
        
        // Branch comments timeline (multiple comments allowed)
        const branchEntries = aStatus.entries || [];
        const entriesHtml = branchEntries.length > 0 ? `
          <div class="ap-entries">
            <div style="font-size:var(--fs-xs);color:var(--gold);font-weight:800;margin-bottom:6px;">💬 سجل تنفيذ الفرع:</div>
            ${branchEntries.map(e => `
              <div class="ap-entry ${e.type==='done'?'done':''}">
                <div class="ap-entry-meta">
                  <span>👔 ${e.user||'مدير الفرع'} ${e.type==='done'?'<span style="color:var(--green);">— أنهى التنفيذ</span>':e.type==='progress'?'<span style="color:var(--orange);">— تحديث</span>':''}</span>
                  <span style="font-size:9px;">${new Date(e.timestamp).toLocaleString('ar-QA',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'numeric'})}</span>
                </div>
                <div class="ap-entry-text">${e.text}</div>
              </div>
            `).join('')}
          </div>` : '';
        
        // Status badge
        const statusBadge = isDone 
          ? `<span class="tag tag-green">✅ تم الإنجاز</span>`
          : isInProgress 
          ? `<span class="tag tag-orange">🔄 قيد التنفيذ</span>`
          : `<span class="tag tag-red">⏳ معلق</span>`;
        
        // Action area (different per role)
        let actionArea = '';
        if (isManager) {
          // Branch manager: can add comment + mark done
          if (!isDone) {
            actionArea = `
              <div class="ap-branch-actions">
                <textarea id="ap_comment_${branch}_${item.id}" placeholder="ما الذي تم تنفيذه؟ سجّل خطواتك..." rows="2" style="width:100%;background:var(--bg-card);border:1px solid var(--border);color:var(--text-light);padding:6px 10px;border-radius:6px;font-family:Tajawal,sans-serif;font-size:var(--fs-xs);resize:vertical;"></textarea>
                <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;">
                  <button class="btn btn-blue btn-sm" onclick="addActionPlanEntry('${branch}','${item.id}','progress')">💬 تحديث</button>
                  <button class="btn btn-green btn-sm" onclick="completeActionPlanItem('${branch}','${item.id}')">✅ تم الإنجاز</button>
                </div>
              </div>`;
          } else {
            actionArea = `
              <div class="ap-branch-actions">
                <button class="btn btn-orange btn-sm" onclick="reopenActionPlanItem('${branch}','${item.id}')">↩️ إعادة فتح البند</button>
              </div>`;
          }
        } else {
          // Operations manager: read-only view of branch progress + can add direction note
          actionArea = `
            <div class="ap-ops-actions">
              <input type="text" placeholder="إجراء/توجيه من مدير التشغيل..." 
                style="width:100%;background:var(--bg-card);border:1px solid var(--border);color:var(--text-light);padding:6px 10px;border-radius:6px;font-family:Tajawal,sans-serif;font-size:var(--fs-xs);"
                value="${opsNote.replace(/"/g,'&quot;')}"
                oninput="saveNote('${branch}','${item.id}',this.value)">
              ${isDone?'':`<button class="btn btn-purple btn-sm" style="margin-top:6px;" onclick="opsForceCompleteAP('${branch}','${item.id}')">⚡ تأكيد الإنجاز (إدارياً)</button>`}
            </div>`;
        }
        
        return `
        <div class="action-plan-item ap-item-${aStatus.status||'pending'}" style="border-right-color:${statusBorder};background:${statusBg};">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:5px;margin-bottom:6px;">
            <span style="font-weight:700;font-size:var(--fs-sm);flex:1;min-width:200px;">${item.icon} ${item.text}</span>
            <div style="display:flex;gap:4px;flex-wrap:wrap;">
              ${statusBadge}
              <span class="tag ${dept==='الفرع'?'tag-red':'tag-blue'}">${dept}</span>
              ${isExcused?`<span class="tag tag-green">معفى ✅</span>`:''}
            </div>
          </div>
          ${opsNote?`<div class="ap-ops-note">📌 <strong>توجيه مدير التشغيل:</strong> ${opsNote}</div>`:''}
          ${opsComment?`<div class="ap-ops-comment">💬 ملاحظة من التقييم: ${opsComment}</div>`:''}
          
          ${renderBeforeAfterPhotos(branch, item.id, aStatus, isManager)}
          
          ${entriesHtml}
          ${actionArea}
          ${isDone && aStatus.completedAt ? `<div style="margin-top:6px;font-size:var(--fs-xs);color:var(--green);font-weight:800;">✓ تم الإنجاز في ${new Date(aStatus.completedAt).toLocaleString('ar-QA')}</div>`:''}
        </div>`;
      }).join('');
    }
  }
}

function onMonthChange(branch) {
  const month = parseInt(document.getElementById(`${branch}_month`).value);
  const daysCount = MONTH_DAYS[month];
  const daySelect = document.getElementById(`${branch}_day`);
  const curDay = parseInt(daySelect.value);
  daySelect.innerHTML = Array.from({length:daysCount},(_,i)=>`<option value="${i+1}" ${i+1===Math.min(curDay,daysCount)?'selected':''}>${i+1}</option>`).join('');
  renderChecklist(branch); updateScore(branch);
}

function onDayChange(branch) { renderChecklist(branch); updateScore(branch); }
function onManagerChange(branch) {
  if (typeof canEditNow === 'function' && !canEditNow()) {
    // Revert input value
    const month = getSelMonth(branch), day = getSelDay(branch);
    const visit = getVisitData(branch, month, day);
    document.getElementById(`${branch}_manager`).value = (visit.managers && visit.managers.length) ? visit.managers.join('، ') : (visit.manager || '');
    requireOpsPin(() => {});
    return;
  }
  const month = getSelMonth(branch), day = getSelDay(branch);
  const visit = getVisitData(branch, month, day);
  const raw = document.getElementById(`${branch}_manager`).value;
  // Split by Arabic comma، English comma, or "+" allowing multiple managers
  const names = raw.split(/[،,+]/).map(s => s.trim()).filter(s => s.length > 0);
  visit.managers = names;
  // Keep legacy field for backward compatibility
  visit.manager = names.join('، ');
  saveData();
}
function onShiftChange(branch) {
  if (typeof canEditNow === 'function' && !canEditNow()) {
    const month = getSelMonth(branch), day = getSelDay(branch);
    const visit = getVisitData(branch, month, day);
    document.getElementById(`${branch}_shift`).value = visit.shift || '';
    requireOpsPin(() => {});
    return;
  }
  const month = getSelMonth(branch), day = getSelDay(branch);
  const visit = getVisitData(branch, month, day);
  visit.shift = document.getElementById(`${branch}_shift`).value;
  saveData();
}

function handleImages(branch, input) {
  const month = getSelMonth(branch), day = getSelDay(branch);
  const visit = getVisitData(branch, month, day);
  if (!visit.images) visit.images = {};
  const files = Array.from(input.files);
  let loaded = 0;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      visit.images[Date.now() + '_' + Math.random()] = e.target.result;
      loaded++;
      if (loaded === files.length) { saveData(); renderImages(branch, month, day); }
    };
    reader.readAsDataURL(file);
  });
}

function renderImages(branch, month, day) {
  const visit = getVisitData(branch, month, day);
  const container = document.getElementById(`${branch}_imgs`);
  if (!container) return;
  container.innerHTML = Object.values(visit.images||{}).map(src=>`<img src="${src}" class="uploaded-img">`).join('');
}

// ===================== ACTION PLAN MANAGEMENT =====================
// Branch manager adds a comment/progress entry to an action plan item
function addActionPlanEntry(branch, itemId, type) {
  const month = getSelMonth(branch), day = getSelDay(branch);
  const visit = getVisitData(branch, month, day);
  const ta = document.getElementById(`ap_comment_${branch}_${itemId}`);
  const text = ta?.value?.trim();
  if (!text) {
    showNotif('⚠️ اكتب تعليقاً أولاً', 'error');
    return;
  }
  if (!visit.actionStatus[itemId]) visit.actionStatus[itemId] = { status:'pending', entries:[] };
  if (!visit.actionStatus[itemId].entries) visit.actionStatus[itemId].entries = [];
  
  const userName = (typeof fbUserName !== 'undefined' && fbUserName) ? fbUserName : `مدير ${BRANCH_NAMES[branch]}`;
  visit.actionStatus[itemId].entries.push({
    user: userName,
    role: currentRole,
    text,
    type: type || 'progress',
    timestamp: new Date().toISOString()
  });
  
  // Update status: pending → in-progress on first comment
  if (visit.actionStatus[itemId].status === 'pending') {
    visit.actionStatus[itemId].status = 'in-progress';
  }
  
  saveData();
  if (ta) ta.value = '';
  updateScore(branch);
  
  // History + notification
  if (typeof addHistoryEntry === 'function') {
    const itemText = CHECKLIST.flatMap(s=>s.items).find(i=>i.id===itemId)?.text || itemId;
    addHistoryEntry({
      type:'action-plan', action:'update',
      target:`أكشن بلان: ${itemText.substring(0,40)}`,
      details:`🏪 ${BRANCH_NAMES[branch]} • تحديث: ${text.substring(0,50)}`
    });
  }
  if (typeof pushNotify === 'function' && currentRole === 'manager') {
    // Notify ops manager (via Firebase if connected)
    pushNotify('🔄 تحديث أكشن بلان', `${BRANCH_NAMES[branch]} يعمل على بنوده`);
  }
  showNotif('✅ تم حفظ التحديث!', 'success');
}

// Branch manager marks an action plan item as done
function completeActionPlanItem(branch, itemId) {
  const month = getSelMonth(branch), day = getSelDay(branch);
  const visit = getVisitData(branch, month, day);
  const ta = document.getElementById(`ap_comment_${branch}_${itemId}`);
  const completionNote = ta?.value?.trim();
  
  if (!visit.actionStatus[itemId]) visit.actionStatus[itemId] = { status:'pending', entries:[] };
  if (!visit.actionStatus[itemId].entries) visit.actionStatus[itemId].entries = [];
  
  const userName = (typeof fbUserName !== 'undefined' && fbUserName) ? fbUserName : `مدير ${BRANCH_NAMES[branch]}`;
  
  if (completionNote) {
    visit.actionStatus[itemId].entries.push({
      user: userName,
      role: currentRole,
      text: completionNote,
      type: 'done',
      timestamp: new Date().toISOString()
    });
    if (ta) ta.value = '';
  } else {
    // Add a default completion entry
    visit.actionStatus[itemId].entries.push({
      user: userName,
      role: currentRole,
      text: 'تم الإنجاز',
      type: 'done',
      timestamp: new Date().toISOString()
    });
  }
  
  visit.actionStatus[itemId].status = 'done';
  visit.actionStatus[itemId].completedAt = new Date().toISOString();
  visit.actionStatus[itemId].completedBy = userName;
  
  saveData();
  updateScore(branch);
  
  if (typeof addHistoryEntry === 'function') {
    const itemText = CHECKLIST.flatMap(s=>s.items).find(i=>i.id===itemId)?.text || itemId;
    addHistoryEntry({
      type:'action-plan', action:'update',
      target:`✅ إنجاز أكشن بلان: ${itemText.substring(0,40)}`,
      details:`🏪 ${BRANCH_NAMES[branch]} • نُفّذ${completionNote?': '+completionNote.substring(0,40):''}`
    });
  }
  if (typeof pushNotify === 'function' && currentRole === 'manager') {
    pushNotify('✅ بند أكشن بلان مُنجَز!', `${BRANCH_NAMES[branch]} أنجز بنداً جديداً`);
  }
  showNotif('🎉 تم تسجيل إنجاز البند! مدير التشغيل سيراه فوراً.', 'success');
}

// Branch manager re-opens a completed item (in case need re-work)
function reopenActionPlanItem(branch, itemId) {
  if (!confirm('هل تريد إعادة فتح هذا البند؟ سيعود لحالة "قيد التنفيذ".')) return;
  const month = getSelMonth(branch), day = getSelDay(branch);
  const visit = getVisitData(branch, month, day);
  if (!visit.actionStatus[itemId]) return;
  visit.actionStatus[itemId].status = 'in-progress';
  visit.actionStatus[itemId].completedAt = null;
  saveData();
  updateScore(branch);
  if (typeof addHistoryEntry === 'function') {
    const itemText = CHECKLIST.flatMap(s=>s.items).find(i=>i.id===itemId)?.text || itemId;
    addHistoryEntry({
      type:'action-plan', action:'update',
      target:`↩️ إعادة فتح: ${itemText.substring(0,40)}`,
      details:`🏪 ${BRANCH_NAMES[branch]}`
    });
  }
  showNotif('↩️ تم إعادة فتح البند', 'info');
}

// Operations manager forces an action plan item to "done" (administrative override)
function opsForceCompleteAP(branch, itemId) {
  if (currentRole !== 'ops') {
    showNotif('⚠️ هذه الميزة لمدير التشغيل فقط', 'error');
    return;
  }
  if (!confirm('تأكيد إنجاز هذا البند إدارياً؟ سيتم تسجيله باسمك.')) return;
  const month = getSelMonth(branch), day = getSelDay(branch);
  const visit = getVisitData(branch, month, day);
  if (!visit.actionStatus[itemId]) visit.actionStatus[itemId] = { status:'pending', entries:[] };
  if (!visit.actionStatus[itemId].entries) visit.actionStatus[itemId].entries = [];
  
  const userName = (typeof fbUserName !== 'undefined' && fbUserName) ? fbUserName : 'مدير التشغيل';
  visit.actionStatus[itemId].entries.push({
    user: userName,
    role: 'ops',
    text: 'تم تأكيد الإنجاز إدارياً من قبل مدير التشغيل',
    type: 'done',
    timestamp: new Date().toISOString()
  });
  visit.actionStatus[itemId].status = 'done';
  visit.actionStatus[itemId].completedAt = new Date().toISOString();
  visit.actionStatus[itemId].completedBy = userName;
  saveData();
  updateScore(branch);
  if (typeof addHistoryEntry === 'function') {
    const itemText = CHECKLIST.flatMap(s=>s.items).find(i=>i.id===itemId)?.text || itemId;
    addHistoryEntry({
      type:'action-plan', action:'update',
      target:`⚡ إغلاق إداري: ${itemText.substring(0,40)}`,
      details:`🏪 ${BRANCH_NAMES[branch]} • أغلقه مدير التشغيل`
    });
  }
  showNotif('✅ تم إغلاق البند إدارياً', 'success');
}

// ===================== ACTION PLAN BEFORE/AFTER PHOTOS =====================

// renderItemPhotoSlot: shown directly in checklist next to fail items (ops adds photo when evaluating)
// Supports MULTIPLE photos per item (gallery)
function renderItemPhotoSlot(branch, itemId, visitData) {
  const aStatus = visitData.actionStatus?.[itemId];
  // Backward-compatible: read both old single beforePhoto + new beforePhotos[] array
  const photos = getBeforePhotosArray(aStatus);
  const isReadonly = !(typeof isOpsSessionValid === 'function' && isOpsSessionValid());
  
  const galleryHtml = photos.length > 0 ? `
    <div class="check-item-photo-label">📷 صور البند (${photos.length}):</div>
    <div class="check-item-photos-gallery">
      ${photos.map((p, idx) => `
        <div class="check-item-photo-display">
          <img src="${p}" class="check-item-photo" onclick="viewActionPhotoArray('${branch}','${itemId}','before',${idx})" alt="صورة ${idx+1}">
          ${!isReadonly ? `<button class="check-item-photo-remove" onclick="removeBeforePhotoAt('${branch}','${itemId}',${idx})" title="حذف">✕</button>` : ''}
        </div>
      `).join('')}
    </div>
    <span class="check-item-photo-hint">↗️ تظهر تلقائياً في الأكشن بلان</span>
  ` : '';
  
  if (isReadonly && photos.length === 0) {
    return `<div class="check-item-photo-wrap"><div class="check-item-photo-empty-disabled">🔒 لإضافة صور افتح وضع التعديل</div></div>`;
  }
  
  return `
    <div class="check-item-photo-wrap">
      ${galleryHtml}
      ${!isReadonly ? `
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;">
        <button class="btn-add-item-photo" onclick="document.getElementById('item_photo_cam_${branch}_${itemId}').click()" style="flex:1;min-width:140px;">
          📷 من الكاميرا
        </button>
        <button class="btn-add-item-photo" onclick="document.getElementById('item_photo_gal_${branch}_${itemId}').click()" style="flex:1;min-width:140px;">
          🖼️ من الاستوديو (متعدد)
        </button>
      </div>
      <input type="file" id="item_photo_cam_${branch}_${itemId}" accept="image/*" capture="environment" style="display:none" onchange="handleActionPhotoMulti('${branch}','${itemId}','before',this)">
      <input type="file" id="item_photo_gal_${branch}_${itemId}" accept="image/*" multiple style="display:none" onchange="handleActionPhotoMulti('${branch}','${itemId}','before',this)">
      ` : ''}
    </div>`;
}

// Helper: get before photos array (handles old single beforePhoto + new beforePhotos[])
function getBeforePhotosArray(aStatus) {
  if (!aStatus) return [];
  if (Array.isArray(aStatus.beforePhotos) && aStatus.beforePhotos.length > 0) return aStatus.beforePhotos;
  if (aStatus.beforePhoto) return [aStatus.beforePhoto];
  return [];
}
function getAfterPhotosArray(aStatus) {
  if (!aStatus) return [];
  if (Array.isArray(aStatus.afterPhotos) && aStatus.afterPhotos.length > 0) return aStatus.afterPhotos;
  if (aStatus.afterPhoto) return [aStatus.afterPhoto];
  return [];
}
window.getBeforePhotosArray = getBeforePhotosArray;
window.getAfterPhotosArray = getAfterPhotosArray;

// Multi-photo upload (Camera = 1 photo, Gallery = multiple)
async function handleActionPhotoMulti(branch, itemId, slot, input) {
  if (!input?.files?.length) return;
  const files = Array.from(input.files).filter(f => f.type.startsWith('image/'));
  if (files.length === 0) {
    showNotif('⚠️ اختر ملفات صور', 'error');
    return;
  }
  if (slot === 'before') {
    const opsAuthorized = (typeof isOpsSessionValid === 'function' && isOpsSessionValid());
    if (!opsAuthorized) {
      showNotif('🔒 إضافة صور "قبل" لمدير التشغيل فقط', 'error');
      input.value = '';
      return;
    }
  }
  
  showNotif(`⏳ معالجة ${files.length} صورة...`, 'info');
  try {
    const month = getSelMonth(branch), day = getSelDay(branch);
    const visit = getVisitData(branch, month, day);
    if (!visit.actionStatus[itemId]) visit.actionStatus[itemId] = { status: 'pending', entries: [] };
    
    const key = slot === 'before' ? 'beforePhotos' : 'afterPhotos';
    if (!Array.isArray(visit.actionStatus[itemId][key])) {
      // Migrate from old single field
      const old = slot === 'before' ? visit.actionStatus[itemId].beforePhoto : visit.actionStatus[itemId].afterPhoto;
      visit.actionStatus[itemId][key] = old ? [old] : [];
    }
    
    for (const file of files) {
      const dataUrl = await resizeImage(file, 800, 0.72);
      visit.actionStatus[itemId][key].push(dataUrl);
    }
    
    // Keep first photo as legacy single field for compatibility
    if (slot === 'before') visit.actionStatus[itemId].beforePhoto = visit.actionStatus[itemId].beforePhotos[0];
    else visit.actionStatus[itemId].afterPhoto = visit.actionStatus[itemId].afterPhotos[0];
    
    if (slot === 'before') {
      visit.actionStatus[itemId].beforePhotoBy = (typeof fbUserName !== 'undefined' && fbUserName) || 'مدير التشغيل';
      visit.actionStatus[itemId].beforePhotoAt = new Date().toISOString();
    } else {
      visit.actionStatus[itemId].afterPhotoBy = (typeof fbUserName !== 'undefined' && fbUserName) || `مدير ${BRANCH_NAMES[branch]}`;
      visit.actionStatus[itemId].afterPhotoAt = new Date().toISOString();
      if (visit.actionStatus[itemId].status === 'pending') {
        visit.actionStatus[itemId].status = 'in-progress';
      }
    }
    
    saveData();
    updateScore(branch);
    if (typeof renderChecklist === 'function') renderChecklist(branch);
    showNotif(`✅ تم إضافة ${files.length} صورة ${slot==='before'?'للبند':'بعد التصحيح'}`, 'success');
  } catch(err) {
    console.error('Photo upload error:', err);
    showNotif('❌ ' + err.message, 'error');
  }
  input.value = '';
}
window.handleActionPhotoMulti = handleActionPhotoMulti;

// Remove a specific photo by index
function removeBeforePhotoAt(branch, itemId, idx) {
  if (!confirm(`حذف الصورة رقم ${idx+1}؟`)) return;
  const month = getSelMonth(branch), day = getSelDay(branch);
  const visit = getVisitData(branch, month, day);
  const aSt = visit.actionStatus?.[itemId];
  if (!aSt) return;
  const photos = getBeforePhotosArray(aSt);
  photos.splice(idx, 1);
  aSt.beforePhotos = photos;
  aSt.beforePhoto = photos[0] || null;
  saveData();
  updateScore(branch);
  if (typeof renderChecklist === 'function') renderChecklist(branch);
  showNotif('🗑️ تم الحذف', 'info');
}
function removeAfterPhotoAt(branch, itemId, idx) {
  if (!confirm(`حذف صورة "بعد" رقم ${idx+1}؟`)) return;
  const month = getSelMonth(branch), day = getSelDay(branch);
  const visit = getVisitData(branch, month, day);
  const aSt = visit.actionStatus?.[itemId];
  if (!aSt) return;
  const photos = getAfterPhotosArray(aSt);
  photos.splice(idx, 1);
  aSt.afterPhotos = photos;
  aSt.afterPhoto = photos[0] || null;
  saveData();
  if (typeof renderChecklist === 'function') renderChecklist(branch);
  showNotif('🗑️ تم الحذف', 'info');
}
window.removeBeforePhotoAt = removeBeforePhotoAt;
window.removeAfterPhotoAt = removeAfterPhotoAt;

// View an array of photos in lightbox
function viewActionPhotoArray(branch, itemId, slot, startIdx) {
  const month = getSelMonth(branch), day = getSelDay(branch);
  const visit = getVisitData(branch, month, day);
  const aSt = visit.actionStatus?.[itemId];
  if (!aSt) return;
  const photos = slot === 'before' ? getBeforePhotosArray(aSt) : getAfterPhotosArray(aSt);
  if (photos.length === 0) return;
  
  let currentIdx = startIdx || 0;
  
  let lightbox = document.getElementById('photoLightbox');
  if (!lightbox) {
    lightbox = document.createElement('div');
    lightbox.id = 'photoLightbox';
    lightbox.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);z-index:10000;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px;';
    document.body.appendChild(lightbox);
  }
  
  function show() {
    lightbox.innerHTML = `
      <div style="color:#C9A84C;margin-bottom:10px;text-align:center;font-weight:700;">
        ${slot==='before'?'📷 صورة البند':'✅ صورة بعد التصحيح'} — ${currentIdx+1}/${photos.length}
      </div>
      <img src="${photos[currentIdx]}" style="max-width:95%;max-height:75vh;border-radius:12px;border:3px solid #C9A84C;">
      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center;">
        ${photos.length > 1 ? `
          <button onclick="event.stopPropagation()" id="lbPrev" style="padding:8px 18px;background:#C9A84C;color:#4A0F1A;border:none;border-radius:8px;font-weight:800;cursor:pointer;">⬅️ السابق</button>
          <button onclick="event.stopPropagation()" id="lbNext" style="padding:8px 18px;background:#C9A84C;color:#4A0F1A;border:none;border-radius:8px;font-weight:800;cursor:pointer;">التالي ➡️</button>
        ` : ''}
        <button onclick="document.getElementById('photoLightbox').remove()" style="padding:8px 18px;background:#C0392B;color:#fff;border:none;border-radius:8px;font-weight:800;cursor:pointer;">✕ إغلاق</button>
      </div>
    `;
    if (photos.length > 1) {
      document.getElementById('lbPrev').onclick = (e) => { e.stopPropagation(); currentIdx = (currentIdx - 1 + photos.length) % photos.length; show(); };
      document.getElementById('lbNext').onclick = (e) => { e.stopPropagation(); currentIdx = (currentIdx + 1) % photos.length; show(); };
    }
  }
  show();
  lightbox.onclick = (e) => { if (e.target === lightbox) lightbox.remove(); };
  lightbox.style.display = 'flex';
}
window.viewActionPhotoArray = viewActionPhotoArray;

// renderBeforeAfterPhotos: shows two photo slots in action plan
// "before" photo is shared with the checklist item (ops can add from either place)
// "after" photo is the corrective action by branch manager
function renderBeforeAfterPhotos(branch, itemId, aStatus, isManager) {
  const beforePhoto = aStatus?.beforePhoto || null;
  const afterPhoto = aStatus?.afterPhoto || null;
  const opsAuthorized = (typeof isOpsSessionValid === 'function' && isOpsSessionValid());
  
  const beforeBlock = `
    <div class="ap-photo-block ${beforePhoto?'has-photo':''}">
      <div class="ap-photo-label">
        <span>📷 صورة البند (قبل)</span>
        <span style="font-size:9px;color:var(--text-muted);">(من التقييم)</span>
      </div>
      ${beforePhoto ? `
        <div class="ap-photo-wrap">
          <img src="${beforePhoto}" class="ap-photo" onclick="viewActionPhoto('${branch}','${itemId}','before')" alt="قبل">
          ${opsAuthorized ? `<button class="ap-photo-remove" onclick="removeActionPhoto('${branch}','${itemId}','before')" title="حذف">✕</button>` : ''}
        </div>
      ` : (opsAuthorized ? `
        <div class="ap-photo-empty" onclick="document.getElementById('ap_before_${branch}_${itemId}').click()">
          <span style="font-size:20px;">📷</span>
          <span style="font-size:var(--fs-xs);font-weight:700;">إضافة صورة البند</span>
        </div>
        <input type="file" id="ap_before_${branch}_${itemId}" accept="image/*" capture="environment" style="display:none" onchange="handleActionPhoto('${branch}','${itemId}','before',this)">
      ` : `<div class="ap-photo-empty disabled"><span style="font-size:var(--fs-xs);color:var(--text-muted);font-weight:600;">— لم تُضف صورة في التقييم —</span></div>`)}
    </div>`;
  
  // After-photo: ANY user can add (it's the corrective action by the branch manager)
  const afterBlock = `
    <div class="ap-photo-block ${afterPhoto?'has-photo done':''}">
      <div class="ap-photo-label">
        <span>✅ صورة بعد التصحيح</span>
        <span style="font-size:9px;color:var(--text-muted);">(الإجراء التصحيحي)</span>
      </div>
      ${afterPhoto ? `
        <div class="ap-photo-wrap">
          <img src="${afterPhoto}" class="ap-photo" onclick="viewActionPhoto('${branch}','${itemId}','after')" alt="بعد">
          <button class="ap-photo-remove" onclick="removeActionPhoto('${branch}','${itemId}','after')" title="حذف">✕</button>
        </div>
      ` : `
        <div class="ap-photo-empty" onclick="document.getElementById('ap_after_${branch}_${itemId}').click()">
          <span style="font-size:20px;">📸</span>
          <span style="font-size:var(--fs-xs);font-weight:700;">صوّر بعد التصحيح</span>
        </div>
        <input type="file" id="ap_after_${branch}_${itemId}" accept="image/*" capture="environment" style="display:none" onchange="handleActionPhoto('${branch}','${itemId}','after',this)">
      `}
    </div>`;
  
  return `<div class="ap-photos-grid">${beforeBlock}${afterBlock}</div>`;
}

// Resize image to max 800px wide and ~70% jpg quality to save storage
async function resizeImage(file, maxWidth = 800, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const ratio = img.width > maxWidth ? maxWidth / img.width : 1;
        const w = Math.round(img.width * ratio);
        const h = Math.round(img.height * ratio);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('Invalid image'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

async function handleActionPhoto(branch, itemId, slot, input) {
  if (!input?.files?.[0]) return;
  const file = input.files[0];
  if (!file.type.startsWith('image/')) {
    showNotif('⚠️ اختر ملف صورة', 'error');
    return;
  }
  
  // Permission check: 'before' is ops only; 'after' is branch manager (or ops)
  if (slot === 'before') {
    const opsAuthorized = (typeof isOpsSessionValid === 'function' && isOpsSessionValid()) || (typeof currentRole !== 'undefined' && currentRole === 'ops');
    if (!opsAuthorized) {
      showNotif('🔒 إضافة صورة "قبل" لمدير التشغيل فقط', 'error');
      input.value = '';
      return;
    }
  }
  
  showNotif('⏳ جاري معالجة الصورة...', 'info');
  try {
    const dataUrl = await resizeImage(file);
    const month = getSelMonth(branch), day = getSelDay(branch);
    const visit = getVisitData(branch, month, day);
    if (!visit.actionStatus[itemId]) visit.actionStatus[itemId] = { status: 'pending', entries: [] };
    
    if (slot === 'before') {
      visit.actionStatus[itemId].beforePhoto = dataUrl;
      visit.actionStatus[itemId].beforePhotoBy = (typeof fbUserName !== 'undefined' && fbUserName) || 'مدير التشغيل';
      visit.actionStatus[itemId].beforePhotoAt = new Date().toISOString();
    } else {
      visit.actionStatus[itemId].afterPhoto = dataUrl;
      visit.actionStatus[itemId].afterPhotoBy = (typeof fbUserName !== 'undefined' && fbUserName) || `مدير ${BRANCH_NAMES[branch]}`;
      visit.actionStatus[itemId].afterPhotoAt = new Date().toISOString();
      // Auto-mark as in-progress if pending
      if (visit.actionStatus[itemId].status === 'pending') {
        visit.actionStatus[itemId].status = 'in-progress';
      }
    }
    saveData();
    updateScore(branch);
    // Re-render checklist too (so the photo appears immediately in the item)
    if (typeof renderChecklist === 'function') renderChecklist(branch);
    
    if (typeof addHistoryEntry === 'function') {
      const itemText = CHECKLIST.flatMap(s=>s.items).find(i=>i.id===itemId)?.text || itemId;
      addHistoryEntry({
        type: 'action-plan', action: 'update',
        target: `📷 صورة ${slot==='before'?'قبل':'بعد'}: ${itemText.substring(0,40)}`,
        details: `🏪 ${BRANCH_NAMES[branch]} — إضافة صورة ${slot==='before'?'قبل التصحيح':'بعد التصحيح'}`
      });
    }
    showNotif(`✅ تم إضافة صورة ${slot==='before'?'قبل التصحيح':'بعد التصحيح'}`, 'success');
  } catch(err) {
    console.error('Photo error:', err);
    showNotif('❌ خطأ في معالجة الصورة: ' + err.message, 'error');
  }
  input.value = '';
}

function removeActionPhoto(branch, itemId, slot) {
  if (!confirm(`حذف صورة ${slot==='before'?'قبل التصحيح':'بعد التصحيح'}؟`)) return;
  const month = getSelMonth(branch), day = getSelDay(branch);
  const visit = getVisitData(branch, month, day);
  if (!visit.actionStatus[itemId]) return;
  if (slot === 'before') {
    delete visit.actionStatus[itemId].beforePhoto;
    delete visit.actionStatus[itemId].beforePhotoBy;
    delete visit.actionStatus[itemId].beforePhotoAt;
  } else {
    delete visit.actionStatus[itemId].afterPhoto;
    delete visit.actionStatus[itemId].afterPhotoBy;
    delete visit.actionStatus[itemId].afterPhotoAt;
  }
  saveData();
  updateScore(branch);
  if (typeof renderChecklist === 'function') renderChecklist(branch);
  showNotif('🗑️ تم الحذف', 'info');
}

function viewActionPhoto(branch, itemId, slot) {
  const month = getSelMonth(branch), day = getSelDay(branch);
  const visit = getVisitData(branch, month, day);
  const aSt = visit.actionStatus?.[itemId];
  if (!aSt) return;
  const photo = slot === 'before' ? aSt.beforePhoto : aSt.afterPhoto;
  const author = slot === 'before' ? aSt.beforePhotoBy : aSt.afterPhotoBy;
  const dateAt = slot === 'before' ? aSt.beforePhotoAt : aSt.afterPhotoAt;
  if (!photo) return;
  
  // Show in a lightbox-style modal
  let lightbox = document.getElementById('photoLightbox');
  if (!lightbox) {
    lightbox = document.createElement('div');
    lightbox.id = 'photoLightbox';
    lightbox.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);z-index:10000;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-direction:column;padding:20px;';
    lightbox.onclick = () => lightbox.remove();
    document.body.appendChild(lightbox);
  }
  lightbox.innerHTML = `
    <div style="color:#C9A84C;margin-bottom:10px;text-align:center;font-weight:700;">
      ${slot==='before'?'📷 صورة قبل التصحيح':'✅ صورة بعد التصحيح'}
    </div>
    <img src="${photo}" style="max-width:95%;max-height:80vh;border-radius:12px;border:3px solid #C9A84C;box-shadow:0 12px 40px rgba(0,0,0,0.6);">
    <div style="color:#BCA98A;margin-top:10px;text-align:center;font-size:var(--fs-sm);font-weight:700;">
      ${author?'بواسطة: '+author:''}${dateAt?' • '+new Date(dateAt).toLocaleString('ar-QA'):''}
    </div>
    <div style="color:#999;margin-top:8px;font-size:var(--fs-xs);">اضغط في أي مكان للإغلاق</div>
  `;
  lightbox.style.display = 'flex';
}
